function attachScmFormEvents() {
  SCM_ANEXOS_DATA = [];
  document.getElementById("scm-tipo-fornecedor").onchange = function () {
    document.getElementById("scm-fornecedor-block").style.display = (this.value === "escolhido" || this.value === "exclusivo") ? "block" : "none";
  };
  document.getElementById("scm-tipo-solicitacao").onchange = function () {
    document.getElementById("scm-capex-block").style.display = (this.value === "melhoria_capex") ? "block" : "none";
  };
  document.getElementById("scm-centro-custo").onchange = function () {
    document.getElementById("scm-centro-custo-outro-block").style.display = (this.value === "Outro") ? "block" : "none";
  };
  document.getElementById("scm-anexos").onchange = function (e) {
    const files = Array.from(e.target.files || []);
    const nomesEl = document.getElementById("scm-anexos-nomes");
    const previewEl = document.getElementById("scm-anexos-preview");
    nomesEl.textContent = files.map(function (f) { return f.name; }).join(", ");
    previewEl.innerHTML = "";
    SCM_ANEXOS_DATA = [];
    files.forEach(function (file) {
      const reader = new FileReader();
      reader.onload = function (evt) {
        SCM_ANEXOS_DATA.push({ name: file.name, dataUrl: evt.target.result });
        if (file.type.indexOf("image/") === 0) {
          const img = document.createElement("img");
          img.src = evt.target.result;
          img.style.cssText = "width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #e7f0ec;";
          previewEl.appendChild(img);
        } else {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = file.name;
          previewEl.appendChild(tag);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  document.getElementById("scm-add-item-btn").onclick = function () {
    const wrap = document.createElement("div");
    wrap.innerHTML = scmItemRowHtml();
    document.getElementById("scm-items-list").appendChild(wrap.firstElementChild);
    bindScmRemoveButtons();
  };
  bindScmRemoveButtons();

  document.getElementById("scm-submit-btn").onclick = function () {
    const errBox = document.getElementById("scm-form-error");
    const time = document.getElementById("scm-time").value;
    const tipoSolicitacao = document.getElementById("scm-tipo-solicitacao").value;
    const camm = document.getElementById("scm-camm").value;
    const urgencia = document.getElementById("scm-urgencia").value;
    const centroCustoSel = document.getElementById("scm-centro-custo").value;
    const centroCusto = centroCustoSel === "Outro" ? document.getElementById("scm-centro-custo-outro").value.trim() : centroCustoSel;
    const numeroOM = document.getElementById("scm-om").value.trim();
    const tipoFornecedor = document.getElementById("scm-tipo-fornecedor").value;
    const nomeFornecedor = document.getElementById("scm-nome-fornecedor") ? document.getElementById("scm-nome-fornecedor").value.trim() : "";
    const tipoPedido = document.getElementById("scm-tipo-pedido").value;
    const descricaoUso = document.getElementById("scm-descricao-uso").value.trim();
    const capexProjeto = document.getElementById("scm-capex") ? document.getElementById("scm-capex").value.trim() : "";
    const links = document.getElementById("scm-links").value.trim();

    const missing = [];
    if (!time) missing.push("Time Solicitante");
    if (!camm) missing.push("CAMM");
    if (!urgencia) missing.push("Urgência");
    if (!centroCusto) missing.push("Centro de Custo");
    if (!numeroOM) missing.push("Nº OM");
    if (!tipoPedido) missing.push("Tipo de Pedido");
    if (!descricaoUso) missing.push("Descrição de uso do material");

    const itemCards = document.querySelectorAll(".scm-item-card");
    const itens = [];
    let itemError = false;
    itemCards.forEach(function (card, idx) {
      const codigoSistema = card.querySelector(".scm-f-codigo").value.trim();
      const descricaoItem = card.querySelector(".scm-f-descricao").value.trim();
      const quantidade = card.querySelector(".scm-f-quantidade").value.trim();
      const estoqueMinimo = card.querySelector(".scm-f-estoque").value.trim();
      const marcaModeloSerie = card.querySelector(".scm-f-marca").value.trim();
      if (!codigoSistema || !quantidade) itemError = true;
      itens.push({ id: "item-" + idx, codigoSistema, descricaoItem, quantidade, estoqueMinimo, marcaModeloSerie });
    });

    if (missing.length) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha os campos obrigatórios: ' + esc(missing.join(", ")) + '</div>';
      return;
    }
    if (itemError) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha ao menos Código Sistema e Quantidade em cada item.</div>';
      return;
    }

    const novoCodigo = nextScmCode();
    const user = STATE.currentUser;
    const novaScm = {
      id: "scm-" + Date.now(),
      codigo: novoCodigo,
      timeSolicitante: time,
      tipoSolicitacao: tipoSolicitacao,
      capexProjeto: capexProjeto,
      camm: camm,
      urgencia: urgencia,
      centroCusto: centroCusto,
      numeroOM: numeroOM,
      tipoFornecedor: tipoFornecedor,
      nomeFornecedor: nomeFornecedor,
      tipoPedido: tipoPedido,
      descricaoUso: descricaoUso,
      itens: itens,
      anexos: SCM_ANEXOS_DATA.slice(),
      links: links,
      solicitanteId: user.id,
      solicitanteNome: user.nome,
      solicitanteEmail: user.usuario,
      solicitanteEmailLider: (user.emailLider || "").trim(),
      solicitanteTime: user.time || "",
      dataCriacao: new Date().toISOString(),
      status: "pendente_aprovacao_lider",
      observacaoLider: "",
      observacaoAlmoxarife: "",
      numeroProcessoME: "",
    };
    SCM_LIST.unshift(novaScm);
    saveScm(SCM_LIST);

    const liderMsg = novaScm.solicitanteEmailLider
      ? 'Um e-mail seria enviado para <b>' + esc(novaScm.solicitanteEmailLider) + '</b> avisando sobre a nova solicitação de compra.'
      : 'Este usuário não tem e-mail de líder cadastrado — peça ao Admin para completar o cadastro dele.';

    const el = document.getElementById("almox-tab-content");
    el.innerHTML = '<div class="hint-box" style="background:#e3eff0; color:#003C41; margin-bottom:16px;"><b>Solicitação de compra enviada!</b> Código gerado: <b>' + esc(novoCodigo) + '</b>. ' + liderMsg + '</div>' + renderScmForm();
    attachScmFormEvents();
  };
}

  return '<div class="sci-section-title">Anexos</div>' + imgs + linksHtml;

function scmLabel(field, value) {
  const maps = {
    tipoSolicitacao: { normal: "Normal", emergencial: "Emergencial", melhoria_capex: "Melhoria/CAPEX" },
    tipoFornecedor: { normal: "Normal", escolhido: "Escolhido", exclusivo: "Exclusivo" },

  };
  return (maps[field] && maps[field][value]) || value || "—";
}

function attachScmGestaoEvents() {
  document.querySelectorAll("[data-scm-manage]").forEach(function (btn) {
    btn.onclick = function () { openScmManageModal(this.getAttribute("data-scm-manage")); };
  });
  document.querySelectorAll("[data-scm-export-one]").forEach(function (btn) {
    btn.onclick = function () { exportScmToExcel([this.getAttribute("data-scm-export-one")]); };
  });
  const selectAll = document.getElementById("scm-select-all");
  if (selectAll) {
    selectAll.onchange = function () {
      document.querySelectorAll(".scm-row-check").forEach(function (chk) { chk.checked = selectAll.checked; });
      updateScmExportButtonLabel();
    };
  }
  document.querySelectorAll(".scm-row-check").forEach(function (chk) {
    chk.onchange = updateScmExportButtonLabel;
  });
  updateScmExportButtonLabel();
  const exportBtn = document.getElementById("scm-export-btn");
  if (exportBtn) {
    exportBtn.onclick = function () {
      const selectedIds = Array.from(document.querySelectorAll(".scm-row-check:checked")).map(function (c) { return c.value; });
      exportScmToExcel(selectedIds.length ? selectedIds : SCM_LIST.map(function (s) { return s.id; }));
    };
  }
}
function updateScmExportButtonLabel() {
  const exportBtn = document.getElementById("scm-export-btn");
  if (!exportBtn) return;
  const n = document.querySelectorAll(".scm-row-check:checked").length;
  exportBtn.innerHTML = icon("send", 15) + (n > 0 ? (" Exportar selecionados (" + n + ")") : " Exportar tudo");
}

// ---- Exportação SCM para Excel ----
function exportScmToExcel(idsToExport) {
  const items = SCM_LIST.filter(function (s) { return idsToExport.includes(s.id); });
  if (items.length === 0) return;

  if (items.length === 1) {
    exportSingleScmAsFicha(items[0]);
    return;
  }

  const header = [
    "Código", "Status", "Solicitante", "E-mail Solicitante", "E-mail Líder", "Time Solicitante", "Data",
    "Tipo de Solicitação", "Nº CAPEX/Projeto", "CAMM", "Urgência", "Centro de Custo", "Nº OM",
    "Tipo de Fornecedor", "Nome Fornecedor", "Tipo de Pedido", "Descrição de Uso",
    "Qtd. Itens", "Itens (resumo)", "Links", "Observação Líder", "Observação Almoxarife", "Nº Processo ME",
  ];
  const lines = [header.map(csvEscape).join(";")];

  items.forEach(function (s) {
    const itensResumo = (s.itens || []).map(function (it) {
      return (it.codigoSistema || "") + " - " + (it.descricaoItem || "") + " (Qtd " + (it.quantidade || "") + ")";
    }).join(" | ");
    const row = [
      s.codigo, scmStatusDef(s.status).label, s.solicitanteNome, s.solicitanteEmail, s.solicitanteEmailLider, s.timeSolicitante,
      formatDate(s.dataCriacao), scmLabel("tipoSolicitacao", s.tipoSolicitacao), s.capexProjeto, s.camm, s.urgencia,
      s.centroCusto, s.numeroOM, scmLabel("tipoFornecedor", s.tipoFornecedor), s.nomeFornecedor,
      scmLabel("tipoPedido", s.tipoPedido), s.descricaoUso, (s.itens || []).length, itensResumo, s.links,
      s.observacaoLider, s.observacaoAlmoxarife, s.numeroProcessoME,
    ];
    lines.push(row.map(csvEscape).join(";"));
  });

  downloadCsv(lines.join("\r\n"), "solicitacoes_scm_" + new Date().toISOString().slice(0, 10) + ".csv");
}

function exportSingleScmAsFicha(s) {
  const lines = [["Campo", "Valor"].map(csvEscape).join(";")];
  function addRow(campo, valor) { lines.push([campo, valor || ""].map(csvEscape).join(";")); }

  addRow("Código", s.codigo);
  addRow("Status", scmStatusDef(s.status).label);
  addRow("Solicitante", s.solicitanteNome);
  addRow("E-mail Solicitante", s.solicitanteEmail);
  addRow("E-mail Líder", s.solicitanteEmailLider);
  addRow("Time Solicitante", s.timeSolicitante);
  addRow("Data", formatDate(s.dataCriacao));
  addRow("Tipo de Solicitação", scmLabel("tipoSolicitacao", s.tipoSolicitacao));
  addRow("Nº CAPEX/Projeto", s.capexProjeto);
  addRow("CAMM", s.camm);
  addRow("Urgência", s.urgencia);
  addRow("Centro de Custo", s.centroCusto);
  addRow("Nº OM", s.numeroOM);
  addRow("Tipo de Fornecedor", scmLabel("tipoFornecedor", s.tipoFornecedor));
  addRow("Nome Fornecedor", s.nomeFornecedor);
  addRow("Tipo de Pedido", scmLabel("tipoPedido", s.tipoPedido));
  addRow("Descrição de Uso", s.descricaoUso);
  (s.itens || []).forEach(function (it, idx) {
    addRow("Item " + (idx + 1) + " - Código Sistema", it.codigoSistema);
    addRow("Item " + (idx + 1) + " - Descrição", it.descricaoItem);
    addRow("Item " + (idx + 1) + " - Quantidade", it.quantidade);
    addRow("Item " + (idx + 1) + " - Estoque Mínimo", it.estoqueMinimo);
    addRow("Item " + (idx + 1) + " - Marca/Modelo/Série", it.marcaModeloSerie);
  });
  addRow("Links", s.links);
  addRow("Observação Líder", s.observacaoLider);
  addRow("Observação Almoxarife", s.observacaoAlmoxarife);
  addRow("Nº Processo ME", s.numeroProcessoME);

  downloadCsv(lines.join("\r\n"), (s.codigo || "scm") + ".csv");
}

      <div class="sci-detail-row"><span class="sci-detail-label">Time</span><span class="sci-detail-value">${esc(s.timeSolicitante)}</span></div>

      <div class="sci-detail-row"><span class="sci-detail-label">Urgência</span><span class="sci-detail-value">${esc(s.urgencia)}</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Centro de Custo</span><span class="sci-detail-value">${esc(s.centroCusto)}</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Nº OM</span><span class="sci-detail-value">${esc(s.numeroOM)}</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Tipo de Pedido</span><span class="sci-detail-value">${esc(scmLabel("tipoPedido", s.tipoPedido))}</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Fornecedor</span><span class="sci-detail-value">${esc(scmLabel("tipoFornecedor", s.tipoFornecedor))}${s.nomeFornecedor ? " — " + esc(s.nomeFornecedor) : ""}</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Descrição de uso</span><span class="sci-detail-value">${esc(s.descricaoUso)}</span></div>
      <div class="sci-section-title">Itens</div>
      ${scmItemsHtml(s.itens)}
      ${scmAnexosHtml(s)}

      ${isPending ? `
      <div class="sci-section-title">Sua decisão</div>
      <label class="field-label">Observação (obrigatória para Reprovar ou Solicitar Revisão)</label>
      <textarea class="modal-input" id="scm-obs-lider" rows="3" placeholder="Explique o motivo caso reprove ou peça revisão de algum item"></textarea>
      <div id="scm-aprov-error"></div>
      <div class="modal-actions">
        <button class="danger-btn" id="scm-reprovar-btn">${icon("x", 16)} Reprovar</button>
        <button class="ghost-btn" id="scm-revisao-btn">Solicitar Revisão</button>
        <button class="primary-btn" id="scm-aprovar-btn">${icon("check", 16)} Aprovar</button>
      </div>
      ` : (s.observacaoLider ? '<div class="sci-section-title">Observação do Líder</div><div class="sci-detail-row"><span class="sci-detail-value">' + esc(s.observacaoLider) + '</span></div>' : "")}

  </div>`;

  document.getElementById("scm-aprov-backdrop").onclick = function () { modalRoot.innerHTML = ""; };
  document.getElementById("scm-aprov-close").onclick = function () { modalRoot.innerHTML = ""; };

  if (isPending) {
    const obsInput = document.getElementById("scm-obs-lider");
    const errBox = document.getElementById("scm-aprov-error");

    document.getElementById("scm-aprovar-btn").onclick = function () {
      finalizeScmDecision(scmId, "aprovada", obsInput.value.trim(), false);
    };
    document.getElementById("scm-reprovar-btn").onclick = function () {
      if (!obsInput.value.trim()) { errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Escreva uma observação explicando a reprovação.</div>'; return; }
      finalizeScmDecision(scmId, "reprovada", obsInput.value.trim(), false);
    };
    document.getElementById("scm-revisao-btn").onclick = function () {
      if (!obsInput.value.trim()) { errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Escreva uma observação explicando o que precisa ser revisado.</div>'; return; }
      finalizeScmDecision(scmId, "revisao_solicitada", obsInput.value.trim(), true);
    };
  }
}

function finalizeScmDecision(scmId, novoStatus, observacao, avisarTecnico) {
  const idx = SCM_LIST.findIndex(function (x) { return x.id === scmId; });
  SCM_LIST[idx].status = novoStatus;
  SCM_LIST[idx].observacaoLider = observacao;
  saveScm(SCM_LIST);

  const modalRoot = document.getElementById("almox-modal-root");
  const emailMsg = avisarTecnico
    ? '<br>Um e-mail seria enviado para <b>' + esc(SCM_LIST[idx].solicitanteEmail) + '</b> avisando que a solicitação precisa de revisão.'
    : "";
  modalRoot.innerHTML = '<div class="hint-box" style="background:#e3eff0; color:#003C41;"><b>Decisão registrada!</b> Status atualizado para "' + esc(scmStatusDef(novoStatus).label) + '".' + emailMsg + '</div>';
  setTimeout(function () {
    modalRoot.innerHTML = "";
    renderAlmoxTabContent();
  }, 2200);
}


// ============================= ACADEMIA BIOTROP =============================
const TRAINING_KEY="btlocal.BIOTROP_TRAININGS_V8";
const TRAIN_PROGRESS_KEY="btlocal.BIOTROP_TRAINING_PROGRESS_V8";
const TRAIN_USERS_KEY="btlocal.BIOTROP_TRAINING_USERS_V8";
const TRAIN_ANALYTICS_KEY="btlocal.BIOTROP_TRAINING_ANALYTICS_VIEWERS_V9";
function getTrainingAnalyticsViewers(){const a=readStore(TRAIN_ANALYTICS_KEY,[]);return Array.isArray(a)?a:[]}
function saveTrainingAnalyticsViewers(a){return writeStore(TRAIN_ANALYTICS_KEY,a)}
function canSeeTrainingAnalytics(user){const uid=user?.usuario||user?.email||""; return getTrainingAnalyticsViewers().includes(uid)}
function canManageTrainingAccess(user){return isAdminUser(user) || getPerms(user).training===true || user?.perfil==="Gestor" || user?.perfil==="Administrador"}

function getTrainings(){
  const list = readStore(TRAINING_KEY, []);
  return Array.isArray(list) ? list : [];
}
function saveTrainings(a){return writeStore(TRAINING_KEY, a)}
function getTrainProgress(){
  const obj = readStore(TRAIN_PROGRESS_KEY, {});
  return (obj && typeof obj === "object" && !Array.isArray(obj)) ? obj : {};
}
function saveTrainProgress(a){return writeStore(TRAIN_PROGRESS_KEY, a)}
function trainingProgressFor(id,userId){
  const p=getTrainProgress(); return Number(p[userId+"::"+id]||0);
}
function setTrainingProgress(id,userId,pct){
  const p=getTrainProgress(); p[userId+"::"+id]=Math.max(0,Math.min(100,Math.round(pct))); saveTrainProgress(p);
}
function youtubeEmbed(url){
  if(!url)return "";
  const m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?"https://www.youtube.com/embed/"+m[1]:"";
}
function trainingCard(t,user,admin){
  const pct=trainingProgressFor(t.id,user.usuario||user.email||"local");
  return `<article class="training-card">
    <div class="training-thumb">${t.video?`<div class="play">${icon("play",22,"#006257")}</div>`:`${icon("bookopen",42,"#006257")}`}
      ${t.required?'<span style="position:absolute;right:12px;top:12px;background:#fff1d9;color:#9a5a00;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800">OBRIGATÓRIO</span>':""}
    </div>
    <div class="training-body">
      <div class="training-tag">${esc(t.category)}</div>
      <h3>${esc(t.title)}</h3><p>${esc(t.description)}</p>
      <div class="training-progress"><i style="width:${pct}%"></i></div>
      <div class="training-foot"><span>${pct}% concluído</span><button class="t-btn" style="padding:7px 10px;background:#edf5f2;color:#006257" data-training-open="${esc(t.id)}">${pct?"Continuar":"Iniciar"}</button></div>
    </div>
  </article>`;
}
function renderTrainingArea(user,admin){

      <input id="training-search" placeholder="Pesquisar treinamento..." style="padding:10px 12px;border:1px solid #dbe4e2;border-radius:10px;min-width:240px">

}
function renderTrainingManagerTable(list){
  const users=(typeof USERS!=="undefined"?USERS:[]);
  if(!users.length)return '<div class="training-empty">Nenhum usuário cadastrado.</div>';
  return `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px">Colaborador</th><th style="text-align:left">Treinamento</th><th>Progresso</th><th>Status</th></tr></thead><tbody>`+
  users.flatMap(u=>list.map(t=>{const p=trainingProgressFor(t.id,u.usuario);return `<tr><td style="padding:10px">${esc(u.nome)}</td><td>${esc(t.title)}</td><td style="text-align:center">${p}%</td><td style="text-align:center">${p>=100?"Concluído":p>0?"Em andamento":"Não iniciado"}</td></tr>`})).join("")+
  `</tbody></table></div>`;
}
function openTrainingViewer(t,user){
  const root=document.createElement("div");root.className="training-modal";root.id="training-viewer";
  const uid=user.usuario||user.email||"local"; const current=trainingProgressFor(t.id,uid); const embed=youtubeEmbed(t.video);
  root.innerHTML=`<div class="training-dialog"><button class="training-close" id="training-view-close">×</button><div style="padding-right:30px"><div class="training-tag">${esc(t.category)}</div><h2>${esc(t.title)}</h2><p style="color:var(--muted,#6b7c7f)">${esc(t.description)}</p></div>

function localDateTimeValue(date){
  const d = date || new Date();
  const pad = function(n){return String(n).padStart(2,"0")};
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function previousReadingFor(meter, readings){
  let best = null, bestIdx = -1;
  readings.forEach(function(r, i){
    if(r.meterId !== meter.id) return;
    const t = new Date(r.at).getTime();
    if(!best){ best = r; bestIdx = i; return; }
    const bt = new Date(best.at).getTime();
    if(t > bt || (t === bt && i > bestIdx)){ best = r; bestIdx = i; }
  });
  return best ? Number(best.reading) : Number(meter.initial||0);
}
function openUtilityReadingModal(meterId){
  const meters = getUtilityData();
  const readings = getUtilityReadings();
  const meter = meters.find(function(m){return String(m.id)===String(meterId)});
  if(!meter){alert("Medidor não encontrado.");return}
  const previous = previousReadingFor(meter, readings);
  const hasHistory = readings.some(function(r){return r.meterId===meter.id});
  const photoRequired = meter.type==="horimetro";
  const root = document.createElement("div");
  root.className = "training-modal";
  root.innerHTML = `<div class="training-dialog" style="max-width:620px">
    <button class="training-close" id="ur-close">&times;</button>
    <h2>Registrar leitura</h2>
    <p>${esc(meter.name)} · ${esc(meter.asset||"sem ativo")} · unidade ${esc(meter.unit||"h")}</p>
    <div class="training-form-grid">
      <div><label class="training-label">Leitura anterior</label><input id="ur-prev" value="${previous}" disabled></div>
      <div><label class="training-label">Leitura atual (${esc(meter.unit||"h")})</label><input id="ur-reading" type="number" step="0.01" min="0" placeholder="0,00"></div>
      <div><label class="training-label">Data e hora</label><input id="ur-at" type="datetime-local" value="${localDateTimeValue()}"></div>
      <div><label class="training-label">Foto do marcador ${photoRequired?"(obrigatória)":"(opcional)"}</label><input id="ur-photo" type="file" accept="image/*" capture="environment"></div>
      <div class="full"><label class="training-label">Observação</label><textarea id="ur-obs" rows="3" placeholder="Opcional"></textarea></div>
    </div>
    <div id="ur-preview-wrap" style="margin-top:12px"><img id="ur-preview" alt="" style="display:none;max-width:100%;border-radius:12px"></div>
    <div id="ur-msg"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button class="t-btn" id="ur-cancel">Cancelar</button>
      <button class="t-btn green" id="ur-save">Salvar apontamento</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const close = function(){root.remove()};
  root.querySelector("#ur-close").onclick = close;
  root.querySelector("#ur-cancel").onclick = close;

  let photoData = null;
  let photoName = "";
  root.querySelector("#ur-photo").onchange = function(e){
    const f = e.target.files[0];
    photoData = null; photoName = "";
    const img = root.querySelector("#ur-preview");
    if(!f){img.style.display="none";return}
    photoName = f.name || "foto";
    img.src = URL.createObjectURL(f);
    img.style.display = "block";
    if(f.size <= 500000){
      const fr = new FileReader();
      fr.onload = function(){photoData = fr.result};
      fr.readAsDataURL(f);
    } else {
      root.querySelector("#ur-msg").innerHTML = '<div class="hint-box">Foto grande: será registrada apenas como evidência confirmada, sem guardar a imagem no navegador.</div>';
    }
  };

  root.querySelector("#ur-save").onclick = function(){
    const msg = root.querySelector("#ur-msg");
    const value = Number(root.querySelector("#ur-reading").value);
    const atRaw = root.querySelector("#ur-at").value;
    const file = root.querySelector("#ur-photo").files[0];
    if(!root.querySelector("#ur-reading").value || isNaN(value)){msg.innerHTML='<div class="login-error">Informe a leitura atual.</div>';return}
    if(value < previous){msg.innerHTML='<div class="login-error">A leitura não pode ser menor que a anterior ('+previous+').</div>';return}
    if(!atRaw){msg.innerHTML='<div class="login-error">Informe a data e hora da leitura.</div>';return}
    if(photoRequired && !file){msg.innerHTML='<div class="login-error">A foto do horímetro é obrigatória.</div>';return}
    const list = getUtilityReadings();
    list.push({
      id: "r" + Date.now(),
      meterId: meter.id,
      meterName: meter.name,
      reading: value,
      consumption: hasHistory ? Number((value - previous).toFixed(2)) : null,
      photo: !!file,
      photoName: photoName,
      photoData: photoData,
      observation: (root.querySelector("#ur-obs").value||"").trim(),
      user: (STATE.currentUser && (STATE.currentUser.usuario || STATE.currentUser.nome)) || "local",
      at: new Date(atRaw).toISOString()
    });
    saveUtilityReadings(list);
    close();
    navigateTo("utilidades");
  };
}

// ===================== SESSÃO LOCAL / TEMA / CONFIGURAÇÕES (sem Supabase) =====================
const LOCAL_SESSION_KEY = "btlocal.biotrop_local_session_v1";
const THEME_KEY = "btlocal.biotrop_theme";

function startLocalSession(user) {
  PROFILES = loadProfiles();
  STATE.currentUser = user;
  STATE.screen = "app";
  STATE.activeArea = "home";
  try { localStorage.setItem(LOCAL_SESSION_KEY, String(user.id)); } catch (e) {}
  render();
}

function endLocalSession() {
  try { localStorage.removeItem(LOCAL_SESSION_KEY); } catch (e) {}
  const float = document.querySelector(".v12-float");
  if (float) float.remove();
  STATE.currentUser = null;
  STATE.screen = "login";
  render();
}

function restoreLocalSession() {
  let id = null;
  try { id = localStorage.getItem(LOCAL_SESSION_KEY); } catch (e) {}
  if (!id) return false;
  PROFILES = loadProfiles();
  USERS = loadUsers();
  const user = USERS.find(function (u) { return String(u.id) === String(id); });
  if (!user || user.ativo === false) { try { localStorage.removeItem(LOCAL_SESSION_KEY); } catch (e) {} return false; }
  STATE.currentUser = user;
  STATE.screen = "app";
  STATE.activeArea = "home";
  return true;
}

function applyTheme() {
  let theme = "light";
  try { theme = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; } catch (e) {}
  document.body.classList.toggle("v12-dark", theme === "dark");
}

let btClockTimer = null;
function installV12Controls() {
  applyTheme();
  // Os botões saíram do canto flutuante para a topbar da área principal.
  const old = document.querySelector(".v12-float");
  if (old) old.remove();

  const theme = document.getElementById("bt-theme");
  if (theme) theme.onclick = function () {
    const dark = !document.body.classList.contains("v12-dark");
    document.body.classList.toggle("v12-dark", dark);
    try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
  };
  const cfg = document.getElementById("bt-settings");
  if (cfg) cfg.onclick = openV12Settings;

  const clock = document.getElementById("bt-clock");
  if (btClockTimer) { clearInterval(btClockTimer); btClockTimer = null; }
  if (clock) {
    const tick = function () {
      const el = document.getElementById("bt-clock");
      if (!el) { clearInterval(btClockTimer); btClockTimer = null; return; }
      el.textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    };
    tick();
    btClockTimer = setInterval(tick, 20000);
  }

  const out = document.getElementById("logout-btn");
  if (out) out.onclick = function () { endLocalSession(); };
}

function openV12Settings() {
  const u = STATE.currentUser;
  if (!u) return;
  let theme = "light";
  try { theme = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; } catch (e) {}
  const root = document.createElement("div");
  root.className = "training-modal";
  root.innerHTML = `<div class="training-dialog v12-settings">
    <button class="training-close" id="s-close">&times;</button>
    <h2>Configurações</h2>
    <p>Perfil, senha, aparência e notificações desta instalação local.</p>
    <div class="training-form-grid">
      <div><label class="training-label">Nome</label><input id="s-name" value="${esc(u.nome || "")}"></div>
      <div><label class="training-label">E-mail</label><input id="s-email" value="${esc(u.usuario || "")}" disabled></div>
      <div><label class="training-label">Telefone</label><input id="s-phone" value="${esc(u.telefone || "")}"></div>
      <div><label class="training-label">Tema</label><select id="s-theme"><option value="light"${theme === "light" ? " selected" : ""}>Claro</option><option value="dark"${theme === "dark" ? " selected" : ""}>Escuro</option></select></div>
      <div><label class="training-label"><input id="s-notif" type="checkbox" ${u.notificacoes === false ? "" : "checked"}> Notificações</label></div>
      <div class="full"><label class="training-label">Nova senha (opcional)</label><input id="s-pass" type="password" minlength="6" placeholder="Mínimo 6 caracteres"></div>
    </div>
    <div id="s-msg"></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="s-cancel">Fechar</button>
      <button class="primary-btn" id="s-save">Salvar</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  root.querySelector("#s-close").onclick = root.querySelector("#s-cancel").onclick = function () { root.remove(); };
  root.querySelector("#s-save").onclick = function () {
    const msg = root.querySelector("#s-msg");
    const nome = root.querySelector("#s-name").value.trim();
    const pass = root.querySelector("#s-pass").value;
    if (!nome) { msg.innerHTML = '<div class="login-error">Informe o nome.</div>'; return; }
    if (pass && pass.length < 6) { msg.innerHTML = '<div class="login-error">A nova senha precisa ter pelo menos 6 caracteres.</div>'; return; }
    USERS = loadUsers();
    const stored = USERS.find(function (x) { return String(x.id) === String(u.id); });
    if (stored) {
      stored.nome = nome;
      stored.telefone = root.querySelector("#s-phone").value.trim();
      stored.notificacoes = root.querySelector("#s-notif").checked;
      if (pass) stored.senha = pass;
      saveUsers(USERS);
      STATE.currentUser = stored;
    }
    const dark = root.querySelector("#s-theme").value === "dark";
    try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
    document.body.classList.toggle("v12-dark", dark);
    root.remove();
    render();
  };
}

function exportLocalBackup() {
  const dump = {
    exportedAt: new Date().toISOString(),
    profiles: loadProfiles(),
    users: loadUsers(),
    families: loadFamilies(),
    sci: loadSci(),
    scm: loadScm(),
    meters: getUtilityData(),
    readings: getUtilityReadings(),
    trainings: getTrainings(),
    trainingProgress: getTrainProgress()
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "biotrop-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

const LMS_OPERATION = ["enrollments", "progress", "attempts", "completions"];
const LMS_CONTENT = ["trainings", "versions", "lessons", "quizzes", "questions"];

let LMS = null;

function lmsLoad() {
  if (LMS) return LMS;
  const stored = readStore(LMS_KEY, null) || {};
  LMS = {};
  LMS_CONTENT.concat(LMS_OPERATION).forEach(function (k) {
    LMS[k] = Array.isArray(stored[k]) ? stored[k] : [];
  });
  // Conteúdo nasce da semente na primeira abertura; depois é editável na
  // tela de gestão, então não é sobrescrito a cada carregamento.
  let seeded = false;
  LMS_CONTENT.forEach(function (k) {
    if (!LMS[k].length && LMS_SEED[k] && LMS_SEED[k].length) {
      LMS[k] = JSON.parse(JSON.stringify(LMS_SEED[k]));
      seeded = true;
    }
  });
  if (seeded) lmsSave();
  return LMS;
}

function lmsSave() {
  if (!LMS) return;
  writeStore(LMS_KEY, LMS);
}

function lmsUid(prefix) {
  return (prefix || "x") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function lmsNow() { return new Date().toISOString(); }

function lmsUserId(user) {
  const u = user || STATE.currentUser || {};
  return u.id || u.usuario || "local";
}

function lmsCanManage() {
  const u = STATE.currentUser;
  if (!u) return false;
  if (isAdminUser(u)) return true;
  return u.perfilId === "gestor";
}

function lmsCanViewTeam() {
  const u = STATE.currentUser;
  if (!u) return false;
  if (lmsCanManage()) return true;
  return u.perfilId === "lider";
}

/** Versão publicada de um treinamento (a de maior número). */
function lmsVersionOf(trainingId) {
  const list = lmsLoad().versions
    .filter(function (v) { return v.training_id === trainingId && v.status === "publicada"; })
    .sort(function (a, b) { return b.version_no - a.version_no; });
  return list[0] || null;
}

function lmsTraining(id) {
  return lmsLoad().trainings.find(function (t) { return t.id === id; }) || null;
}

/**
 * Garante matrícula de todo usuário ativo nos treinamentos obrigatórios.
 * Sem isso a tela abre vazia e ninguém sabe que deve fazer o treinamento.
 */
function lmsEnsureEnrollments() {
  const db = lmsLoad();
  const users = loadUsers().filter(function (u) { return u.ativo !== false; });
  let changed = false;
  db.trainings.filter(function (t) { return t.active !== false && t.mandatory; }).forEach(function (t) {
    const v = lmsVersionOf(t.id);
    if (!v) return;
    users.forEach(function (u) {
      const uid = lmsUserId(u);
      const has = db.enrollments.some(function (e) {
        return e.user_id === uid && e.training_id === t.id && e.version_id === v.id;
      });
      if (has) return;
      db.enrollments.push({
        id: lmsUid("en"), user_id: uid, user_name: u.nome, training_id: t.id, version_id: v.id,
        mandatory: true, status: "nao_iniciado", started_at: null,
        due_at: new Date(Date.now() + (t.deadline_days || 30) * 864e5).toISOString(),
        assigned_at: lmsNow()
      });
      changed = true;
    });
  });
  if (changed) lmsSave();
}

function lmsEnrollmentDetail(id) {
  const db = lmsLoad();
  const e = db.enrollments.find(function (x) { return x.id === id; });
  if (!e) return null;
  const t = lmsTraining(e.training_id);
  const v = db.versions.find(function (x) { return x.id === e.version_id; });
  if (!t || !v) return null;
  const quiz = db.quizzes.find(function (x) { return x.version_id === e.version_id; }) || null;
  const lessons = db.lessons
    .filter(function (l) { return l.version_id === e.version_id; })
    .sort(function (a, b) { return a.position - b.position; })
    .map(function (l) {
      const p = db.progress.find(function (x) { return x.enrollment_id === e.id && x.lesson_id === l.id; }) || {};
      return Object.assign({}, l, {
        seconds_watched: p.seconds_watched || 0,
        acknowledged: Boolean(p.acknowledged),
        completed_at: p.completed_at || null
      });
    });
  const attempts = db.attempts.filter(function (a) { return a.enrollment_id === e.id; })
    .sort(function (a, b) { return a.attempt_no - b.attempt_no; });
  const completion = db.completions.find(function (c) { return c.enrollment_id === e.id; }) || null;
  return {
    enrollment: e, training: t, version: v, quiz: quiz, lessons: lessons,
    attempts: attempts, completion: completion
  };
}

/** Percentual de aulas obrigatórias concluídas. */
function lmsProgressPct(detail) {
  if (!detail) return 0;
  if (detail.completion) return 100;
  const req = detail.lessons.filter(function (l) { return l.required; });
  const base = req.length ? req : detail.lessons;
  if (!base.length) return 0;
  const done = base.filter(function (l) { return l.completed_at; }).length;
  // A avaliação vale os últimos 10% quando existe.
  const lessonsShare = detail.quiz ? 90 : 100;
  return Math.round((done / base.length) * lessonsShare);
}

function lmsPendingRequired(detail) {
  return detail.lessons.filter(function (l) { return l.required && !l.completed_at; });
}

/* ---------- gravação de progresso (regra do v7) ---------- */

function lmsSaveProgress(enrollmentId, lessonId, payload) {
  const db = lmsLoad();
  const e = db.enrollments.find(function (x) { return x.id === enrollmentId; });
  if (!e) return { error: "Matrícula inexistente." };
  if (e.user_id !== lmsUserId()) return { error: "Você só registra o seu próprio progresso." };
  const lesson = db.lessons.find(function (l) { return l.id === lessonId && l.version_id === e.version_id; });
  if (!lesson) return { error: "Aula não pertence a esta versão." };

  let p = db.progress.find(function (x) { return x.enrollment_id === e.id && x.lesson_id === lesson.id; });
  if (!p) {
    p = { id: lmsUid("pg"), enrollment_id: e.id, lesson_id: lesson.id, seconds_watched: 0, acknowledged: false, completed_at: null };
    db.progress.push(p);
  }
  // Monotônico e com teto de 120 s por gravação: a tela não pula para o fim.
  p.seconds_watched = Math.max(p.seconds_watched, Math.min(Number(payload.seconds_watched || 0), p.seconds_watched + 120));
  p.acknowledged = p.acknowledged || Boolean(payload.acknowledged);

  const timeOk = p.seconds_watched >= (lesson.min_seconds || 0);
  const ackOk = lmsKindNeedsAck(lesson.kind) ? p.acknowledged : true;
  if (timeOk && ackOk && !p.completed_at) p.completed_at = lmsNow();

  if (e.status === "nao_iniciado") {
    e.status = "em_andamento";
    e.started_at = e.started_at || lmsNow();
  }
  lmsSave();
  return { progress: p };
}

/* ---------- avaliação (correção fora da tela) ---------- */

function lmsSubmitQuiz(enrollmentId, answers) {
  const db = lmsLoad();
  const e = db.enrollments.find(function (x) { return x.id === enrollmentId; });
  if (!e) return { error: "Matrícula inexistente." };
  if (e.user_id !== lmsUserId()) return { error: "Matrícula de outra pessoa." };
  if (db.completions.some(function (c) { return c.enrollment_id === e.id; })) {
    return { error: "Treinamento já concluído." };
  }
  const v = db.versions.find(function (x) { return x.id === e.version_id; });
  const required = db.lessons.filter(function (l) { return l.version_id === e.version_id && l.required; });
  const pending = required.filter(function (l) {
    return !db.progress.some(function (p) { return p.enrollment_id === e.id && p.lesson_id === l.id && p.completed_at; });
  });
  if (pending.length) {
    return { error: "Faltam " + pending.length + " aula(s) obrigatória(s) antes da avaliação." };
  }
  const quiz = db.quizzes.find(function (x) { return x.version_id === e.version_id; });
  if (!quiz) return { error: "Esta versão não tem avaliação." };

  const prev = db.attempts.filter(function (a) { return a.enrollment_id === e.id; }).length;
  const attemptNo = prev + 1;
  if (attemptNo > v.max_attempts) {
    return { error: "Limite de " + v.max_attempts + " tentativas atingido. Procure o responsável pelo treinamento." };
  }

  let earned = 0, total = 0;
  const review = [];
  db.questions.filter(function (q) { return q.quiz_id === quiz.id; }).forEach(function (q) {
    total += q.weight;
    const given = answers[q.id];
    const g = (Array.isArray(given) ? given : given ? [given] : []).slice().sort();
    const c = q.options.filter(function (o) { return o.is_correct; }).map(function (o) { return o.id; }).sort();
    const ok = g.length === c.length && g.every(function (x, i) { return x === c[i]; });
    if (ok) earned += q.weight;
    review.push({ question_id: q.id, correct: ok });
  });
  const score = total > 0 ? Math.round((earned / total) * 100) : 0;
  const passed = score >= v.pass_score;

  db.attempts.push({
    id: lmsUid("at"), enrollment_id: e.id, quiz_id: quiz.id, attempt_no: attemptNo,
    score: score, passed: passed, finished_at: lmsNow()
  });

  let completion = null;
  if (passed) {
    const t = lmsTraining(e.training_id);
    completion = {
      id: lmsUid("cp"), enrollment_id: e.id, user_id: e.user_id, user_name: e.user_name,
      training_id: e.training_id, version_id: e.version_id, completed_at: lmsNow(),
      expires_at: t.validity_months > 0 ? new Date(Date.now() + t.validity_months * 30 * 864e5).toISOString() : null,
      score: score, certificate_code: "BT-" + lmsUid("").replace(/-/g, "").slice(0, 10).toUpperCase(),
      evidence: "automatica", manual_reason: null
    };
    db.completions.push(completion);
    e.status = "concluido";
  } else {
    e.status = attemptNo >= v.max_attempts ? "reprovado" : "aguardando_quiz";
  }
  lmsSave();
  return {
    score: score, passed: passed, attemptNo: attemptNo, review: review,
    completion: completion, attemptsLeft: Math.max(0, v.max_attempts - attemptNo)
  };
}

/* ---------- conformidade ---------- */

function lmsComplianceRows() {
  const db = lmsLoad();
  const users = loadUsers().filter(function (u) { return u.ativo !== false; });
  const mandatory = db.trainings.filter(function (t) { return t.active !== false && t.mandatory; });
  return users.map(function (u) {
    const uid = lmsUserId(u);
    const items = mandatory.map(function (t) {
      const e = db.enrollments.find(function (x) { return x.user_id === uid && x.training_id === t.id; });
      const c = e ? db.completions.find(function (x) { return x.enrollment_id === e.id; }) : null;
      let situacao = "pendente";
      if (c) {
        situacao = (c.expires_at && new Date(c.expires_at) < new Date()) ? "vencido" : "em_dia";
      } else if (e && e.due_at && new Date(e.due_at) < new Date()) {
        situacao = "atrasado";
      } else if (e && e.status === "reprovado") {
        situacao = "reprovado";
      }
      return { training: t, enrollment: e, completion: c, situacao: situacao };
    });
    const okCount = items.filter(function (i) { return i.situacao === "em_dia"; }).length;
    return {
      user: u, items: items, okCount: okCount,
      pct: items.length ? Math.round((okCount / items.length) * 100) : 100
    };
  });
}

/* ---------- estado de navegação do módulo ---------- */

const LMS_STATE = { view: "my", enrollmentId: null, lessonId: null, quizResult: null, filter: "todos" };

/* ---------- tipos de aula: vídeo, PDF, imagem, texto e link ----------

   Um treinamento mistura os tipos livremente: a aula 1 pode ser um vídeo
   do YouTube, a 2 o PDF do procedimento e a 3 um texto. Cada aula tem o
   seu próprio tempo mínimo de visualização, editável na gestão.

   Vídeo não pede confirmação de leitura (o tempo já é a evidência);
   PDF, imagem, texto e link pedem, porque o navegador não sabe dizer se
   a pessoa passou das primeiras páginas.                              */

const LMS_KINDS = [
  { id: "texto", label: "Texto", ack: true, media: false },
  { id: "video", label: "Vídeo do YouTube", ack: false, media: true },
  { id: "video_arquivo", label: "Vídeo (arquivo ou endereço)", ack: false, media: true },
  { id: "pdf", label: "PDF (arquivo ou endereço)", ack: true, media: true },
  { id: "imagem", label: "Imagem", ack: true, media: true },
  { id: "link", label: "Link externo", ack: true, media: true }
];

// Acima disso o arquivo não entra no localStorage: 1,5 MB de binário
// viram ~2 MB em base64 e a cota do navegador é de poucos megabytes.
const LMS_UPLOAD_MAX = 1500000;

function lmsKind(id) {
  return LMS_KINDS.find(function (k) { return k.id === id; }) || LMS_KINDS[0];
}
function lmsKindLabel(id) { return lmsKind(id).label; }
function lmsKindNeedsAck(id) { return lmsKind(id).ack; }

/** Endereço da mídia da aula: arquivo embutido ou endereço informado. */
function lmsMediaSrc(lesson) {
  return lesson.media_data || lesson.video || "";
}

function lmsLessonBody(lesson) {
  const src = lmsMediaSrc(lesson);

  if (lesson.kind === "video") {
    const embed = youtubeEmbed(lesson.video);
    if (!embed) {
      return '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>O endereço informado não é um link reconhecido do YouTube.</div></div>';
    }
    return '<div style="position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000">' +
      '<iframe src="' + esc(embed) + '" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen title="' + esc(lesson.title) + '"></iframe></div>';
  }

  if (lesson.kind === "video_arquivo") {
    if (!src) return '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>Nenhum vídeo anexado a esta aula.</div></div>';
    return '<video controls style="width:100%;border-radius:14px;background:#000;max-height:64vh" src="' + esc(src) + '"></video>';
  }

  if (lesson.kind === "pdf") {
    if (!src) return '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>Nenhum PDF anexado a esta aula.</div></div>';
    return '<div style="border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface-soft)">' +
      '<iframe src="' + esc(src) + '" style="width:100%;height:66vh;border:0" title="' + esc(lesson.title) + '"></iframe></div>' +
      '<div class="bt-row" style="margin-top:10px"><a class="bt-btn bt-btn--sm" href="' + esc(src) + '" target="_blank" rel="noopener">Abrir o PDF em outra aba</a></div>';
  }

  if (lesson.kind === "imagem") {
    if (!src) return '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>Nenhuma imagem anexada a esta aula.</div></div>';
    return '<img src="' + esc(src) + '" alt="' + esc(lesson.title) + '" style="width:100%;border-radius:14px;border:1px solid var(--border)">';
  }

  if (lesson.kind === "link") {
    if (!src) return '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>Nenhum endereço informado nesta aula.</div></div>';
    return (lesson.body ? '<div style="white-space:pre-wrap;line-height:1.65;font-size:14px;margin-bottom:14px">' + esc(lesson.body) + "</div>" : "") +
      '<a class="bt-btn bt-btn--primary" href="' + esc(src) + '" target="_blank" rel="noopener">Abrir o conteúdo em outra aba</a>' +
      '<div class="bt-field__hint">O tempo mínimo continua contando nesta tela enquanto você lê o material na outra aba.</div>';
  }

  return '<div style="white-space:pre-wrap;line-height:1.65;font-size:14px;color:var(--text)">' + esc(lesson.body || "") + "</div>";
}

function lmsStatusBadge(status, dueAt) {
  const late = dueAt && new Date(dueAt) < new Date() && status !== "concluido";
  const map = {
    nao_iniciado: ["Não iniciado", "bt-badge"],
    em_andamento: ["Em andamento", "bt-badge bt-badge--info"],
    aguardando_quiz: ["Aguardando avaliação", "bt-badge bt-badge--warn"],
    concluido: ["Concluído", "bt-badge bt-badge--ok"],
    reprovado: ["Reprovado", "bt-badge bt-badge--danger"]
  };
  const d = map[status] || map.nao_iniciado;
  return '<span class="' + d[1] + '">' + esc(d[0]) + "</span>" +
    (late ? ' <span class="bt-badge bt-badge--danger">Prazo vencido</span>' : "");
}

function lmsFmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString("pt-BR"); } catch (e) { return "—"; }
}

function renderLmsMy() {
  lmsEnsureEnrollments();
  const db = lmsLoad();

  const details = mine.map(function (e) { return lmsEnrollmentDetail(e.id); }).filter(Boolean);

  const done = details.filter(function (d) { return d.completion; }).length;
  const late = details.filter(function (d) {
    return !d.completion && d.enrollment.due_at && new Date(d.enrollment.due_at) < new Date();
  }).length;
  const running = details.filter(function (d) { return !d.completion && d.enrollment.status !== "nao_iniciado"; }).length;
  const expiring = details.filter(function (d) {
    if (!d.completion || !d.completion.expires_at) return false;
    const days = (new Date(d.completion.expires_at) - new Date()) / 864e5;
    return days > 0 && days <= 60;
  }).length;

  const filtered = details.filter(function (d) {
    if (LMS_STATE.filter === "pendentes") return !d.completion;

    return true;

    const ac = a.completion ? 1 : 0, bc = b.completion ? 1 : 0;

  });

  const cards = filtered.map(function (d) {
    const pct = lmsProgressPct(d);

    return `<div class="bt-item">

        <div class="bt-item__title">${esc(d.training.title)}

          · prazo ${lmsFmtDate(d.enrollment.due_at)}
          ${d.completion && d.completion.expires_at ? " · válido até " + lmsFmtDate(d.completion.expires_at) : ""}</div>
        <div class="bt-progress" style="margin-top:9px;max-width:340px"><i class="bt-progress__fill" style="width:${pct}%;display:block"></i></div>
      </div>
      <div class="bt-item__side">
        ${lmsStatusBadge(d.enrollment.status, d.enrollment.due_at)}
        <span class="bt-small bt-mono bt-muted">${pct}%</span>
        <button class="bt-btn bt-btn--primary bt-btn--sm" data-lms-open="${esc(d.enrollment.id)}">${esc(label)}</button>
      </div>
    </div>`;

  return `
  <div class="page-title-row">
    <div class="page-icon">${icon("graduation-cap", 22)}</div>
    <div>
      <h1>Meus treinamentos</h1>
      <p>Aulas com tempo mínimo, avaliação e comprovante com validade.</p>

  </div>

  <div class="bt-grid--kpi" style="margin-bottom:18px">
    <div class="bt-kpi"><div class="bt-kpi__label">Atribuídos</div><div class="bt-kpi__value">${details.length}</div><div class="bt-kpi__hint">treinamentos na sua trilha</div></div>
    <div class="bt-kpi ${late ? "bt-kpi--alert" : "bt-kpi--ok"}"><div class="bt-kpi__label">Prazo vencido</div><div class="bt-kpi__value">${late}</div><div class="bt-kpi__hint">${late ? "regularize com prioridade" : "nenhum atraso"}</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Em andamento</div><div class="bt-kpi__value">${running}</div><div class="bt-kpi__hint">começados e não concluídos</div></div>

          }).join("") + "</div>" : ""}

function attachLmsPlayerEvents() {
  const d = lmsEnrollmentDetail(LMS_STATE.enrollmentId);
  if (!d) return;
  const lesson = d.lessons.find(function (l) { return l.id === LMS_STATE.lessonId; });
  if (!lesson) return;

  lmsTickSeconds = lesson.seconds_watched;
  if (lmsTickTimer) clearInterval(lmsTickTimer);
  lmsTickTimer = setInterval(function () {
    const box = document.getElementById("lms-timer");
    if (!box) { clearInterval(lmsTickTimer); lmsTickTimer = null; return; }
    lmsTickSeconds += 1;
    box.textContent = lmsTickSeconds;
  }, 1000);

  const back = document.getElementById("lms-back");
  if (back) back.onclick = function () { LMS_STATE.view = "my"; navigateTo("treinamentos"); };

  document.querySelectorAll("[data-lms-lesson]").forEach(function (btn) {
    btn.onclick = function () {
      lmsSaveProgress(LMS_STATE.enrollmentId, LMS_STATE.lessonId, { seconds_watched: lmsTickSeconds });
      LMS_STATE.lessonId = this.getAttribute("data-lms-lesson");
      navigateTo("treinamentos");
    };
  });

  const save = document.getElementById("lms-lesson-save");
  if (save) save.onclick = function () {
    const ack = document.getElementById("lms-ack");
    const res = lmsSaveProgress(LMS_STATE.enrollmentId, LMS_STATE.lessonId, {
      seconds_watched: lmsTickSeconds,
      acknowledged: ack ? ack.checked : false
    });
    if (res.error) { alert(res.error); return; }
    const fresh = lmsEnrollmentDetail(LMS_STATE.enrollmentId);
    const cur = fresh.lessons.find(function (l) { return l.id === LMS_STATE.lessonId; });
    if (!cur.completed_at) {
      const falta = Math.max(0, (cur.min_seconds || 0) - cur.seconds_watched);
      alert(falta > 0
        ? "Ainda faltam " + falta + " segundo(s) nesta aula."
        : "Confirme a leitura para concluir a aula.");
      navigateTo("treinamentos");
      return;
    }
    const next = fresh.lessons.find(function (l) { return !l.completed_at; });
    if (next) LMS_STATE.lessonId = next.id;
    navigateTo("treinamentos");
  };

  const quiz = document.getElementById("lms-start-quiz");
  if (quiz) quiz.onclick = function () {
    lmsSaveProgress(LMS_STATE.enrollmentId, LMS_STATE.lessonId, { seconds_watched: lmsTickSeconds });
    LMS_STATE.view = "quiz";
    LMS_STATE.quizResult = null;
    navigateTo("treinamentos");
  };
}

    <div>
      <h1>${esc(d.quiz.title)}</h1>

    </div>
    <button class="ghost-btn" id="lms-back">Voltar</button>

function attachLmsQuizEvents() {
  const back = document.getElementById("lms-back");
  if (back) back.onclick = function () {
    LMS_STATE.view = "player"; LMS_STATE.quizResult = null; navigateTo("treinamentos");
  };
  const retry = document.getElementById("lms-retry");
  if (retry) retry.onclick = function () { LMS_STATE.quizResult = null; navigateTo("treinamentos"); };

  const form = document.getElementById("lms-quiz-form");
  if (!form) return;
  form.onsubmit = function (ev) {
    ev.preventDefault();
    const d = lmsEnrollmentDetail(LMS_STATE.enrollmentId);
    const db = lmsLoad();
    const questions = db.questions.filter(function (q) { return q.quiz_id === d.quiz.id; });
    const answers = {};
    let missing = 0;
    questions.forEach(function (q) {
      const marked = Array.prototype.slice.call(form.querySelectorAll('[name="q_' + q.id + '"]:checked'))
        .map(function (i) { return i.value; });
      if (!marked.length) missing += 1;
      answers[q.id] = q.kind === "multipla" ? marked : marked[0];
    });
    const box = document.getElementById("lms-quiz-error");
    if (missing) {
      box.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Responda todas as questões: faltam ' + missing + ".</div></div>";
      return;
    }
    const res = lmsSubmitQuiz(LMS_STATE.enrollmentId, answers);
    if (res.error) {
      box.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>' + esc(res.error) + "</div></div>";
      return;
    }
    LMS_STATE.quizResult = res;
    navigateTo("treinamentos");
  };
}

function renderLmsCompliance() {

    <div>Marcar um treinamento como obrigatório matricula automaticamente todos os usuários ativos, com o prazo em dias contado a partir da matrícula.</div>
  </div>`;
}

function lmsTrainingForm(trainingId) {
  const db = lmsLoad();
  const t = trainingId ? lmsTraining(trainingId) : null;
  const v = t ? lmsVersionOf(t.id) : null;
  const root = document.createElement("div");
  root.className = "training-modal";
  root.innerHTML = `<div class="training-dialog" style="max-width:640px">
    <button class="training-close" id="tf-close">&times;</button>
    <h2>${t ? "Editar treinamento" : "Novo treinamento"}</h2>
    <div class="bt-fields2" style="margin-top:16px">
      <div class="bt-field"><label>Código</label><input id="tf-code" value="${t ? esc(t.code) : ""}" placeholder="TR-004"></div>
      <div class="bt-field"><label>Categoria</label>
        <select id="tf-cat">${["Segurança", "Procedimentos", "Sistemas", "Integração", "Técnico"].map(function (c) {
          return '<option value="' + c + '"' + (t && t.category === c ? " selected" : "") + ">" + c + "</option>";
        }).join("")}</select></div>
      <div class="bt-field" style="grid-column:1/-1"><label>Título <span class="req">*</span></label><input id="tf-title" value="${t ? esc(t.title) : ""}" placeholder="Ex.: NR-12 — Segurança em máquinas"></div>
      <div class="bt-field" style="grid-column:1/-1"><label>Descrição</label><textarea id="tf-desc" rows="3">${t ? esc(t.description || "") : ""}</textarea></div>
      <div class="bt-field"><label>Validade (meses, 0 = sem validade)</label><input id="tf-validity" type="number" min="0" value="${t ? t.validity_months : 12}"></div>
      <div class="bt-field"><label>Prazo para concluir (dias)</label><input id="tf-deadline" type="number" min="1" value="${t ? t.deadline_days : 30}"></div>
      <div class="bt-field"><label>Nota de corte (%)</label><input id="tf-pass" type="number" min="0" max="100" value="${v ? v.pass_score : 70}"></div>
      <div class="bt-field"><label>Tentativas máximas</label><input id="tf-attempts" type="number" min="1" value="${v ? v.max_attempts : 3}"></div>
      <div class="bt-field"><label><input type="checkbox" id="tf-mandatory" ${!t || t.mandatory ? "checked" : ""}> Obrigatório</label></div>
      <div class="bt-field"><label><input type="checkbox" id="tf-active" ${!t || t.active !== false ? "checked" : ""}> Ativo</label></div>
    </div>
    <div id="tf-msg"></div>
    <div class="bt-row" style="justify-content:flex-end;margin-top:16px">
      <button class="bt-btn" id="tf-cancel">Cancelar</button>
      <button class="bt-btn bt-btn--primary" id="tf-save">${t ? "Salvar" : "Cadastrar"}</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const close = function () { root.remove(); };
  root.querySelector("#tf-close").onclick = close;
  root.querySelector("#tf-cancel").onclick = close;
  root.querySelector("#tf-save").onclick = function () {
    const title = root.querySelector("#tf-title").value.trim();
    if (!title) { root.querySelector("#tf-msg").innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe o título.</div></div>'; return; }
    const payload = {
      code: root.querySelector("#tf-code").value.trim() || "TR-" + String(db.trainings.length + 1).padStart(3, "0"),
      title: title,
      category: root.querySelector("#tf-cat").value,
      description: root.querySelector("#tf-desc").value.trim(),
      validity_months: Number(root.querySelector("#tf-validity").value || 0),
      deadline_days: Number(root.querySelector("#tf-deadline").value || 30),
      mandatory: root.querySelector("#tf-mandatory").checked,
      active: root.querySelector("#tf-active").checked
    };
    const pass = Number(root.querySelector("#tf-pass").value || 70);
    const attempts = Number(root.querySelector("#tf-attempts").value || 3);

    if (t) {
      Object.assign(t, payload);
      const ver = lmsVersionOf(t.id);
      if (ver) { ver.pass_score = pass; ver.max_attempts = attempts; }
    } else {
      const id = lmsUid("tr");
      db.trainings.push(Object.assign({ id: id }, payload));
      const vid = lmsUid("tv");
      db.versions.push({ id: vid, training_id: id, version_no: 1, status: "publicada", min_minutes: 5, pass_score: pass, max_attempts: attempts });
      db.quizzes.push({ id: lmsUid("qz"), version_id: vid, title: "Avaliação — " + title });
    }
    lmsSave();
    lmsEnsureEnrollments();
    close();
    navigateTo("lms_admin");
  };
}

function lmsLessonsModal(trainingId) {
  const db = lmsLoad();
  const t = lmsTraining(trainingId);
  const v = lmsVersionOf(trainingId);
  if (!t || !v) { alert("Treinamento sem versão publicada."); return; }
  const quiz = db.quizzes.find(function (q) { return q.version_id === v.id; });

  // Definida mais abaixo, depois que o formulário existe; draw só a chama
  // no clique, então a atribuição posterior basta.
  let lsEdit = function () {};

  const draw = function (root) {
    const lessons = db.lessons.filter(function (l) { return l.version_id === v.id; })
      .sort(function (a, b) { return a.position - b.position; });
    const questions = quiz ? db.questions.filter(function (q) { return q.quiz_id === quiz.id; })
      .sort(function (a, b) { return a.position - b.position; }) : [];
    root.querySelector("#ls-list").innerHTML = lessons.map(function (l, idx) {
      const anexo = l.media_data ? "arquivo embutido" : l.video ? "endereço externo" : "";
      return `<div class="bt-item">
        <div class="bt-item__main">
          <div class="bt-item__title">${l.position}. ${esc(l.title)}</div>
          <div class="bt-item__meta">${esc(lmsKindLabel(l.kind))} · ${l.required ? "obrigatória" : "opcional"} · ${l.min_seconds || 0} s mínimo${anexo ? " · " + anexo : ""}</div>
        </div>
        <div class="bt-item__side">
          <button class="bt-btn bt-btn--sm" data-ls-up="${esc(l.id)}" title="Subir" ${idx === 0 ? "disabled" : ""}>↑</button>
          <button class="bt-btn bt-btn--sm" data-ls-down="${esc(l.id)}" title="Descer" ${idx === lessons.length - 1 ? "disabled" : ""}>↓</button>
          <button class="bt-btn bt-btn--sm" data-ls-edit="${esc(l.id)}">Editar</button>
          <button class="bt-btn bt-btn--sm" data-ls-del="${esc(l.id)}">Excluir</button>
        </div>
      </div>`;
    }).join("") || '<div class="bt-state">Nenhuma aula nesta versão.</div>';
    root.querySelector("#qs-list").innerHTML = questions.map(function (q) {
      return `<div class="bt-item">
        <div class="bt-item__main">
          <div class="bt-item__title">${q.position}. ${esc(q.statement)}</div>
          <div class="bt-item__meta">${q.kind === "multipla" ? "múltipla" : "única"} · peso ${q.weight} · ${q.options.length} opções · ${q.options.filter(function (o) { return o.is_correct; }).length} corretas</div>
        </div>
        <div class="bt-item__side"><button class="bt-btn bt-btn--sm" data-qs-del="${esc(q.id)}">Excluir</button></div>
      </div>`;
    }).join("") || '<div class="bt-state">Nenhuma questão nesta avaliação.</div>';

    const renumber = function () {
      db.lessons.filter(function (l) { return l.version_id === v.id; })
        .sort(function (a, x) { return a.position - x.position; })
        .forEach(function (l, i) { l.position = i + 1; });
    };

    root.querySelectorAll("[data-ls-del]").forEach(function (b) {
      b.onclick = function () {
        const id = b.getAttribute("data-ls-del");
        if (!confirm("Excluir esta aula? O progresso registrado nela também sai.")) return;
        db.lessons = db.lessons.filter(function (x) { return x.id !== id; });
        db.progress = db.progress.filter(function (x) { return x.lesson_id !== id; });
        renumber();
        lmsSave(); draw(root);
      };
    });
    root.querySelectorAll("[data-ls-up], [data-ls-down]").forEach(function (b) {
      b.onclick = function () {
        if (b.disabled) return;
        const up = b.hasAttribute("data-ls-up");
        const id = b.getAttribute(up ? "data-ls-up" : "data-ls-down");
        const l = db.lessons.find(function (x) { return x.id === id; });
        const other = lessons.find(function (x) { return x.position === l.position + (up ? -1 : 1); });
        if (!l || !other) return;
        const tmp = l.position; l.position = other.position; other.position = tmp;
        renumber();
        lmsSave(); draw(root);
      };
    });
    root.querySelectorAll("[data-ls-edit]").forEach(function (b) {
      b.onclick = function () { lsEdit(b.getAttribute("data-ls-edit")); };
    });
    root.querySelectorAll("[data-qs-del]").forEach(function (b) {
      b.onclick = function () {
        const id = b.getAttribute("data-qs-del");
        db.questions = db.questions.filter(function (x) { return x.id !== id; });
        if (quiz) {
          db.questions.filter(function (q) { return q.quiz_id === quiz.id; })
            .sort(function (a, x) { return a.position - x.position; })
            .forEach(function (q, i) { q.position = i + 1; });
        }
        lmsSave(); draw(root);
      };
    });
  };

  const root = document.createElement("div");
  root.className = "training-modal";
  root.innerHTML = `<div class="training-dialog" style="max-width:780px">
    <button class="training-close" id="ls-close">&times;</button>
    <h2>${esc(t.title)}</h2>
    <p class="bt-small bt-muted">Versão ${v.version_no} · aulas e avaliação</p>

    <div class="bt-card" style="box-shadow:none;margin-top:16px">
      <div class="bt-card__head"><div><h3>Aulas</h3></div></div>
      <div class="bt-card__body--flush" id="ls-list"></div>
      <div class="bt-card__body" style="border-top:1px solid var(--border)">
        <div class="bt-steplabel" id="ls-form-title">Nova aula</div>
        <div class="bt-fields2">
          <div class="bt-field" style="grid-column:1/-1"><label>Título da aula</label><input id="ls-title" placeholder="Ex.: Uso correto do EPI"></div>
          <div class="bt-field"><label>Tipo de conteúdo</label>
            <select id="ls-kind">${LMS_KINDS.map(function (k) {
              return '<option value="' + k.id + '">' + esc(k.label) + "</option>";
            }).join("")}</select></div>
          <div class="bt-field"><label>Tempo mínimo de visualização (segundos)</label><input id="ls-secs" type="number" min="0" step="5" value="60">
            <div class="bt-field__hint">É o tempo que a aula exige antes de poder ser concluída.</div></div>
          <div class="bt-field" style="grid-column:1/-1" id="ls-url-wrap"><label>Endereço (YouTube, PDF, vídeo, imagem ou link)</label>
            <input id="ls-video" placeholder="https://... ou file:///C:/pasta/procedimento.pdf"></div>
          <div class="bt-field" style="grid-column:1/-1" id="ls-file-wrap"><label>Ou anexe o arquivo</label>
            <input id="ls-file" type="file">
            <div class="bt-field__hint">Até 1,5 MB o arquivo fica embutido no navegador. Acima disso, use o endereço acima — inclusive um caminho <b>file:///</b> da rede ou do disco.</div></div>
          <div class="bt-field" style="grid-column:1/-1" id="ls-body-wrap"><label>Conteúdo em texto</label><textarea id="ls-body" rows="4"></textarea></div>
          <div class="bt-field"><label><input type="checkbox" id="ls-req" checked> Obrigatória</label></div>
        </div>
        <div id="ls-msg"></div>
        <div class="bt-row" style="justify-content:flex-end">
          <button class="bt-btn bt-btn--sm" id="ls-clear" style="display:none">Cancelar edição</button>
          <button class="bt-btn bt-btn--primary bt-btn--sm" id="ls-add">Adicionar aula</button>
        </div>
      </div>
    </div>

    <div class="bt-card" style="box-shadow:none;margin-top:16px">
      <div class="bt-card__head"><div><h3>Avaliação</h3><p>${quiz ? esc(quiz.title) : "sem avaliação nesta versão"}</p></div></div>
      <div class="bt-card__body--flush" id="qs-list"></div>
      <div class="bt-card__body" style="border-top:1px solid var(--border)">
        <div class="bt-field"><label>Enunciado</label><input id="qs-statement" placeholder="Pergunta"></div>
        <div class="bt-fields2">
          <div class="bt-field"><label>Tipo</label><select id="qs-kind"><option value="unica">Escolha única</option><option value="multipla">Múltipla escolha</option></select></div>
          <div class="bt-field"><label>Peso</label><input id="qs-weight" type="number" min="1" value="1"></div>
        </div>
        <div class="bt-field"><label>Opções — uma por linha. Marque a correta começando a linha com <b>*</b></label>
          <textarea id="qs-options" rows="4" placeholder="*Resposta correta&#10;Resposta errada&#10;Outra errada"></textarea></div>
        <div id="qs-msg"></div>
        <div class="bt-row" style="justify-content:flex-end"><button class="bt-btn bt-btn--primary bt-btn--sm" id="qs-add">Adicionar questão</button></div>
      </div>
    </div>

    <div class="bt-row" style="justify-content:flex-end;margin-top:16px">
      <button class="bt-btn bt-btn--primary" id="ls-done">Concluir</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  draw(root);

  const close = function () { root.remove(); navigateTo("lms_admin"); };
  root.querySelector("#ls-close").onclick = close;
  root.querySelector("#ls-done").onclick = close;

  // Mostra só os campos que o tipo escolhido usa.
  const lsSyncKind = function () {
    const kind = root.querySelector("#ls-kind").value;
    const k = lmsKind(kind);
    root.querySelector("#ls-body-wrap").hidden = k.media && kind !== "link";
    root.querySelector("#ls-file-wrap").hidden = !k.media || kind === "video" || kind === "link";
    root.querySelector("#ls-url-wrap").hidden = !k.media;
  };
  root.querySelector("#ls-kind").onchange = lsSyncKind;
  lsSyncKind();

  let lsEditing = null;
  let lsPendingFile = null;

  root.querySelector("#ls-file").onchange = function (ev) {
    const f = ev.target.files[0];
    lsPendingFile = null;
    const msg = root.querySelector("#ls-msg");
    if (!f) { msg.innerHTML = ""; return; }
    if (f.size > LMS_UPLOAD_MAX) {
      msg.innerHTML = '<div class="bt-notice bt-notice--warn"><span class="bt-notice__ic">!</span><div>' +
        esc(f.name) + " tem " + (f.size / 1048576).toFixed(1) +
        " MB e não cabe no armazenamento do navegador. Informe o endereço do arquivo no campo acima.</div></div>";
      ev.target.value = "";
      return;
    }
    const fr = new FileReader();
    fr.onload = function () {
      lsPendingFile = { name: f.name, data: fr.result };
      msg.innerHTML = '<div class="bt-notice bt-notice--ok"><span class="bt-notice__ic">✓</span><div>' +
        esc(f.name) + " pronto para anexar (" + (f.size / 1024).toFixed(0) + " KB).</div></div>";
    };
    fr.readAsDataURL(f);
  };

  const lsResetForm = function () {
    lsEditing = null;
    lsPendingFile = null;
    root.querySelector("#ls-form-title").textContent = "Nova aula";
    root.querySelector("#ls-add").textContent = "Adicionar aula";
    root.querySelector("#ls-clear").style.display = "none";
    root.querySelector("#ls-title").value = "";
    root.querySelector("#ls-video").value = "";
    root.querySelector("#ls-body").value = "";
    root.querySelector("#ls-file").value = "";
    root.querySelector("#ls-secs").value = 60;
    root.querySelector("#ls-req").checked = true;
    root.querySelector("#ls-kind").value = "texto";
    root.querySelector("#ls-msg").innerHTML = "";
    lsSyncKind();
  };

  lsEdit = function (id) {
    const l = db.lessons.find(function (x) { return x.id === id; });
    if (!l) return;
    lsEditing = l.id;
    lsPendingFile = null;
    root.querySelector("#ls-form-title").textContent = "Editando a aula " + l.position;
    root.querySelector("#ls-add").textContent = "Salvar aula";
    root.querySelector("#ls-clear").style.display = "";
    root.querySelector("#ls-title").value = l.title;
    root.querySelector("#ls-kind").value = l.kind;
    root.querySelector("#ls-secs").value = l.min_seconds || 0;
    root.querySelector("#ls-req").checked = l.required !== false;
    root.querySelector("#ls-video").value = l.video || "";
    root.querySelector("#ls-body").value = l.body || "";
    root.querySelector("#ls-file").value = "";
    root.querySelector("#ls-msg").innerHTML = l.media_data
      ? '<div class="bt-notice bt-notice--info"><span class="bt-notice__ic">i</span><div>Esta aula já tem um arquivo embutido (' +
        esc(l.media_name || "arquivo") + "). Anexar outro substitui o atual.</div></div>"
      : "";
    lsSyncKind();
    root.querySelector("#ls-title").focus();
  };

  root.querySelector("#ls-clear").onclick = lsResetForm;

  root.querySelector("#ls-add").onclick = function () {
    const msg = root.querySelector("#ls-msg");
    const title = root.querySelector("#ls-title").value.trim();
    if (!title) {
      msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe o título da aula.</div></div>';
      return;
    }
    const kind = root.querySelector("#ls-kind").value;
    const url = root.querySelector("#ls-video").value.trim();
    const existing = lsEditing ? db.lessons.find(function (x) { return x.id === lsEditing; }) : null;
    const hasMedia = Boolean(lsPendingFile) || Boolean(url) || Boolean(existing && existing.media_data);
    if (lmsKind(kind).media && !hasMedia) {
      msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Este tipo de aula precisa de um arquivo anexado ou de um endereço.</div></div>';
      return;
    }

    const payload = {
      title: title, kind: kind,
      required: root.querySelector("#ls-req").checked,
      min_seconds: Number(root.querySelector("#ls-secs").value || 0),
      video: url,
      body: root.querySelector("#ls-body").value.trim()
    };
    if (lsPendingFile) { payload.media_data = lsPendingFile.data; payload.media_name = lsPendingFile.name; }

    if (existing) {
      Object.assign(existing, payload);
    } else {
      const pos = db.lessons.filter(function (l) { return l.version_id === v.id; }).length + 1;
      db.lessons.push(Object.assign({ id: lmsUid("l"), version_id: v.id, position: pos }, payload));
    }
    lmsSave();
    lsResetForm();
    draw(root);
  };

  root.querySelector("#qs-add").onclick = function () {
    const msg = root.querySelector("#qs-msg");
    if (!quiz) { msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Esta versão não tem avaliação.</div></div>'; return; }
    const statement = root.querySelector("#qs-statement").value.trim();
    const raw = root.querySelector("#qs-options").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!statement) { msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe o enunciado.</div></div>'; return; }
    if (raw.length < 2) { msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe pelo menos duas opções.</div></div>'; return; }
    const options = raw.map(function (line) {
      const correct = line.charAt(0) === "*";
      return { id: lmsUid("o"), label: correct ? line.slice(1).trim() : line, is_correct: correct };
    });
    if (!options.some(function (o) { return o.is_correct; })) {
      msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Marque ao menos uma opção correta com * no início da linha.</div></div>';
      return;
    }
    const kind = root.querySelector("#qs-kind").value;
    if (kind === "unica" && options.filter(function (o) { return o.is_correct; }).length > 1) {
      msg.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Escolha única aceita apenas uma opção correta.</div></div>';
      return;
    }
    db.questions.push({
      id: lmsUid("q"), quiz_id: quiz.id,
      position: db.questions.filter(function (q) { return q.quiz_id === quiz.id; }).length + 1,
      statement: statement, kind: kind, weight: Number(root.querySelector("#qs-weight").value || 1),
      options: options
    });
    lmsSave();
    msg.innerHTML = "";
    root.querySelector("#qs-statement").value = "";
    root.querySelector("#qs-options").value = "";
    draw(root);
  };
}

function lmsAssignModal(trainingId) {
  const db = lmsLoad();
  const t = lmsTraining(trainingId);
  const v = lmsVersionOf(trainingId);
  if (!t || !v) { alert("Treinamento sem versão publicada."); return; }
  const users = loadUsers().filter(function (u) { return u.ativo !== false; });

  const root = document.createElement("div");
  root.className = "training-modal";
  root.innerHTML = `<div class="training-dialog" style="max-width:620px">
    <button class="training-close" id="as-close">&times;</button>

      ${users.map(function (u) {
        const uid = lmsUserId(u);
        const has = db.enrollments.some(function (e) { return e.user_id === uid && e.training_id === t.id; });
        return `<label class="bt-row" style="gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;cursor:${has ? "not-allowed" : "pointer"};opacity:${has ? ".55" : "1"}">
          <input type="checkbox" class="as-user" value="${esc(uid)}" ${has ? "disabled" : ""}>
          <span><b>${esc(u.nome)}</b><div class="bt-small bt-muted">${esc(u.usuario)}${has ? " · já matriculado" : ""}</div></span></label>`;
      }).join("") || '<div class="bt-state">Nenhum usuário ativo.</div>'}
    </div>
    <div class="bt-row" style="justify-content:flex-end;margin-top:16px">
      <button class="bt-btn" id="as-cancel">Cancelar</button>
      <button class="bt-btn bt-btn--primary" id="as-save">Matricular selecionados</button>
    </div>
  </div>`;
  document.body.appendChild(root);
  const close = function () { root.remove(); };
  root.querySelector("#as-close").onclick = close;
  root.querySelector("#as-cancel").onclick = close;
  root.querySelector("#as-save").onclick = function () {
    const picked = Array.prototype.slice.call(root.querySelectorAll(".as-user:checked")).map(function (i) { return i.value; });

/* ====================================================================
   CASCA v3 — menu lateral por grupos, topbar e visão do técnico

   Reproduz a casca do biotrop-plataforma_7.html: grupos com rótulo,
   ícone alinhado, contador de pendências à direita, cartão de perfil e
   barra inferior no celular. A visão do técnico é a do v7: quatro itens
   de menu e três cartões, sem indicador nenhum.

   O recorte do técnico é por PAPEL, não por permissão — a permissão
   continua sendo a barreira de acesso. Era isso que deixava a tela
   poluída: com a lista completa filtrada só por permissão, o técnico
   via dez itens.
   ==================================================================== */

function btIsTechOnly(user) {
  const u = user || STATE.currentUser;
  if (!u) return false;
  if (isAdminUser(u)) return false;
  return u.perfilId === "tecnico";
}

/** Pendências que viram contador vermelho no menu. */
function btCounts() {
  const u = STATE.currentUser;
  if (!u) return {};
  const out = {};
  try {
    lmsEnsureEnrollments();
    const db = lmsLoad();
    const uid = lmsUserId(u);
    out.trainings = db.enrollments.filter(function (e) {
      if (e.user_id !== uid) return false;
      return !db.completions.some(function (c) { return c.enrollment_id === e.id; });
    }).length;
  } catch (err) { out.trainings = 0; }
  try {
    const meuEmail = String(u.usuario || "").trim().toLowerCase();
    out.approvals = loadScm().filter(function (s) {
      return String(s.solicitanteEmailLider || "").trim().toLowerCase() === meuEmail &&
        s.status === "pendente_aprovacao_lider";
    }).length;
    out.sci = loadSci().filter(function (s) { return ["aberto","pendente_aprovacao","aguardando_cadastro"].indexOf(s.status) >= 0; }).length;
    out.scmQueue = loadScm().filter(function (s) { return s.status === "aprovada" || s.status === "em_tratativa"; }).length;
  } catch (err) { /* contador é enfeite, não pode derrubar a casca */ }
  return out;
}

/**
 * Grupos do menu. Estrutura plana com rótulo de seção, como no v7:
 * mais legível que árvore expansível quando há muitos itens.
 */
function btNavGroups(user) {
  const u = user || STATE.currentUser;
  const c = btCounts();

  // Visão do técnico: exatamente os quatro itens do v7.
  if (btIsTechOnly(u)) {

    }];
  }

  const admin = isAdminUser(u);

  const almox = perms.almoxarifado || {};
  const has = function (flag) { return admin || Boolean(flag); };
  const g = function (label, items) {
    return { label: label, items: items.filter(Boolean) };
  };
  const i = function (id, icon, label, allowed, badge) {
    return allowed ? { id: id, icon: icon, label: label, badge: badge } : null;
  };

  return [
    g("Meu dia", [
      i("home", "⌂", "Início", true)
    ]),

    ]),

    ]),

      i("almox_scm_minhas", "⊟", "Minhas SCM", has(almox.scm_acesso)),

      i("almox_scm_aprovacao", "✓", "Aprovações SCM", has(almox.scm_aprovacao), c.approvals)
    ]),
    g("PCM", [
      i("pcm", "◱", "PCM", has(perms.pcm && perms.pcm.acesso))
    ]),
    g("Treinamentos", [
      i("lms_my", "▷", "Meus treinamentos", true, c.trainings),
      i("lms_cert", "⎙", "Comprovantes", true),

    ]),

/** Barra inferior do celular: no máximo 5, sempre com a ação principal. */
function btTabItems() {
  const u = STATE.currentUser;

  const almox = perms.almoxarifado || {};
