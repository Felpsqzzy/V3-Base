<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biotrop - Plataforma de Manutenção</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: #f4f7f6;
    min-height: 100vh;
  }
  #app { min-height: 100vh; width: 100%; }

  /* ============ LOGIN ============ */
  .login-wrap { display: flex; width: 100%; min-height: 100vh; }
  .login-left { flex: 1.75; background: #003C41; position: relative; overflow: hidden; min-width: 0; }
  .left-panel-img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }

  .login-right { flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 40px 24px; min-width: 0; }
  .right-inner { width: 100%; max-width: 380px; }

  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-img-right { height: 40px; width: auto; display: block; }

  .welcome-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .welcome-icon { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #1a8f6b; color: #1a8f6b; display: flex; align-items: center; justify-content: center; }
  .welcome-title { font-size: 22px; font-weight: 800; color: #003C41; margin: 0; }
  .welcome-sub { font-size: 13.5px; color: #6b7a75; margin: 4px 0 24px 42px; }

  .field-label { font-size: 13px; font-weight: 600; color: #26463b; display: block; margin-bottom: 6px; }
  .input-wrap { display: flex; align-items: center; gap: 8px; border: 1.5px solid #d7e6df; border-radius: 10px; padding: 11px 14px; background: #fbfdfc; }
  .input-wrap:focus-within { border-color: #1a8f6b; }
  .input-wrap input { border: none; outline: none; background: transparent; flex: 1; font-size: 14px; color: #17332b; font-family: inherit; }
  .input-icon { color: #8fa89e; flex-shrink: 0; }
  .eye-btn { background: none; border: none; color: #8fa89e; cursor: pointer; padding: 2px; display: flex; }

  .login-error { background: #fdecec; color: #b3261e; font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-top: 12px; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 20px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #33473f; cursor: pointer; }
  .checkbox-row input { accent-color: #1a8f6b; width: 15px; height: 15px; cursor: pointer; }
  .link-btn { background: none; border: none; color: #1a8f6b; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  .submit-btn { width: 100%; background: #003C41; color: #fff; border: none; border-radius: 999px; padding: 8px 20px 8px 8px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; font-family: inherit; }
  .submit-btn:hover { background: #002a2e; }
  .submit-btn-icon { width: 34px; height: 34px; border-radius: 50%; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .hint-box { margin-top: 12px; background: #eef6f2; color: #26463b; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; }

  .divider { display: flex; align-items: center; text-align: center; margin: 22px 0; color: #a9b8b2; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #e5eeea; }
  .divider span { padding: 0 12px; }

  .secure-box { display: flex; gap: 10px; align-items: flex-start; background: #eef8f3; border-radius: 10px; padding: 13px 14px; margin-bottom: 20px; }
  .secure-title { font-size: 13.5px; font-weight: 700; color: #003C41; }
  .secure-sub { font-size: 12px; color: #5f7d72; margin-top: 2px; }

  .help-row { display: flex; gap: 10px; align-items: flex-start; }
  .help-title { font-size: 13.5px; font-weight: 700; color: #003C41; }
  .help-sub { font-size: 12px; color: #6b7a75; line-height: 1.5; margin-top: 2px; }

  .demo-note { margin-top: 22px; font-size: 11px; color: #9aa8a3; text-align: center; }

  /* ============ APP SHELL ============ */
  .shell { display: flex; width: 100%; min-height: 100vh; }
  .sidebar { width: 240px; background: linear-gradient(180deg, #003C41, #005058 60%, #003C41); color: #fff; display: flex; flex-direction: column; padding: 22px 16px; flex-shrink: 0; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 18px; }
  .sidebar-logo-icon { height: 34px; width: auto; display: block; flex-shrink: 0; }
  .sb-name { font-weight: 800; font-size: 16px; }
  .sb-sub { font-size: 10.5px; color: #a9d9c4; }

  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 10px; background: none; border: none; color: #cfe9de; padding: 11px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; font-family: inherit; width: 100%; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: #14563f; color: #fff; font-weight: 700; }
  .nav-item-sub { padding-left: 30px; font-size: 13px; color: #a9d9c4; }
  .nav-item-lvl1 { padding-left: 30px; font-size: 13.5px; }
  .nav-item-lvl2 { padding-left: 46px; font-size: 13px; color: #a9d9c4; }
  .nav-children { display: flex; flex-direction: column; gap: 2px; }
  .nav-chevron { margin-left: auto; display: flex; transition: transform 0.15s ease; transform: rotate(-90deg); flex-shrink: 0; }
  .nav-chevron.expanded { transform: rotate(0deg); }
  .nav-group span:not(.nav-chevron) { flex: 1; }

  .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.12); padding-top: 14px; margin-top: 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 6px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a8f6b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 700; }
  .user-role { font-size: 11px; color: #a9d9c4; }
  .logout-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }
  .logout-btn:hover { background: rgba(255,255,255,0.15); }

  .mobile-menu-btn { display: none; }

  .main-area { flex: 1; padding: 32px 40px; overflow-y: auto; min-width: 0; }
  .storage-warning { background: #fff4e5; color: #8a5a00; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; }

  .page-title-row { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .page-icon { width: 48px; height: 48px; border-radius: 12px; background: #e3eff0; color: #003C41; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .page-title-row h1 { font-size: 22px; font-weight: 800; color: #17332b; margin: 0 0 4px; }
  .page-title-row p { font-size: 13.5px; color: #6b7a75; margin: 0; }
  .page-title-row .primary-btn { margin-left: auto; }

  .empty-card { background: #fff; border: 1.5px dashed #d7e6df; border-radius: 16px; padding: 48px 24px; text-align: center; color: #4d635a; }
  .empty-icon { width: 56px; height: 56px; border-radius: 50%; background: #eef8f3; color: #1a8f6b; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .empty-title { font-weight: 700; font-size: 15px; color: #17332b; margin-bottom: 6px; }
  .empty-desc { font-size: 13.5px; max-width: 420px; margin: 0 auto; line-height: 1.6; }

  .primary-btn { display: flex; align-items: center; gap: 6px; background: #003C41; color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .primary-btn:hover { background: #002a2e; }
  .ghost-btn { background: none; border: 1.5px solid #d7e6df; color: #33473f; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .danger-btn { display: flex; align-items: center; gap: 6px; background: #d64545; color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .table-card { background: #fff; border-radius: 16px; border: 1px solid #e7f0ec; overflow: hidden; overflow-x: auto; }
  .users-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
  .users-table th { text-align: left; background: #f6faf8; color: #4d635a; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; padding: 12px 18px; border-bottom: 1px solid #e7f0ec; }
  .users-table td { padding: 13px 18px; border-bottom: 1px solid #f0f5f2; color: #17332b; }
  .users-table tr:last-child td { border-bottom: none; }

  .badge { background: #eef2f0; color: #4d635a; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge-admin { background: #e3eff0; color: #003C41; }

  .area-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: #eef8f3; color: #1a8f6b; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
  .tag-empty { color: #b0bdb8; font-size: 12px; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn { background: #f4f7f6; border: none; color: #33473f; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: #e7f0ec; }
  .icon-btn.danger { color: #d64545; }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(11,61,46,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal.small { max-width: 380px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-header h3 { margin: 0; font-size: 17px; color: #17332b; }
  .modal-input { width: 100%; border: 1.5px solid #d7e6df; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #17332b; outline: none; }
  .modal-input:focus { border-color: #1a8f6b; }
  .area-checks { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .confirm-text { font-size: 13.5px; color: #33473f; line-height: 1.6; }

  .home-menu { max-width: 980px; margin: 0 auto; padding-top: 24px; }
  .home-header { text-align: center; margin-bottom: 40px; }
  .home-header h1 { font-size: 28px; font-weight: 800; color: #17332b; margin: 0 0 8px; }
  .home-header p { font-size: 14.5px; color: #6b7a75; margin: 0; }
  .home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
  .home-card { background: #fff; border: 1.5px solid #e7f0ec; border-radius: 18px; padding: 32px 26px; text-align: left; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 10px; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; width: 100%; }
  .home-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(11,61,46,0.10); border-color: #1a8f6b; }
  .home-card-icon { width: 52px; height: 52px; border-radius: 14px; background: #e3eff0; color: #003C41; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .home-card-title { font-size: 18px; font-weight: 800; color: #17332b; }
  .home-card-desc { font-size: 13.5px; color: #6b7a75; line-height: 1.5; flex: 1; }
  .home-card-arrow { font-size: 13px; font-weight: 700; color: #1a8f6b; margin-top: 6px; }
  .home-empty { grid-column: 1 / -1; background: #fff; border: 1.5px dashed #d7e6df; border-radius: 16px; padding: 40px 24px; text-align: center; color: #6b7a75; font-size: 14px; }

  .tabs-row { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1.5px solid #e7f0ec; }
  .tab-btn { background: none; border: none; padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: #6b7a75; cursor: pointer; font-family: inherit; border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; }
  .tab-btn:hover { color: #17332b; }
  .tab-btn.active { color: #003C41; border-bottom-color: #1a8f6b; }

  .sci-card { background: #fff; border: 1px solid #e7f0ec; border-radius: 16px; padding: 28px; max-width: 640px; }
  .sci-section-title { font-size: 14px; font-weight: 800; color: #003C41; margin: 22px 0 6px; padding-top: 16px; border-top: 1px solid #f0f5f2; }
  .sci-photo-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  textarea.modal-input { resize: vertical; font-family: inherit; }

  .fam-field-row { display: flex; align-items: center; gap: 10px; }
  .fam-field-row .fam-field-label { flex: 1; }
  .fam-field-row .fam-field-req { white-space: nowrap; }

  .sci-detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f5f2; font-size: 13.5px; }
  .sci-detail-label { color: #6b7a75; font-weight: 600; }
  .sci-detail-value { color: #17332b; text-align: right; }

  .scm-item-card { background: #fafcfb; border: 1px solid #e7f0ec; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .scm-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

  @media (max-width: 900px) {
    .login-left { display: none; }
    .login-right { flex: 1; }
  }
  @media (max-width: 768px) {
    .mobile-menu-btn { display: flex; position: fixed; top: 16px; left: 16px; z-index: 40; background: #003C41; color: #fff; border: none; width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 45; transform: translateX(-100%); transition: transform 0.2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 42; }
    .main-area { padding: 72px 18px 24px; }
  }

.register-access-btn{width:100%;margin-top:10px;border:1px solid #cfe0dd;background:transparent;color:#006257;border-radius:11px;padding:10px;font-weight:700;cursor:pointer}

.training-page{padding:28px;max-width:1500px;margin:auto}
.training-hero{background:linear-gradient(135deg,#003c41,#0b6b61);border-radius:24px;padding:28px;color:#fff;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;box-shadow:0 18px 45px rgba(0,60,65,.18)}
.training-hero h1{margin:0 0 8px;font-size:30px}.training-hero p{margin:0;color:rgba(255,255,255,.78);max-width:720px}
.training-actions{display:flex;gap:10px;flex-wrap:wrap}.t-btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}.t-btn.primary{background:#fff;color:#003c41}.t-btn.green{background:#7dd3a7;color:#003c41}.t-btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.training-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.t-kpi{background:var(--surface,#fff);border:1px solid var(--border,#e6eceb);border-radius:18px;padding:18px}.t-kpi .n{font-size:28px;font-weight:800;color:var(--text,#17363a)}.t-kpi .l{font-size:12px;color:var(--muted,#6b7c7f);margin-top:4px}
.training-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0;flex-wrap:wrap}.training-tabs{display:flex;gap:6px;overflow:auto}.t-tab{border:0;background:transparent;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted,#6b7c7f)}.t-tab.active{background:#e8f3f0;color:#006257}
.training-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.training-card{background:var(--surface,#fff);border:1px solid var(--border,#e6eceb);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.04);transition:.2s}.training-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.08)}
.training-thumb{height:150px;background:linear-gradient(135deg,#e9f4f0,#d7e9e4);display:flex;align-items:center;justify-content:center;color:#006257;position:relative}.training-thumb .play{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.training-body{padding:16px}.training-body h3{margin:0 0 7px;color:var(--text,#17363a)}.training-body p{font-size:13px;color:var(--muted,#6b7c7f);min-height:38px}.training-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.training-tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4f2;color:#42615e}.training-progress{height:7px;background:#e8eeee;border-radius:99px;overflow:hidden}.training-progress i{display:block;height:100%;background:#1b9b7c;border-radius:99px}.training-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted,#6b7c7f)}
.training-modal{position:fixed;inset:0;background:rgba(5,25,28,.62);display:grid;place-items:center;padding:20px;z-index:9999}.training-dialog{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--surface,#fff);color:var(--text,#17363a);border-radius:22px;padding:22px}.training-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.training-form-grid .full{grid-column:1/-1}.training-form-grid input,.training-form-grid textarea,.training-form-grid select{width:100%;padding:11px;border:1px solid var(--border,#dbe4e2);border-radius:10px;background:var(--input,#fff);color:var(--text,#17363a)}.training-label{font-size:12px;font-weight:800;margin-bottom:6px;display:block}.training-close{float:right;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted,#6b7c7f)}
.video-wrap{background:#081719;border-radius:16px;overflow:hidden}.video-wrap video,.video-wrap iframe{width:100%;height:430px;border:0;display:block}.training-check{display:flex;align-items:center;gap:8px;margin-top:12px}.training-empty{padding:50px;text-align:center;border:1px dashed var(--border,#dbe4e2);border-radius:18px;color:var(--muted,#6b7c7f)}
.dark .training-card,.dark .t-kpi,.dark .training-dialog{background:#102124;color:#e8f1ef;border-color:#263b3d}.dark .training-body h3,.dark .t-kpi .n{color:#eef7f5}.dark .training-thumb{background:#183235}.dark .training-tag{background:#1a3235;color:#b9cfca}.dark .training-progress{background:#20383a}.dark .training-form-grid input,.dark .training-form-grid textarea,.dark .training-form-grid select{background:#0c1b1d;color:#e8f1ef;border-color:#2b4547}
@media(max-width:1050px){.training-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.training-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.training-page{padding:16px}.training-hero{display:block}.training-actions{margin-top:18px}.training-grid{grid-template-columns:1fr}.training-form-grid{grid-template-columns:1fr}.training-form-grid .full{grid-column:auto}.video-wrap video,.video-wrap iframe{height:240px}}

<style id="biotrop-side-v4">
/* ====================================================================
   Menu lateral v4

   O problema não era o estilo da barra de rolagem: eram 16 itens
   abertos ao mesmo tempo numa coluna de altura fixa. Três mudanças
   atacam a causa, e a rolagem deixa de aparecer na maioria dos perfis:

   1. grupos recolhíveis — abre o do lugar onde você está, os outros
      ficam fechados e contam as pendências no próprio cabeçalho;
   2. busca — com 16 destinos, achar é mais rápido que percorrer;
   3. modo compacto — a coluna vira uma faixa de ícones de 76 px.

   E quando ainda sobra rolagem, ela é fina, no tom do menu e só
   aparece com o ponteiro em cima.
   ==================================================================== */

.bt-side { grid-template-rows: auto auto auto 1fr auto; gap: 12px; }

/* ---------- cabeçalho com o botão de recolher ---------- */

.bt-brand { position: relative; }
.bt-railbtn {
  position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
  border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08);
  color: #d9f7f3; cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
  transition: background .15s ease;
}
.bt-railbtn:hover { background: rgba(255, 255, 255, .18); }

/* ---------- busca ---------- */

.bt-navsearch { position: relative; }
.bt-navsearch input {
  width: 100%; box-sizing: border-box; padding: 9px 30px 9px 32px;
  border-radius: 12px; border: 1px solid rgba(255, 255, 255, .16);
  background: rgba(255, 255, 255, .07); color: #eafaf7; font-size: 12.5px;
  font-family: inherit; outline: none;
}
.bt-navsearch input::placeholder { color: rgba(234, 250, 247, .5); }
.bt-navsearch input:focus { border-color: rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .12); }
.bt-navsearch__ic {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  opacity: .55; font-size: 12px; pointer-events: none;
}
.bt-navsearch__clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: 0; background: none; color: rgba(234, 250, 247, .6); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 2px 4px;
}

/* ---------- grupos recolhíveis ---------- */

.bt-nav { display: grid; gap: 2px; align-content: start; overflow-y: auto; padding-right: 3px; }

.bt-nav__grouphead {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 9px 11px; margin-top: 6px; border: 0; background: transparent;
  color: rgba(255, 255, 255, .58); font-family: inherit; cursor: pointer;
  font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  border-radius: 10px; transition: background .14s ease, color .14s ease;
}
.bt-nav__grouphead:first-child { margin-top: 0; }
.bt-nav__grouphead:hover { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .85); }
.bt-nav__grouphead .lbl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bt-nav__chev {
  font-size: 9px; opacity: .6; transition: transform .18s ease; display: inline-block;
}
.bt-nav__grouphead[aria-expanded="true"] .bt-nav__chev { transform: rotate(90deg); }
.bt-nav__groupcount {
  background: var(--danger); color: #fff; font-size: 9.5px; padding: 1px 6px;
  border-radius: 999px; font-weight: 800; letter-spacing: 0;
}
.bt-nav__groupdot {
  width: 5px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .32);
}

.bt-nav__items { display: grid; gap: 2px; overflow: hidden; }
.bt-nav__items[hidden] { display: none; }

.bt-nav button.bt-nav__item {
  position: relative; padding: 10px 12px 10px 15px; border-radius: 12px;
}
.bt-nav button.bt-nav__item.is-current::before {
  content: ""; position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 17px; border-radius: 999px; background: #5fd6cf;
}

/* ---------- barra de rolagem discreta ---------- */

.bt-nav { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .16) transparent; }
.bt-nav::-webkit-scrollbar { width: 6px; }
.bt-nav::-webkit-scrollbar-track { background: transparent; }
.bt-nav::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
.bt-nav:hover::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); }
.bt-nav::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .3); }

/* Vale para o resto da aplicação também. */
* { scrollbar-width: thin; }
.bt-page ::-webkit-scrollbar, .bt-tablewrap::-webkit-scrollbar,
.training-dialog::-webkit-scrollbar, .modal::-webkit-scrollbar { width: 8px; height: 8px; }
.bt-page ::-webkit-scrollbar-track, .bt-tablewrap::-webkit-scrollbar-track { background: transparent; }
.bt-page ::-webkit-scrollbar-thumb, .bt-tablewrap::-webkit-scrollbar-thumb,
.training-dialog::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 999px;
}
.bt-page ::-webkit-scrollbar-thumb:hover, .bt-tablewrap::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ---------- modo compacto (faixa de ícones) ---------- */

body.bt-rail .bt-shell { grid-template-columns: 76px 1fr; }
body.bt-rail .bt-side { padding: 18px 10px; gap: 10px; }
body.bt-rail .bt-brand__name,
body.bt-rail .bt-brand__sub,
body.bt-rail .bt-rolepill,
body.bt-rail .bt-navsearch,
body.bt-rail .bt-nav__label,
body.bt-rail .bt-nav__grouphead .lbl,
body.bt-rail .bt-nav__chev,
body.bt-rail .bt-sidefoot__mail,
body.bt-rail .bt-sidefoot button span { display: none !important; }
body.bt-rail .bt-brand { justify-content: center; }
body.bt-rail .bt-brand__mark { width: 44px; height: 44px; border-radius: 14px; }
body.bt-rail .bt-railbtn { right: -14px; }
body.bt-rail .bt-nav__grouphead {
  justify-content: center; padding: 6px 0; margin-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, .10); border-radius: 0;
}
body.bt-rail .bt-nav__grouphead:first-child { border-top: 0; margin-top: 0; }
body.bt-rail .bt-nav__grouphead:hover { background: transparent; }
body.bt-rail .bt-nav__items { display: grid !important; }
body.bt-rail .bt-nav button.bt-nav__item { justify-content: center; padding: 11px 0; }
body.bt-rail .bt-nav button.bt-nav__item.is-current::before { left: 2px; }
body.bt-rail .bt-nav__badge {
  position: absolute; top: 4px; right: 10px; padding: 0 4px; font-size: 9px; min-width: 14px; text-align: center;
}
body.bt-rail .bt-sidefoot { padding: 10px; }

/* Rótulo flutuante no modo compacto, no lugar do texto escondido. */
body.bt-rail .bt-nav__item { position: relative; }
body.bt-rail .bt-nav__item::after {
  content: attr(data-label); position: absolute; left: calc(100% + 10px); top: 50%;
  transform: translateY(-50%) scale(.96); transform-origin: left center;
  background: var(--text); color: var(--surface); padding: 6px 10px; border-radius: 9px;
  font-size: 12px; font-weight: 700; white-space: nowrap; letter-spacing: 0;
  text-transform: none; opacity: 0; pointer-events: none; z-index: 60;
  transition: opacity .14s ease, transform .14s ease;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
}
body.bt-rail .bt-nav__item:hover::after { opacity: 1; transform: translateY(-50%) scale(1); }

/* ---------- resultado da busca ---------- */

.bt-nav__empty {
  padding: 16px 12px; font-size: 12px; color: rgba(255, 255, 255, .55); text-align: center;
}
.bt-nav__hit b { color: #fff; }

@media (max-width: 1050px) {
  body.bt-rail .bt-shell { grid-template-columns: 1fr; }
  body.bt-rail .bt-side { width: 282px; padding: 22px 16px; }
  body.bt-rail .bt-brand__name, body.bt-rail .bt-brand__sub, body.bt-rail .bt-rolepill,
  body.bt-rail .bt-navsearch, body.bt-rail .bt-nav__label,
  body.bt-rail .bt-nav__grouphead .lbl, body.bt-rail .bt-nav__chev,
  body.bt-rail .bt-sidefoot__mail, body.bt-rail .bt-sidefoot button span { display: initial !important; }
  body.bt-rail .bt-nav__grouphead .lbl { display: block !important; }
  .bt-railbtn { display: none; }
}
</style>
<style id="biotrop-ui-apple">
/* ====================================================================
   Camada visual v5 — linguagem do macOS/iOS sobre a identidade Biotrop

   O que caracteriza esse visual, e o que aplico aqui:

   1. Vidro fosco de verdade: fundo translúcido + backdrop-filter com
      blur E saturate. Sem o saturate o vidro fica cinza; é ele que dá a
      cor "vazando" por baixo.
   2. Curvas contínuas e generosas: raio grande (18-26px) e borda de
      espessura de fio (rgba, não cinza chapado).
   3. Sombra em camadas: uma curta e escura para assentar o objeto, uma
      longa e suave para a profundidade. Uma sombra só sempre parece
      adesivo.
   4. Movimento com física: a curva padrão da Apple é
      cubic-bezier(.32,.72,0,1) — sai rápido e assenta devagar. Para o
      que "aparece", um leve overshoot.
   5. Resposta ao toque: tudo que é clicável encolhe um pouco no :active.
      É o que faz a interface parecer material, e não desenho.

   Tudo respeita prefers-reduced-motion no fim do arquivo.
   ==================================================================== */

:root {
  /* Curvas de animação */
  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
  --dur-1: .18s;
  --dur-2: .32s;
  --dur-3: .48s;

  /* Vidro (claro) */
  --glass-bg: rgba(255, 255, 255, .72);
  --glass-bg-strong: rgba(255, 255, 255, .86);
  --glass-line: rgba(255, 255, 255, .7);
  --hairline: rgba(16, 36, 39, .10);
  --blur: saturate(180%) blur(22px);

  /* Sombra em camadas */
  --lift-1: 0 1px 2px rgba(10, 38, 40, .07), 0 8px 24px -6px rgba(10, 38, 40, .10);
  --lift-2: 0 2px 4px rgba(10, 38, 40, .08), 0 18px 44px -10px rgba(10, 38, 40, .16);
  --lift-3: 0 4px 8px rgba(10, 38, 40, .10), 0 40px 80px -16px rgba(10, 38, 40, .28);

  --radius: 22px;
  --radius-sm: 14px;
  --radius-xs: 11px;
}

body.v12-dark {
  --glass-bg: rgba(18, 34, 36, .68);
  --glass-bg-strong: rgba(18, 34, 36, .88);
  --glass-line: rgba(255, 255, 255, .10);
  --hairline: rgba(255, 255, 255, .12);
  --lift-1: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 24px -6px rgba(0, 0, 0, .42);
  --lift-2: 0 2px 6px rgba(0, 0, 0, .38), 0 20px 48px -10px rgba(0, 0, 0, .55);
  --lift-3: 0 6px 12px rgba(0, 0, 0, .42), 0 44px 88px -16px rgba(0, 0, 0, .68);
}

/* ---------- tipografia ---------- */

body, .bt-btn, input, select, textarea, button {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
    "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, .bt-kpi__value, .apt-title, .bt-hello, .cert-name {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
    "Segoe UI", Inter, system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: -.022em;
}
.bt-kpi__value, .apt-title, .bt-hello { letter-spacing: -.035em; }
.bt-nav__group, .bt-steplabel, .bt-kpi__label, .bt-table th, .cert-brand {
  letter-spacing: .06em;
}

/* ---------- fundo da aplicação ---------- */

body {
  background:
    radial-gradient(1100px 640px at 8% -12%, rgba(13, 95, 100, .16), transparent 62%),
    radial-gradient(900px 520px at 102% 4%, rgba(84, 214, 207, .13), transparent 58%),
    var(--bg) !important;
  background-attachment: fixed;
}

  background:
    radial-gradient(1100px 640px at 8% -12%, rgba(52, 176, 177, .16), transparent 62%),
    radial-gradient(900px 520px at 102% 4%, rgba(13, 95, 100, .22), transparent 58%),
    var(--bg) !important;
}

/* ---------- barra lateral: vidro escuro ---------- */

.bt-side {
  background:
    linear-gradient(180deg, rgba(7, 60, 63, .92) 0%, rgba(4, 38, 41, .94) 55%, rgba(3, 30, 33, .96) 100%) !important;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-right: 1px solid rgba(255, 255, 255, .07);
  box-shadow: 1px 0 0 rgba(255, 255, 255, .05), 12px 0 40px -12px rgba(2, 22, 24, .5);
}
body.v12-dark .bt-side {
  background: linear-gradient(180deg, rgba(6, 26, 28, .92), rgba(4, 18, 20, .96)) !important;
}

.bt-brand__mark {
  background: linear-gradient(145deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .06)) !important;

/* ---------- itens do menu ---------- */

.bt-nav button.bt-nav__item {

    transform var(--dur-1) var(--ease);
}
.bt-nav button.bt-nav__item:hover {

/* Item de submenu (Apontamentos, Gestão de medidores) recuado. */
.bt-nav button.bt-nav__item[data-sub="1"] { padding-left: 34px; font-size: 13px; opacity: .92; }
.bt-nav button.bt-nav__item[data-sub="1"]::after {
  content: ""; position: absolute; left: 21px; top: 50%; width: 6px; height: 1px;
  background: rgba(255, 255, 255, .28); transform: translateY(-50%);
}
body.bt-rail .bt-nav button.bt-nav__item[data-sub="1"] { padding-left: 0; }
body.bt-rail .bt-nav button.bt-nav__item[data-sub="1"]::after { display: none; }

/* ---------- topbar de vidro ---------- */

.bt-topbar {
  background: var(--glass-bg) !important;
  backdrop-filter: var(--blur) !important;
  -webkit-backdrop-filter: var(--blur) !important;
  border-bottom: 1px solid var(--hairline) !important;
}

/* ---------- superfícies ---------- */

.bt-card, .table-card, .sci-card, .scm-item-card, .bt-kpi, .apt-choice, .apt-meter,
.apt-last, .bt-bigaction, .cert-sheet {
  background: var(--glass-bg-strong) !important;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--hairline) !important;
  box-shadow: var(--lift-1) !important;
  border-radius: var(--radius) !important;
}
.bt-kpi, .apt-meter { border-radius: var(--radius-sm) !important; }

.bt-card__head { border-bottom: 1px solid var(--hairline); }
.bt-card:hover { box-shadow: var(--lift-2) !important; }
.bt-card { transition: box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease); }

/* Reflexo de topo, o brilho que o vidro da Apple tem. */
.bt-card, .bt-kpi, .apt-choice, .bt-bigaction { position: relative; overflow: hidden; }
.bt-card::before, .bt-kpi::before, .apt-choice::before, .bt-bigaction::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-line), transparent);
  pointer-events: none;
}

/* ---------- entrada do conteúdo ---------- */

#main-content { animation: btEnter var(--dur-3) var(--ease) both; }
@keyframes btEnter {
  from { opacity: 0; transform: translateY(10px) scale(.994); }
  to { opacity: 1; transform: none; }
}

/* Escada nos indicadores: cada um entra 40 ms depois do anterior. */
.bt-grid--kpi > * { animation: btRise var(--dur-3) var(--ease) both; }
.bt-grid--kpi > *:nth-child(1) { animation-delay: .02s; }
.bt-grid--kpi > *:nth-child(2) { animation-delay: .06s; }
.bt-grid--kpi > *:nth-child(3) { animation-delay: .10s; }
.bt-grid--kpi > *:nth-child(4) { animation-delay: .14s; }
.bt-grid--kpi > *:nth-child(n+5) { animation-delay: .18s; }
@keyframes btRise {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to { opacity: 1; transform: none; }
}

.bt-item { transition: background var(--dur-1) var(--ease); }
.bt-table tbody tr { transition: background var(--dur-1) var(--ease); }

/* ---------- botões ---------- */

.bt-btn, .primary-btn, .ghost-btn, .danger-btn, .submit-btn, .icon-btn, .tab-btn, .bt-chip {
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
    box-shadow var(--dur-1) var(--ease), transform var(--dur-1) var(--ease),
    color var(--dur-1) var(--ease);
}
.bt-btn:active, .primary-btn:active, .ghost-btn:active, .danger-btn:active,
.submit-btn:active, .icon-btn:active, .bt-chip:active, .apt-choice:active,
.apt-meter:active, .bt-bigaction:active { transform: scale(.97); }

.bt-btn--primary, .primary-btn, .submit-btn {
  background: linear-gradient(180deg, #12747a, #0b565a) !important;
  border: 1px solid rgba(0, 0, 0, .12) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 18px -6px rgba(11, 86, 90, .6) !important;
}
.bt-btn--primary:hover, .primary-btn:hover, .submit-btn:hover {
  background: linear-gradient(180deg, #14848b, #0c6165) !important;
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), 0 10px 26px -8px rgba(11, 86, 90, .7) !important;
}
.bt-btn:not(.bt-btn--primary):not(.bt-btn--danger), .ghost-btn {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(10px);
  border: 1px solid var(--hairline) !important;
}
.bt-btn--danger, .danger-btn {
  background: linear-gradient(180deg, #d1585e, #b53c43) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 6px 18px -6px rgba(181, 60, 67, .5) !important;
}

/* ---------- campos ---------- */

.bt-field input, .bt-field select, .bt-field textarea, .modal-input, .input-wrap {
  background: var(--glass-bg) !important;
  border: 1px solid var(--hairline) !important;
  border-radius: var(--radius-xs) !important;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease),
    background var(--dur-1) var(--ease);
}
.bt-field input:focus, .bt-field select:focus, .bt-field textarea:focus,
.modal-input:focus, .input-wrap:focus-within {
  border-color: rgba(13, 95, 100, .55) !important;
  box-shadow: 0 0 0 4px rgba(13, 95, 100, .12) !important;
  background: var(--glass-bg-strong) !important;
}

/* ---------- modais ---------- */

.modal-backdrop, .training-modal {
  background: rgba(8, 28, 30, .34) !important;
  backdrop-filter: saturate(140%) blur(14px) !important;
  -webkit-backdrop-filter: saturate(140%) blur(14px) !important;
  animation: btFade var(--dur-2) var(--ease) both;
}
@keyframes btFade { from { opacity: 0; } to { opacity: 1; } }

.modal, .training-dialog {
  background: var(--glass-bg-strong) !important;
  backdrop-filter: var(--blur) !important;
  -webkit-backdrop-filter: var(--blur) !important;
  border: 1px solid var(--glass-line) !important;
  border-radius: 26px !important;
  box-shadow: var(--lift-3) !important;
  animation: btPop var(--dur-3) var(--ease-spring) both;
}
@keyframes btPop {
  from { opacity: 0; transform: scale(.94) translateY(12px); }
  to { opacity: 1; transform: none; }
}
.modal-header { border-bottom: 1px solid var(--hairline); padding-bottom: 14px; }

/* ---------- avisos e etiquetas ---------- */

.bt-notice {
  border-radius: var(--radius-sm);
  backdrop-filter: blur(10px);
  animation: btRise var(--dur-2) var(--ease) both;
}
.bt-badge {
  backdrop-filter: blur(6px);
  border-radius: 999px;
  transition: transform var(--dur-1) var(--ease);
}
.bt-badge--danger { animation: btPulse 2.4s ease-in-out infinite; }
@keyframes btPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(196, 69, 76, 0); }
  50% { box-shadow: 0 0 0 4px rgba(196, 69, 76, .14); }
}
.bt-nav__badge, .bt-nav__groupcount { animation: btPulse 2.4s ease-in-out infinite; }

/* ---------- abas ---------- */

.tabs-row { border-bottom: 1px solid var(--hairline) !important; }
.tab-btn { border-radius: var(--radius-xs) var(--radius-xs) 0 0; position: relative; }
.tab-btn.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px;
  border-radius: 2px; background: var(--primary);
  animation: btGrow var(--dur-2) var(--ease) both;
}
@keyframes btGrow { from { transform: scaleX(0); } to { transform: none; } }

/* ---------- ícones ---------- */

/* Caixa fixa: é o alinhamento que faz um conjunto de ícones parecer
   organizado, mais até que o desenho de cada um. */
.bt-nav__icon, .bt-tabbar__ic {
  width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 auto;
}
.bt-nav__icon svg, .bt-tabbar__ic svg { width: 18px; height: 18px; display: block; }
.bt-nav__item .bt-nav__icon svg { opacity: .82; transition: opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
.bt-nav__item:hover .bt-nav__icon svg { opacity: 1; transform: scale(1.06); }
.bt-nav__item.is-current .bt-nav__icon svg { opacity: 1; }

.page-icon {
  background: linear-gradient(145deg, rgba(13, 95, 100, .16), rgba(13, 95, 100, .06)) !important;
  border: 1px solid rgba(13, 95, 100, .16);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
  border-radius: 16px !important;
  display: grid; place-items: center;
  width: 46px; height: 46px;
}
.bt-bigaction__ic {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(13, 95, 100, .14), rgba(13, 95, 100, .05));
  border: 1px solid rgba(13, 95, 100, .14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: transform var(--dur-2) var(--ease-spring);
}
.bt-bigaction:hover .bt-bigaction__ic { transform: scale(1.08) translateY(-2px); }
.bt-bigaction { transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), border-color var(--dur-1) var(--ease); }
.bt-bigaction:hover { transform: translateY(-4px); box-shadow: var(--lift-2) !important; }

.apt-choice__ic {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(13, 95, 100, .13), rgba(13, 95, 100, .05));
  border: 1px solid rgba(13, 95, 100, .13);
  font-size: 22px; margin-bottom: 8px;
}
.apt-choice { transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), border-color var(--dur-1) var(--ease); }
.apt-choice:hover { transform: translateY(-4px); box-shadow: var(--lift-2) !important; }

/* ---------- barra inferior do celular ---------- */

@media (max-width: 1050px) {
  .bt-tabbar {
    background: var(--glass-bg-strong) !important;
    backdrop-filter: var(--blur) !important;
    -webkit-backdrop-filter: var(--blur) !important;
    border-top: 1px solid var(--hairline) !important;
  }
  .bt-tabbar button { transition: color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
  .bt-tabbar button:active { transform: scale(.92); }
  .bt-side { box-shadow: var(--lift-3); }
  .bt-scrim { backdrop-filter: blur(6px); animation: btFade var(--dur-2) var(--ease) both; }
}

/* ---------- barra de progresso ---------- */

.bt-progress { background: var(--hairline); }
.bt-progress__fill, .bt-bar__fill {
  background: linear-gradient(90deg, #0d5f64, #3fb9b2) !important;
  box-shadow: 0 0 12px -2px rgba(63, 185, 178, .5);
  transition: width var(--dur-3) var(--ease);
}

/* ---------- respeito a quem pediu menos movimento ---------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
<style id="biotrop-ui-correcoes">
/* ====================================================================
   Correções do visual v5

   1. VIDRO SOBRE VIDRO. O fundo do modal tinha backdrop-filter e o
      modal dentro dele também. backdrop-filter cria um contexto novo:
      aninhado, o filho borra o que o pai já borrou e o resultado é uma
      névoa cinza sem contorno — foi o que apareceu na tela. O modal
      passa a ter fundo quase opaco e NENHUM backdrop-filter; só o fundo
      atrás dele desfoca, e menos.

   2. PISCA-PISCA. Os contadores tinham animação infinita. Repetir para
      sempre não chama atenção, vira defeito visual.

   3. ENTRADA EXAGERADA. Escada nos indicadores e deslocamento no
      conteúdo faziam a tela parecer que estava carregando errado.
      Sobrou um fade curto.
   ==================================================================== */

/* ---------- 1. modal: fundo sólido, sem vidro aninhado ---------- */

.modal-backdrop, .training-modal {
  background: rgba(6, 24, 26, .52) !important;
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  animation: none !important;
  /* Alinha no topo: modal alto centralizado nasce com o meio na tela e
     parece cortado. */
  align-items: flex-start !important;
  padding: 32px 20px !important;
  overflow-y: auto !important;
}

.modal, .training-dialog {
  background: #ffffff !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border: 1px solid rgba(16, 36, 39, .10) !important;
  border-radius: 20px !important;
  box-shadow: 0 4px 12px rgba(6, 24, 26, .16), 0 32px 72px -16px rgba(6, 24, 26, .40) !important;
  animation: btPopSuave .22s var(--ease) both !important;
  max-height: none !important;
  margin: 0 auto;
}
body.v12-dark .modal, body.v12-dark .training-dialog {
  background: #14262a !important;
  border-color: rgba(255, 255, 255, .12) !important;
}
@keyframes btPopSuave {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Detalhe de solicitação tem muitos campos: 460px comprimia tudo. */
.modal { max-width: 620px !important; }
.modal.small { max-width: 400px !important; }

.modal-header {
  position: sticky; top: 0; z-index: 2;
  background: inherit;
  margin: -24px -24px 14px;
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--hairline);
  border-radius: 20px 20px 0 0;
}

/* ---------- 2. sem animação infinita ---------- */

.bt-badge--danger, .bt-nav__badge, .bt-nav__groupcount {
  animation: none !important;
}
.bt-nav__badge, .bt-nav__groupcount {
  box-shadow: 0 0 0 3px rgba(196, 69, 76, .12);
}

/* ---------- 3. entrada discreta ---------- */

#main-content {
  animation: btFadeCurto .2s ease-out both !important;
}
@keyframes btFadeCurto { from { opacity: 0; } to { opacity: 1; } }

.bt-grid--kpi > * { animation: none !important; }
.bt-notice { animation: none !important; }
.bt-nav__items { animation: none !important; }

/* Hover e clique continuam: é o que dá resposta ao toque. Só o que
   acontece sozinho na tela saiu. */

/* ---------- 4. reflexo do vidro só onde ajuda ---------- */

/* O reflexo de topo em toda superfície virou risco claro atravessando
   cartão pequeno. Fica só nos cartões grandes. */
.bt-kpi::before, .apt-choice::before, .bt-bigaction::before { display: none; }

/* overflow:hidden no cartão cortava menu de select e dica flutuante. */
.bt-card { overflow: visible !important; }
.bt-card__body--flush > .bt-tablewrap { border-radius: 0 0 var(--radius) var(--radius); overflow: auto; }

/* ---------- 5. legibilidade sobre vidro ---------- */

.bt-card, .table-card {
  background: var(--surface) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
.bt-kpi, .apt-choice, .apt-meter, .bt-bigaction, .apt-last {
  background: var(--surface) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
/* O vidro fica onde ele tem função: barras que ficam sobre o conteúdo
   enquanto ele rola. */
.bt-topbar, .bt-tabbar, .bt-side { backdrop-filter: var(--blur) !important; }

/* ---------- 6. título da página sem borrão ---------- */

.page-title-row h1, .apt-title, .bt-hello {
  text-shadow: none !important;
  filter: none !important;
}
</style>

// Armazenamento: localStorage quando disponível, memória como reserva
// (arquivo aberto em modo restrito, janela privada ou cota estourada).
const MEM_STORE = {};
let STORAGE_STATE = null;
let STORAGE_MESSAGE = "";
function storageAvailable() {
  if (STORAGE_STATE !== null) return STORAGE_STATE;
  try {
    const probe = "btlocal.__probe__";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    STORAGE_STATE = true;
  } catch (e) {
    STORAGE_STATE = false;
    STORAGE_MESSAGE = "Este navegador bloqueou o armazenamento local para este arquivo. O sistema funciona, mas os dados se perdem ao fechar a aba. Abra o arquivo em uma janela normal (não privada) ou sirva a pasta por HTTP.";
    console.warn("[BIOTROP LOCAL] localStorage indisponível, usando memória:", e);
  }
  return STORAGE_STATE;
}
function readStore(key, fallback) {
  if (!storageAvailable()) {
    return Object.prototype.hasOwnProperty.call(MEM_STORE, key) ? MEM_STORE[key] : fallback;
  }
  try {
    const raw = localStorage.getItem(key);
    if (raw !== null && raw !== undefined && raw !== "") return JSON.parse(raw);
  } catch (e) { console.warn("[BIOTROP LOCAL] leitura falhou:", key, e); }
  return fallback;
}
function writeStore(key, value) {
  if (!storageAvailable()) { MEM_STORE[key] = value; return value; }
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) {
    MEM_STORE[key] = value;
    STORAGE_MESSAGE = "O armazenamento do navegador está cheio e os últimos dados ficaram apenas na memória desta aba. Exporte um backup (F12 e exportLocalBackup()) e libere espaço.";
    console.warn("[BIOTROP LOCAL] gravação falhou:", key, e);
    showStorageWarning();
  }
  return value;
}
function showStorageWarning() {
  if (!STORAGE_MESSAGE) return;
  let box = document.getElementById("biotrop-storage-warning");
  if (!box) {
    box = document.createElement("div");
    box.id = "biotrop-storage-warning";
    box.className = "storage-warning";
    box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,.18);margin:0;";
    document.body.appendChild(box);
  }
  box.textContent = STORAGE_MESSAGE;
}
function resetLocalAccounts() {
  try {
    if (storageAvailable()) {
      localStorage.removeItem(USERS_KEY);
      localStorage.removeItem(PROFILES_KEY);
      localStorage.removeItem(LOCAL_SESSION_KEY);
    }
  } catch (e) {}
  delete MEM_STORE[USERS_KEY];
  delete MEM_STORE[PROFILES_KEY];
  delete MEM_STORE[LOCAL_SESSION_KEY];
  PROFILES = loadProfiles();
  USERS = loadUsers();
}
function ensureAdminAccount() {
  PROFILES = loadProfiles();
  USERS = loadUsers();
  const active = USERS.some(function (u) {
    const p = getProfile(u);
    return p && p.fixo && u.ativo !== false;
  });
  if (active) return false;
  const seed = JSON.parse(JSON.stringify(DEFAULT_USERS[0]));
  const same = USERS.find(function (u) { return String(u.usuario || "").trim().toLowerCase() === seed.usuario; });
  if (same) {
    same.perfilId = "admin";
    same.senha = seed.senha;
    same.ativo = true;
  } else {
    USERS.push(seed);
  }
  saveUsers(USERS);
  console.warn("[BIOTROP LOCAL] nenhum administrador ativo encontrado; acesso padrão restaurado.");
  return true;
}
function seedStore(key, seed) {
  const cur = readStore(key, null);
  if (Array.isArray(cur) && cur.length) return cur;
  const copy = JSON.parse(JSON.stringify(seed));
  writeStore(key, copy);
  return copy;
}
function loadProfiles() {

}
function saveProfiles(profiles) {

}

function buildNavTree(user) {
  const perms = getPerms(user);
  const admin = isAdminUser(user);
  const almox = perms.almoxarifado || {};
  const tree = [{ id: "home", label: "Início", icon: "home", leaf: true }];

  const sciChildren = [];
  if (admin || almox.acesso) sciChildren.push({ id: "almoxarifado", label: "Nova Solicitação", icon: "clipboard", leaf: true });
  if (admin || almox.solicitacoes) sciChildren.push({ id: "almox_solicitacoes", label: "Solicitações", icon: "clipboard", leaf: true });
  if (admin || almox.familias) sciChildren.push({ id: "familias", label: "Família de Itens", icon: "clipboard", leaf: true });

  const scmChildren = [];
  if (admin || almox.scm_acesso) {
    scmChildren.push({ id: "almox_scm_form", label: "Nova Compra", icon: "cart", leaf: true });
    scmChildren.push({ id: "almox_scm_minhas", label: "Minhas SCM", icon: "cart", leaf: true });
  }
  if (admin || almox.scm_gestao) scmChildren.push({ id: "almox_scm_gestao", label: "Gestão de SCM", icon: "cart", leaf: true });
  if (admin || almox.scm_aprovacao) scmChildren.push({ id: "almox_scm_aprovacao", label: "Aprovações SCM", icon: "cart", leaf: true });

  const almoxChildren = [];
  if (sciChildren.length) almoxChildren.push({ id: "grp_sci", label: "SCI", icon: "clipboard", children: sciChildren });
  if (scmChildren.length) almoxChildren.push({ id: "grp_scm", label: "SCM", icon: "cart", children: scmChildren });

  if (almoxChildren.length) tree.push({ id: "grp_almoxarifado", label: "Almoxarifado", icon: "package", children: almoxChildren });

  if (admin || (perms.pcm && perms.pcm.acesso)) tree.push({ id: "pcm", label: "PCM", icon: "clipboard", leaf: true });
  if (admin || (perms.utilidades && perms.utilidades.acesso)) tree.push({ id: "utilidades", label: "Utilidades", icon: "zap", leaf: true });
  if (perms.training || admin) tree.push({ id: "treinamentos", label: "Treinamentos", icon: "bookopen", leaf: true });
  if (admin) tree.push({ id: "admin", label: "Administração", icon: "users", leaf: true });

  return tree;
}

function collectAncestors(nodes, activeId, ancestors) {
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    if (node.leaf) {
      if (node.id === activeId) return true;
    } else if (node.children) {
      if (collectAncestors(node.children, activeId, ancestors)) {
        ancestors.push(node.id);
        return true;
      }
    }
  }
  return false;
}

function renderNavNodes(nodes, level) {
  return nodes.map(function (node) {
    const sizePx = level > 0 ? 16 : 18;
    if (node.leaf) {
      return `<button class="nav-item nav-item-lvl${level}" data-nav="${node.id}">${icon(node.icon, sizePx)}<span>${esc(node.label)}</span></button>`;
    }
    const expanded = !!SIDEBAR_EXPANDED[node.id];
    const childrenHtml = expanded ? '<div class="nav-children">' + renderNavNodes(node.children, level + 1) + '</div>' : '';
    return `<button class="nav-item nav-group nav-item-lvl${level}" data-group="${node.id}">${icon(node.icon, sizePx)}<span>${esc(node.label)}</span><span class="nav-chevron${expanded ? " expanded" : ""}">${icon("chevrondown", 14)}</span></button>${childrenHtml}`;
  }).join("");
}

function renderSidebarNav() {
  const tree = buildNavTree(STATE.currentUser);
  const ancestors = [];
  collectAncestors(tree, STATE.activeArea, ancestors);
  ancestors.forEach(function (id) { SIDEBAR_EXPANDED[id] = true; });
  return renderNavNodes(tree, 0);
}

      const gid = groupBtn.getAttribute("data-group");

      nav.innerHTML = renderSidebarNav();

    el.innerHTML = renderAlmoxarifado("scm_aprovacao"); attachAlmoxarifadoEvents();

}

}

function attachAdminEvents() {
  document.querySelectorAll("[data-admintab]").forEach(function (btn) {
    btn.onclick = function () {
      ADMIN_STATE.tab = this.getAttribute("data-admintab");
      updateAdminTabButtons();
      renderAdminTabContent();

  updateAdminTabButtons();
  renderAdminTabContent();
}

function updateAdminTabButtons() {
  document.querySelectorAll("[data-admintab]").forEach(function (btn) {

}

function renderAdminTabContent() {
  const el = document.getElementById("admin-tab-content");
  if (ADMIN_STATE.tab === "users") { el.innerHTML = renderAdminUsers(); attachAdminUsersEvents(); }

function renderAdminUsers() {
  USERS = loadUsers();

      <td>${esc(u.usuario)}</td>

          <button class="icon-btn" title="Redefinir senha" data-reset="${esc(u.id)}">${icon("key", 15)}</button>

  <div class="page-title-row" style="margin-bottom:18px;">

  </div>
  <div class="table-card">
    <table class="users-table">
      <thead><tr><th>Nome</th><th>E-mail</th><th>Time</th><th>Perfil</th><th style="text-align:right;">Ações</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5">Nenhum usuário cadastrado.</td></tr>'}</tbody>

function attachAdminUsersEvents() {
  const novo = document.getElementById("new-user-btn");
  if (novo) novo.onclick = function () { openUserForm(null); };
  document.querySelectorAll("[data-edit]").forEach(function (btn) {

  });
  document.querySelectorAll("[data-reset]").forEach(function (btn) {
    btn.onclick = function () { openResetForm(this.getAttribute("data-reset")); };
  });

function closeAdminModal() {
  document.getElementById("admin-modal-root").innerHTML = "";
}

function refreshAdminTable() {
  renderAdminTabContent();
}

        <label class="checkbox-row" style="margin-top:6px;"><input type="checkbox" class="perm-check" data-perm="almoxarifado.scm_gestao" ${perm.almoxarifado.scm_gestao ? "checked" : ""}><span>Gerir SCM (Almoxarife)</span></label>
        <label class="checkbox-row" style="margin-top:6px;"><input type="checkbox" class="perm-check" data-perm="almoxarifado.scm_aprovacao" ${perm.almoxarifado.scm_aprovacao ? "checked" : ""}><span>Aprovar SCM (Líder)</span></label>

function attachAdminProfilesEvents() {
  document.querySelectorAll("[data-save-profile]").forEach(function (btn) {
    btn.onclick = function () {
      const profId = this.getAttribute("data-save-profile");
      const row = document.querySelector('[data-profile-row="' + profId + '"]');
      const idx = PROFILES.findIndex(function (p) { return p.id === profId; });
      row.querySelectorAll(".perm-check").forEach(function (chk) {

// ---- Novo / Editar usuário ----
function openUserForm(userId) {
  USERS = loadUsers();
  PROFILES = loadProfiles();
  const editing = USERS.find(function (u) { return String(u.id) === String(userId); }) || null;
  const modalRoot = document.getElementById("admin-modal-root");
  const options = PROFILES.map(function (p) {
    return '<option value="' + esc(p.id) + '"' + (editing && editing.perfilId === p.id ? " selected" : "") + '>' + esc(p.nome) + "</option>";
  }).join("");

  modalRoot.innerHTML = `
  <div class="modal-backdrop" id="user-modal-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${editing ? "Editar usuário" : "Novo usuário"}</h3>
        <button class="icon-btn" id="close-user-modal">${icon("x", 18)}</button>
      </div>
      <label class="field-label">Nome completo</label>
      <input class="modal-input" id="uf-nome" value="${editing ? esc(editing.nome) : ""}" placeholder="Ex.: Maria Silva">
      <label class="field-label" style="margin-top:12px;">E-mail (login)</label>
      <input class="modal-input" id="uf-email" type="email" value="${editing ? esc(editing.usuario) : ""}" placeholder="nome@biotrop.com.br">
      <label class="field-label" style="margin-top:12px;">Senha ${editing ? "(deixe em branco para manter)" : ""}</label>
      <input class="modal-input" id="uf-senha" type="password" placeholder="Mínimo 6 caracteres">
      <label class="field-label" style="margin-top:12px;">Perfil de acesso</label>
      <select class="modal-input" id="uf-perfil">${options}</select>
      <label class="field-label" style="margin-top:12px;">Time</label>
      <input class="modal-input" id="uf-time" value="${editing ? esc(editing.time || "") : ""}" placeholder="Ex.: Elétrica e Automação">
      <label class="field-label" style="margin-top:12px;">E-mail do líder (aprovação de SCM)</label>
      <input class="modal-input" id="uf-lider" value="${editing ? esc(editing.emailLider || "") : ""}" placeholder="lider@biotrop.com.br">
      <label class="checkbox-row" style="margin-top:14px;"><input type="checkbox" id="uf-ativo" ${!editing || editing.ativo !== false ? "checked" : ""}><span>Acesso liberado</span></label>
      <div id="uf-msg"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="cancel-user-form">Cancelar</button>
        <button type="button" class="primary-btn" id="save-user-form">${editing ? "Salvar alterações" : "Cadastrar usuário"}</button>
      </div>
    </div>
  </div>`;

  document.getElementById("user-modal-backdrop").onclick = closeAdminModal;
  document.getElementById("close-user-modal").onclick = closeAdminModal;
  document.getElementById("cancel-user-form").onclick = closeAdminModal;
  document.getElementById("save-user-form").onclick = function () {
    const msg = document.getElementById("uf-msg");
    const nome = document.getElementById("uf-nome").value.trim();
    const email = document.getElementById("uf-email").value.trim().toLowerCase();
    const senha = document.getElementById("uf-senha").value;
    const perfilId = document.getElementById("uf-perfil").value;
    const time = document.getElementById("uf-time").value.trim();
    const lider = document.getElementById("uf-lider").value.trim().toLowerCase();
    const ativo = document.getElementById("uf-ativo").checked;

    if (!nome) { msg.innerHTML = '<div class="login-error">Informe o nome.</div>'; return; }
    if (!email || email.indexOf("@") < 0) { msg.innerHTML = '<div class="login-error">Informe um e-mail valido.</div>'; return; }
    const duplicated = USERS.some(function (u) { return String(u.usuario || "").toLowerCase() === email && (!editing || u.id !== editing.id); });
    if (duplicated) { msg.innerHTML = '<div class="login-error">Ja existe um usuario com este e-mail.</div>'; return; }
    if (!editing && senha.length < 6) { msg.innerHTML = '<div class="login-error">A senha precisa ter pelo menos 6 caracteres.</div>'; return; }
    if (editing && senha && senha.length < 6) { msg.innerHTML = '<div class="login-error">A nova senha precisa ter pelo menos 6 caracteres.</div>'; return; }

    if (editing) {
      editing.nome = nome;
      editing.usuario = email;
      editing.perfilId = perfilId;
      editing.time = time;
      editing.emailLider = lider;
      editing.ativo = ativo;
      if (senha) editing.senha = senha;
      if (STATE.currentUser && STATE.currentUser.id === editing.id) STATE.currentUser = editing;
    } else {
      USERS.push({
        id: "u" + Date.now(),
        nome: nome,
        usuario: email,
        senha: senha,
        perfilId: perfilId,
        time: time,
        emailLider: lider,
        ativo: ativo
      });
    }
    saveUsers(USERS);
    closeAdminModal();
    refreshAdminTable();
  };
}

function openResetForm(userId) {
  USERS = loadUsers();
  const user = USERS.find(function (u) { return String(u.id) === String(userId); });
  if (!user) return;
  const modalRoot = document.getElementById("admin-modal-root");
  modalRoot.innerHTML = `
  <div class="modal-backdrop" id="user-modal-backdrop">
    <div class="modal small" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Redefinir senha</h3>
        <button class="icon-btn" id="close-user-modal">${icon("x", 18)}</button>
      </div>
      <p class="confirm-text">Defina uma nova senha para <b>${esc(user.nome)}</b> (${esc(user.usuario)}).</p>
      <label class="field-label">Nova senha</label>
      <input class="modal-input" id="rs-senha" type="password" placeholder="Mínimo 6 caracteres">
      <div id="rs-msg"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="cancel-user-form">Cancelar</button>
        <button type="button" class="primary-btn" id="save-reset-form">Salvar senha</button>
      </div>
    </div>
  </div>`;

    saveUsers(USERS);
    closeAdminModal();

  };
}

function openDeleteConfirm(userId) {
  USERS = loadUsers();
  const user = USERS.find(function (u) { return String(u.id) === String(userId); });
  if (!user) return;
  if (STATE.currentUser && STATE.currentUser.id === user.id) { alert("Voce nao pode excluir a sua propria conta."); return; }
  const admins = USERS.filter(function (u) { const p = getProfile(u); return p && p.fixo && u.ativo !== false; });
  if (admins.length <= 1 && admins.some(function (u) { return u.id === user.id; })) {
    alert("Mantenha ao menos um administrador ativo no sistema.");
    return;
  }
  const modalRoot = document.getElementById("admin-modal-root");
  modalRoot.innerHTML = `
  <div class="modal-backdrop" id="user-modal-backdrop">
    <div class="modal small" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Excluir usuário</h3>
        <button class="icon-btn" id="close-user-modal">${icon("x", 18)}</button>
      </div>
      <p class="confirm-text">Excluir <b>${esc(user.nome)}</b> (${esc(user.usuario)})? Esta ação não pode ser desfeita.</p>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="cancel-user-form">Cancelar</button>
        <button type="button" class="danger-btn" id="confirm-delete-user">Excluir</button>
      </div>
    </div>
  </div>`;
  document.getElementById("user-modal-backdrop").onclick = closeAdminModal;
  document.getElementById("close-user-modal").onclick = closeAdminModal;
  document.getElementById("cancel-user-form").onclick = closeAdminModal;
  document.getElementById("confirm-delete-user").onclick = function () {
    USERS = USERS.filter(function (u) { return u.id !== user.id; });
    saveUsers(USERS);
    closeAdminModal();
    refreshAdminTable();
  };
}

  });

  document.getElementById("familias-modal-root").innerHTML = "";
}
function refreshFamiliasPage() {
  const el = document.getElementById("main-content");
  el.innerHTML = renderFamiliasPage();
  attachFamiliasPageEvents();
}

function slugifyField(str) {
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "") || ("campo_" + Date.now());
}

function familyFieldRowHtml(label, obrigatorio) {
  return `<div class="fam-field-row">
    <input class="modal-input fam-field-label" placeholder="Nome do campo (ex: Diâmetro)" value="${esc(label || "")}">
    <label class="checkbox-row fam-field-req"><input type="checkbox" ${obrigatorio ? "checked" : ""}><span>Obrigatório</span></label>
    <button type="button" class="icon-btn danger fam-field-remove" title="Remover campo">${icon("x", 15)}</button>
  </div>`;
}

function openFamilyForm(famId) {
  const isNew = !famId;
  const fam = isNew ? { nome: "", campos: [] } : FAMILIES.find(function (f) { return f.id === famId; });

  const fieldsHtml = fam.campos.map(function (c) { return familyFieldRowHtml(c.label, c.obrigatorio); }).join("");

  const modalRoot = document.getElementById("familias-modal-root");
  modalRoot.innerHTML = `
  <div class="modal-backdrop" id="family-modal-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${isNew ? "Nova família" : "Editar família"}</h3>
        <button class="icon-btn" id="close-family-modal">${icon("x", 18)}</button>
      </div>
      <form id="family-form">
        <label class="field-label">Nome da família</label>
        <input class="modal-input" id="fam-nome" value="${esc(fam.nome)}" placeholder="Ex: Rolamento">

        <label class="field-label" style="margin-top:16px;">Campos específicos desta família</label>
        <div id="fam-fields-list" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">${fieldsHtml}</div>
        <button type="button" class="ghost-btn" id="add-fam-field-btn" style="margin-top:10px;">${icon("plus", 15)} Adicionar campo</button>

        <div class="hint-box" style="margin-top:14px;">
          Todo item também terá automaticamente os campos comuns: Link, Observações Gerais, Marcas Homologadas e Foto.
        </div>

        <div id="family-form-error"></div>

        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="cancel-family-form">Cancelar</button>
          <button type="submit" class="primary-btn">${icon("check", 16)} Salvar</button>
        </div>
      </form>
    </div>
  </div>`;

  document.getElementById("family-modal-backdrop").onclick = closeFamiliasModal;
  document.getElementById("close-family-modal").onclick = closeFamiliasModal;
  document.getElementById("cancel-family-form").onclick = closeFamiliasModal;

  function bindRemoveButtons() {
    document.querySelectorAll(".fam-field-remove").forEach(function (btn) {
      btn.onclick = function () { btn.closest(".fam-field-row").remove(); };
    });
  }
  bindRemoveButtons();

  document.getElementById("add-fam-field-btn").onclick = function () {
    const wrap = document.createElement("div");
    wrap.innerHTML = familyFieldRowHtml("", false);
    document.getElementById("fam-fields-list").appendChild(wrap.firstElementChild);
    bindRemoveButtons();
  };

  document.getElementById("family-form").onsubmit = function (e) {
    e.preventDefault();
    const nome = document.getElementById("fam-nome").value.trim();
    const errBox = document.getElementById("family-form-error");
    if (!nome) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha o nome da família.</div>';
      return;
    }
    const rows = document.querySelectorAll("#fam-fields-list .fam-field-row");
    const campos = [];
    const usedIds = {};
    rows.forEach(function (row) {
      const label = row.querySelector(".fam-field-label").value.trim();
      if (!label) return;
      const obrigatorio = row.querySelector(".fam-field-req input").checked;
      let id = slugifyField(label);
      let uniqueId = id, n = 2;
      while (usedIds[uniqueId]) { uniqueId = id + "_" + n; n++; }
      usedIds[uniqueId] = true;
      campos.push({ id: uniqueId, label: label, obrigatorio: obrigatorio });
    });

    if (isNew) {
      const famId2 = slugifyField(nome) + "_" + Date.now();
      FAMILIES.push({ id: famId2, nome: nome, campos: campos });
    } else {
      const idx = FAMILIES.findIndex(function (f) { return f.id === famId; });
      FAMILIES[idx] = Object.assign({}, FAMILIES[idx], { nome: nome, campos: campos });
    }
    saveFamilies(FAMILIES);
    closeFamiliasModal();
    refreshFamiliasPage();
  };
}

let ALMOX_STATE = { tab: "form" };
let SCI_FOTO_DATAURL = null;

function getAlmoxTabs() {
  const user = STATE.currentUser;
  const admin = isAdminUser(user);
  const perms = getPerms(user).almoxarifado || {};
  const tabs = [];
  if (admin || perms.acesso) tabs.push({ id: "form", label: "Nova Solicitação (SCI)" });
  if (admin || perms.solicitacoes) tabs.push({ id: "list", label: "Solicitações (SCI)" });
  if (admin || perms.scm_acesso) {
    tabs.push({ id: "scm_form", label: "Nova Compra (SCM)" });
    tabs.push({ id: "scm_minhas", label: "Minhas SCM" });
  }
  if (admin || perms.scm_gestao) tabs.push({ id: "scm_gestao", label: "Gestão de SCM" });
  if (admin || perms.scm_aprovacao) tabs.push({ id: "scm_aprovacao", label: "Aprovações SCM" });
  return tabs;
}

function renderAlmoxarifado(initialTab) {
  const tabs = getAlmoxTabs();
  const validIds = tabs.map(function (t) { return t.id; });

  const tabsHtml = tabs.length > 1

function attachSciFormEvents() {
  SCI_FOTO_DATAURL = null;
  document.getElementById("sci-familia").onchange = function () {
    const famId = this.value;
    const dynEl = document.getElementById("sci-dynamic-fields");
    const commonEl = document.getElementById("sci-common-fields");
    if (!famId) { dynEl.innerHTML = ""; commonEl.style.display = "none"; return; }
    const fam = FAMILIES.find(function (f) { return f.id === famId; });
    dynEl.innerHTML = `<div class="sci-section-title">Dados de ${esc(fam.nome)}</div>` + fam.campos.map(function (c) {
      return `<label class="field-label" style="margin-top:12px;">${esc(c.label)}${c.obrigatorio ? ' <span style="color:#d64545;">*</span>' : ''}</label>
        <input class="modal-input sci-dyn-field" data-field-id="${c.id}" data-required="${c.obrigatorio ? "1" : "0"}" placeholder="${esc(c.label)}">`;
    }).join("");
    commonEl.style.display = "block";
  };

  document.getElementById("sci-foto").onchange = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (evt) {
      SCI_FOTO_DATAURL = evt.target.result;
      document.getElementById("sci-foto-name").textContent = file.name;
      const preview = document.getElementById("sci-foto-preview");
      preview.src = SCI_FOTO_DATAURL;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
  };

  document.getElementById("sci-submit-btn").onclick = function () {
    const famId = document.getElementById("sci-familia").value;
    const errBox = document.getElementById("sci-form-error");
    if (!famId) {

      return;
    }
    const fam = FAMILIES.find(function (f) { return f.id === famId; });
    const campos = {};
    let missing = [];
    document.querySelectorAll(".sci-dyn-field").forEach(function (input) {
      const val = input.value.trim();
      campos[input.getAttribute("data-field-id")] = val;
      if (input.getAttribute("data-required") === "1" && !val) {
        missing.push(input.getAttribute("placeholder"));
      }
    });
    if (missing.length) {
      errBox.innerHTML = '<div class="login-error" style="margin-top:12px;">Preencha os campos obrigatórios: ' + esc(missing.join(", ")) + '</div>';
      return;
    }

    const novoCodigo = nextSciCode();
    const novaSci = {
      id: "sci-" + Date.now(),
      codigo: novoCodigo,
      familiaId: fam.id,
      familiaNome: fam.nome,
      campos: campos,
      camposDefs: fam.campos,
      link: document.getElementById("sci-link").value.trim(),
      marcas: document.getElementById("sci-marcas").value.trim(),
      observacoes: document.getElementById("sci-obs").value.trim(),
      foto: SCI_FOTO_DATAURL,
      solicitanteId: STATE.currentUser.id,
      solicitanteNome: STATE.currentUser.nome,
      dataCriacao: new Date().toISOString(),
      status: "pendente",
      observacaoAlmoxarife: "",
      numeroProcessoME: "",
    };
    SCI_LIST.unshift(novaSci);
    saveSci(SCI_LIST);

    const el = document.getElementById("almox-tab-content");
    el.innerHTML = '<div class="hint-box" style="background:#e3eff0; color:#003C41; margin-bottom:16px;"><b>Solicitação enviada com sucesso!</b> Código gerado: <b>' + esc(novoCodigo) + '</b>. Guarde esse código para acompanhamento.</div>' + renderSciForm();
    attachSciFormEvents();
  };
}

// ---- Exportação para Excel (CSV) ----
function csvEscape(val) {
  const str = (val === undefined || val === null) ? "" : String(val);
  if (/[;"\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
  return str;
}

// Exporta uma tabela (múltiplos itens), com colunas dinâmicas restritas às famílias presentes na seleção
function exportSciToExcel(idsToExport) {
  const items = SCI_LIST.filter(function (s) { return idsToExport.includes(s.id); });
  if (items.length === 0) return;

  // Uma única solicitação selecionada -> exporta como ficha (Campo / Valor), mais legível
  if (items.length === 1) {
    exportSingleSciAsFicha(items[0]);
    return;
  }

  // Várias solicitações -> monta colunas dinâmicas SOMENTE das famílias presentes na seleção
  const familiaIds = {};
  items.forEach(function (s) { familiaIds[s.familiaId] = true; });
  const dynColumns = [];
  const seenLabels = {};
  FAMILIES.filter(function (fam) { return familiaIds[fam.id]; }).forEach(function (fam) {
    fam.campos.forEach(function (c) {
      const key = c.label.trim().toUpperCase();
      if (!seenLabels[key]) { seenLabels[key] = true; dynColumns.push(c.label); }
    });
  });

  const fixedColumns = ["Código", "Família", "Status", "Solicitante", "Data", "Nº Processo ME", "Observação Almoxarife", "Link", "Marcas Homologadas", "Observações Gerais"];
  const header = fixedColumns.concat(dynColumns);
  const lines = [header.map(csvEscape).join(";")];

  items.forEach(function (s) {
    const row = [
      s.codigo || "",
      s.familiaNome || "",
      statusDef(s.status).label,
      s.solicitanteNome || "",
      formatDate(s.dataCriacao),
      s.numeroProcessoME || "",
      s.observacaoAlmoxarife || "",
      s.link || "",
      s.marcas || "",
      s.observacoes || "",
    ];
    dynColumns.forEach(function (colLabel) {
      const fieldDef = s.camposDefs.find(function (c) { return c.label.trim().toUpperCase() === colLabel.trim().toUpperCase(); });
      row.push(fieldDef ? (s.campos[fieldDef.id] || "") : "");
    });
    lines.push(row.map(csvEscape).join(";"));
  });

  downloadCsv(lines.join("\r\n"), "solicitacoes_sci_" + new Date().toISOString().slice(0, 10) + ".csv");
}

// Exporta uma única solicitação em formato de ficha vertical (Campo / Valor) — mais legível para 1 item
function exportSingleSciAsFicha(s) {
  const lines = [["Campo", "Valor"].map(csvEscape).join(";")];
  function addRow(campo, valor) { lines.push([campo, valor || ""].map(csvEscape).join(";")); }

  addRow("Código", s.codigo);
  addRow("Família", s.familiaNome);
  addRow("Status", statusDef(s.status).label);
  addRow("Solicitante", s.solicitanteNome);
  addRow("Data", formatDate(s.dataCriacao));
  addRow("Nº Processo ME", s.numeroProcessoME);
  addRow("Observação Almoxarife", s.observacaoAlmoxarife);
  s.camposDefs.forEach(function (c) { addRow(c.label, s.campos[c.id]); });
  addRow("Link", s.link);
  addRow("Marcas Homologadas", s.marcas);
  addRow("Observações Gerais", s.observacoes);

  downloadCsv(lines.join("\r\n"), (s.codigo || "sci") + ".csv");
}

function downloadCsv(csvBody, filename) {
  const csvContent = "\uFEFF" + csvBody;
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
