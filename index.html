  if (admin || almox.scm_gestao) out.push({ id: "almox_scm_gestao", ic: "▤", label: "Gestão", dot: c.scmQueue });
  else if (admin || almox.acesso) out.push({ id: "almoxarifado", ic: "▤", label: "Almox." });
  if (admin || almox.scm_aprovacao) out.push({ id: "almox_scm_aprovacao", ic: "✓", label: "Aprovar", dot: c.approvals });
  out.push({ id: "lms_my", ic: "▷", label: "Treinar", dot: c.trainings });

}

/* ====================================================================
   APONTAMENTO DE HORÍMETROS — assistente de 4 passos do V2-MANUT

   Reproduz o fluxo de assets/js/technician-simple-mode-v1.js:
   CAMM → tipo de medição → medidor → leitura, um passo por tela, com
   "Voltar" em todos, caixa da última leitura, observação e foto
   opcionais, e GPS que nunca bloqueia o registro.

   A regra do medidor acumulativo continua valendo: leitura menor que a
   anterior é recusada, porque é erro de digitação ou troca de
   equipamento — as duas pedem decisão humana.

   A sala de controle (painel, histórico, cadastro de medidor) saiu
   daqui e virou a tela do PCM: "Apontamentos de utilidades".
   ==================================================================== */

const APT_STATE = { step: "camm", camm: null, type: null, meterId: null, photo: null, gps: null, msg: "" };

const APT_CAMM_ORDER = ["CAMM 1", "CAMM 2", "CAMM 3", "C. LOG", "CLOG"];
const APT_TYPES = {
  agua: { label: "Água", icon: "💧" },
  gas: { label: "Gás", icon: "🔥" },
  energia: { label: "Energia", icon: "⚡" },
  horimetro: { label: "Horímetro", icon: "⏱️" }
};

function aptTypeLabel(t) { return (APT_TYPES[t] || {}).label || t; }
function aptTypeIcon(t) { return (APT_TYPES[t] || {}).icon || "◉"; }

/** Unidade do medidor: o campo asset guarda CAMM 1/2/3 e C. LOG. */
function aptCammOf(meter) {
  const raw = String(meter.asset || "").trim();
  if (raw) return raw;
  const m = String(meter.name || "").match(/CAMM\s*\d+/i);
  return m ? m[0].toUpperCase().replace(/CAMM\s*/, "CAMM ") : "C. LOG";
}

function aptSortCamm(a, b) {
  const ia = APT_CAMM_ORDER.indexOf(a), ib = APT_CAMM_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
}

function aptMeters() {
  return getUtilityData();
}

function aptHeader(kicker, title, sub, backStep) {
  return `
  <div class="apt-head">
    ${backStep ? '<button class="apt-back" data-apt-back="' + backStep + '">← Voltar</button>' : ""}
    <div class="bt-steplabel">${esc(kicker)}</div>
    <h1 class="apt-title">${esc(title)}</h1>
    <p class="bt-muted" style="margin:4px 0 0">${esc(sub)}</p>
  </div>`;
}

function aptSteps(current) {
  const order = ["camm", "type", "meter", "form"];
  const idx = order.indexOf(current);
  return '<div class="bt-steps">' + order.map(function (s, i) {
    return '<span class="bt-step' + (i <= idx ? " bt-step--on" : "") + '"></span>';
  }).join("") + "</div>";
}

function renderApontar() {
  const meters = aptMeters();
  if (!meters.length) {
    return '<div class="bt-state"><strong>Nenhum medidor cadastrado</strong>O PCM cadastra os medidores em Apontamentos de utilidades.</div>';
  }

  // Confirmação do apontamento anterior, mostrada uma vez.
  const flash = APT_STATE.msg ? '<div style="margin-bottom:18px">' + APT_STATE.msg + "</div>" : "";
  APT_STATE.msg = "";

  /* passo 1 — CAMM */
  if (APT_STATE.step === "camm") {
    const camms = [];
    meters.forEach(function (m) {
      const c = aptCammOf(m);
      if (camms.indexOf(c) < 0) camms.push(c);
    });
    camms.sort(aptSortCamm);
    return flash + aptSteps("camm") + aptHeader("Apontamento", "Escolha o CAMM", "Selecione a unidade onde você está fazendo a leitura.") + `
    <div class="apt-grid">
      ${camms.map(function (c) {
        const n = meters.filter(function (m) { return aptCammOf(m) === c; }).length;
        return `<button class="apt-choice" data-apt-camm="${esc(c)}">
          <strong>${esc(c)}</strong>
          <span>${n} medidor${n === 1 ? "" : "es"} nesta unidade</span>
        </button>`;
      }).join("")}
    </div>`;
  }

  /* passo 2 — tipo de medição */
  if (APT_STATE.step === "type") {
    const inCamm = meters.filter(function (m) { return aptCammOf(m) === APT_STATE.camm; });
    const types = [];
    inCamm.forEach(function (m) { if (types.indexOf(m.type) < 0) types.push(m.type); });
    return flash + aptSteps("type") + aptHeader(APT_STATE.camm, "O que você vai apontar?", "Escolha o tipo de medição.", "camm") + `
    <div class="apt-grid">
      ${types.map(function (t) {
        const n = inCamm.filter(function (m) { return m.type === t; }).length;
        return `<button class="apt-choice" data-apt-type="${esc(t)}">
          <span class="apt-choice__ic">${aptTypeIcon(t)}</span>
          <strong>${esc(aptTypeLabel(t))}</strong>
          <span>${n} medidor${n === 1 ? "" : "es"}</span>
        </button>`;
      }).join("")}
    </div>`;
  }

  /* passo 3 — medidor */
  if (APT_STATE.step === "meter") {
    const list = meters.filter(function (m) {
      return aptCammOf(m) === APT_STATE.camm && m.type === APT_STATE.type;
    });
    const readings = getUtilityReadings();
    return flash + aptSteps("meter") + aptHeader(APT_STATE.camm + " · " + aptTypeLabel(APT_STATE.type),
      "Escolha o medidor", "Selecione somente o equipamento que você está lendo.", "type") + `
    <div class="apt-list">
      ${list.map(function (m) {
        const prev = previousReadingFor(m, readings);
        const has = readings.some(function (r) { return r.meterId === m.id; });
        return `<button class="apt-meter" data-apt-meter="${esc(m.id)}">
          <div class="apt-meter__type">${aptTypeIcon(m.type)} ${esc(aptTypeLabel(m.type))}</div>
          <strong>${esc(m.name)}</strong>
          <small>${esc(m.id)} · ${esc(m.asset || "Local não informado")}</small>
          <div class="apt-meter__last">${has ? "Última: " + prev.toLocaleString("pt-BR") + " " + esc(m.unit || "") : "Sem leitura registrada"}</div>
        </button>`;
      }).join("")}
    </div>`;
  }

  /* passo 4 — leitura */
  const meter = meters.find(function (m) { return m.id === APT_STATE.meterId; });
  if (!meter) { APT_STATE.step = "camm"; return renderApontar(); }
  const readings = getUtilityReadings();
  const previous = previousReadingFor(meter, readings);
  const has = readings.some(function (r) { return r.meterId === meter.id; });
  const photoRequired = meter.type === "horimetro";

  return flash + aptSteps("form") + aptHeader(APT_STATE.camm + " · " + aptTypeLabel(meter.type),
    "Registrar leitura", meter.name, "meter") + `
  <div class="apt-last">
    <small>ÚLTIMA LEITURA</small>
    <strong>${has ? previous.toLocaleString("pt-BR", { maximumFractionDigits: 3 }) + " " + esc(meter.unit || "") : "Sem leitura"}</strong>
    ${has ? '<span class="bt-small bt-muted">A leitura de agora não pode ser menor que esta.</span>' : '<span class="bt-small bt-muted">Esta primeira leitura passa a ser a base do consumo.</span>'}
  </div>

  <form class="apt-form" id="apt-form">
    <div class="bt-field">
      <label>Leitura atual (${esc(meter.unit || "un")}) <span class="req">*</span></label>
      <input id="apt-value" type="number" min="0" step="0.001" inputmode="decimal" placeholder="Digite a leitura" autofocus>
    </div>
    <div class="bt-field">
      <label>Data e hora da leitura</label>
      <input id="apt-at" type="datetime-local" value="${localDateTimeValue()}">
    </div>
    <div class="bt-field">
      <label>Observação <span class="bt-small bt-muted" style="font-weight:500">(opcional)</span></label>
      <textarea id="apt-obs" rows="3" placeholder="Se necessário, informe uma observação"></textarea>
    </div>
    <div class="apt-file">
      <strong>📷 Foto do medidor ${photoRequired ? '<span class="bt-badge bt-badge--warn">obrigatória em horímetro</span>' : '<span class="bt-small bt-muted" style="font-weight:500">(opcional)</span>'}</strong>
      <p class="bt-small bt-muted">${photoRequired
        ? "Horímetro exige evidência fotográfica para conferência posterior."
        : "Você pode anexar a foto, mas ela não é obrigatória."}</p>
      <input id="apt-photo" type="file" accept="image/*" capture="environment">
      <img id="apt-preview" alt="" style="display:none;max-width:220px;margin-top:10px;border-radius:12px">
    </div>
    <div id="apt-status">${APT_STATE.msg}</div>
    <div class="bt-row" style="justify-content:flex-end">
      <button class="bt-btn" type="button" data-apt-back="meter">Cancelar</button>
      <button class="bt-btn bt-btn--primary" type="submit">Salvar apontamento</button>
    </div>
  </form>`;
}

/** GPS nunca bloqueia o registro: se negar ou demorar, segue sem ele. */
function aptPosition() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve({ latitude: null, longitude: null });
    let done = false;
    const finish = function (v) { if (!done) { done = true; resolve(v); } };
    navigator.geolocation.getCurrentPosition(
      function (p) { finish({ latitude: p.coords.latitude, longitude: p.coords.longitude }); },
      function () { finish({ latitude: null, longitude: null }); },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
    );
    setTimeout(function () { finish({ latitude: null, longitude: null }); }, 5200);
  });
}

function attachApontarEvents() {
  document.querySelectorAll("[data-apt-back]").forEach(function (b) {
    b.onclick = function () {
      APT_STATE.step = this.getAttribute("data-apt-back");
      APT_STATE.msg = "";
      navigateTo("utilidades");
    };
  });
  document.querySelectorAll("[data-apt-camm]").forEach(function (b) {
    b.onclick = function () {
      APT_STATE.camm = this.getAttribute("data-apt-camm");
      APT_STATE.step = "type";
      navigateTo("utilidades");
    };
  });
  document.querySelectorAll("[data-apt-type]").forEach(function (b) {
    b.onclick = function () {
      APT_STATE.type = this.getAttribute("data-apt-type");
      APT_STATE.step = "meter";
      navigateTo("utilidades");
    };
  });
  document.querySelectorAll("[data-apt-meter]").forEach(function (b) {
    b.onclick = function () {
      APT_STATE.meterId = this.getAttribute("data-apt-meter");
      APT_STATE.photo = null;
      APT_STATE.msg = "";
      APT_STATE.step = "form";
      navigateTo("utilidades");
    };
  });

  const photo = document.getElementById("apt-photo");
  if (photo) photo.onchange = function (ev) {
    const f = ev.target.files[0];
    APT_STATE.photo = null;
    const img = document.getElementById("apt-preview");
    if (!f) { img.style.display = "none"; return; }
    img.src = URL.createObjectURL(f);
    img.style.display = "block";
    if (f.size <= 500000) {
      const fr = new FileReader();
      fr.onload = function () { APT_STATE.photo = { name: f.name, data: fr.result }; };
      fr.readAsDataURL(f);
    } else {
      APT_STATE.photo = { name: f.name, data: null };
      document.getElementById("apt-status").innerHTML =
        '<div class="bt-notice bt-notice--info"><span class="bt-notice__ic">i</span><div>Foto grande: fica registrada como evidência confirmada, sem guardar a imagem no navegador.</div></div>';
    }
  };

  const form = document.getElementById("apt-form");
  if (!form) return;
  form.onsubmit = async function (ev) {
    ev.preventDefault();
    const status = document.getElementById("apt-status");
    const meters = aptMeters();
    const meter = meters.find(function (m) { return m.id === APT_STATE.meterId; });
    if (!meter) return;

    const raw = document.getElementById("apt-value").value;
    const value = Number(raw);
    const readings = getUtilityReadings();
    const previous = previousReadingFor(meter, readings);
    const has = readings.some(function (r) { return r.meterId === meter.id; });
    const atRaw = document.getElementById("apt-at").value;
    const fail = function (msg) {
      status.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>' + esc(msg) + "</div></div>";
    };

    if (raw === "" || !isFinite(value) || value < 0) return fail("Digite uma leitura válida.");
    if (value < previous) {
      return fail("A leitura não pode ser menor que a anterior (" + previous.toLocaleString("pt-BR") +
        "). Medidor é acumulativo: se o número no visor está menor, avise o PCM — pode ser erro no registro anterior ou troca de equipamento.");
    }
    if (!atRaw) return fail("Informe a data e a hora da leitura.");
    if (meter.type === "horimetro" && !APT_STATE.photo) return fail("A foto do horímetro é obrigatória.");

    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    status.innerHTML = '<div class="bt-notice"><span class="bt-notice__ic">…</span><div>Salvando…</div></div>';

    const pos = await aptPosition();
    const list = getUtilityReadings();
    list.push({
      id: "r" + Date.now(),
      meterId: meter.id,
      meterName: meter.name,
      reading: value,
      consumption: has ? Number((value - previous).toFixed(3)) : null,
      photo: Boolean(APT_STATE.photo),
      photoName: APT_STATE.photo ? APT_STATE.photo.name : "",
      photoData: APT_STATE.photo ? APT_STATE.photo.data : null,
      observation: (document.getElementById("apt-obs").value || "").trim(),
      latitude: pos.latitude,
      longitude: pos.longitude,
      user: (STATE.currentUser && (STATE.currentUser.usuario || STATE.currentUser.nome)) || "local",
      at: new Date(atRaw).toISOString()
    });
    saveUtilityReadings(list);

    APT_STATE.photo = null;
    APT_STATE.step = "camm";
    APT_STATE.msg = '<div class="bt-notice bt-notice--ok"><span class="bt-notice__ic">✓</span><div>Apontamento de <b>' +
      esc(meter.name) + "</b> salvo: " + value.toLocaleString("pt-BR") + " " + esc(meter.unit || "") +
      (has ? " · consumo " + Number(value - previous).toLocaleString("pt-BR") + " " + esc(meter.unit || "") : " · primeira leitura") +
      (pos.latitude == null ? " · sem GPS" : " · com GPS") + ".</div></div>";
    navigateTo("utilidades");
  };
}

/* ---------- roteamento do apontamento ----------

   "Apontar Horímetros" passa a ser o assistente de 4 passos.
   A sala de controle (painel de medidores, histórico e cadastro) vira
   "Apontamentos de utilidades", visível para PCM e administração — é a
   mesma separação do v7, onde o técnico aponta e o PCM acompanha.      */

/** Quem enxerga a sala de controle: PCM, gestor e administração. */
function btPodeVerSalaControle(user) {
  const u = user || STATE.currentUser;
  if (!u) return false;
  if (isAdminUser(u)) return true;
  const perms = getPerms(u);
  if (perms.pcm && perms.pcm.acesso) return true;
  return u.perfilId === "gestor";
}

const _btPrevNavigateApt = navigateTo;
navigateTo = function (areaId) {
  const box = document.getElementById("main-content");
  if (!box) return _btPrevNavigateApt(areaId);

  if (areaId === "utilidades") {
    const perms = getPerms(STATE.currentUser);
    if (!isAdminUser(STATE.currentUser) && !(perms.utilidades && perms.utilidades.acesso)) {
      return _btPrevNavigateApt(areaId);
    }
    STATE.activeArea = "utilidades";
    box.innerHTML = renderApontar();
    attachApontarEvents();
    btSetPageTitle("utilidades");
    btRefreshNav();
    return;
  }

  if (areaId === "utilidades_pcm") {
    STATE.activeArea = "utilidades_pcm";
    // O recorte do menu esconde; a permissão é que barra. Sem esta
    // checagem o técnico chegava à sala de controle pela rota direta.
    box.innerHTML = btPodeVerSalaControle()
      ? renderUtilitiesPage(STATE.currentUser)
      : '<div class="bt-state"><strong>Sem acesso a esta tela</strong>A sala de controle de utilidades é do PCM e da administração. Para registrar leitura, use <b>Apontar Horímetros</b>.</div>';
    if (btPodeVerSalaControle()) attachUtilitiesEvents();
    btSetPageTitle("utilidades_pcm");
    btRefreshNav();
    return;
  }

  return _btPrevNavigateApt(areaId);
};

BT_PAGE_TITLES.utilidades = "Apontar horímetros";
BT_PAGE_TITLES.utilidades_pcm = "Apontamentos de utilidades";

// Acrescenta a tela do PCM ao grupo Utilidades do menu.
const _btPrevNavGroups = btNavGroups;
btNavGroups = function (user) {
  const groups = _btPrevNavGroups(user);
  const u = user || STATE.currentUser;
  if (btIsTechOnly(u)) return groups;
  if (!btPodeVerSalaControle(u)) return groups;
  const grp = groups.find(function (g) { return g.label === "Utilidades"; });
  if (grp) grp.items.push({ id: "utilidades_pcm", icon: "◉", label: "Apontamentos de utilidades" });
  return groups;
};


/* ====================================================================
   PAINÉIS POR PERFIL

   Cada perfil abre no painel do seu trabalho, como nos outros projetos:
   técnico (mantido como estava), PCM, almoxarife, líder e administração.

   Sobre os gráficos: as barras de magnitude usam UMA cor só, porque
   comparam a mesma medida entre categorias — cor por categoria ali não
   informaria nada. As cores de status (pendente, aprovada, reprovada)
   são reservadas e sempre acompanham o texto, nunca só a cor. E consumo
   de água, gás e energia aparece em blocos separados, não num gráfico
   único: m³, Nm³ e kWh não compartilham escala, e sobrepor os três num
   eixo só produziria comparação falsa.

   MTTR, MTBF e disponibilidade ficam de fora por enquanto: o cálculo é
   simples, mas a definição de "falha", "parada" e "tempo de reparo"
   desta planta precisa ser fechada pelo PCM antes de virar número em
   painel — e ainda não existe ordem de serviço no sistema.
   ==================================================================== */

/* ---------- helpers de painel ---------- */

function dashKpi(label, value, opts) {
  const o = opts || {};
  return `<div class="bt-kpi ${o.cls || ""}"${o.nav ? ' data-nav="' + esc(o.nav) + '" role="button" tabindex="0" style="cursor:pointer"' : ""}>

    <div class="bt-kpi__hint">${esc(o.hint || "")}</div>
  </div>`;
}

/** Barras de magnitude: uma cor, nome à esquerda, valor à direita. */
function dashBars(rows, sufixo) {
  if (!rows.length) return '<div class="bt-small bt-muted">Sem dados no período.</div>';
  const max = Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
  return '<div class="bt-bars">' + rows.map(function (r) {
    const pct = Math.max(r.value > 0 ? 3 : 0, Math.round((r.value / max) * 100));
    return `<div class="bt-bar">
      <span class="bt-bar__name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="bt-bar__track"><i class="bt-bar__fill" style="width:${pct}%;display:block"></i></span>
      <span class="bt-bar__val">${r.value}${sufixo ? " " + esc(sufixo) : ""}</span>
    </div>`;
  }).join("") + "</div>";
}

/** Barras de status: cor reservada, sempre com o rótulo escrito. */
function dashStatusBars(rows) {
  if (!rows.length) return '<div class="bt-small bt-muted">Nenhum registro.</div>';
  const max = Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
  return '<div class="bt-bars">' + rows.map(function (r) {
    const pct = Math.max(r.value > 0 ? 3 : 0, Math.round((r.value / max) * 100));
    return `<div class="bt-bar">
      <span class="bt-bar__name" title="${esc(r.name)}">${esc(r.name)}</span>
      <span class="bt-bar__track"><i class="bt-bar__fill" style="width:${pct}%;display:block;background:${r.color || "var(--primary)"}"></i></span>
      <span class="bt-bar__val">${r.value}</span>
    </div>`;
  }).join("") + "</div>";
}

function dashDays(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
}

function dashSince(days) {
  return Date.now() - days * 864e5;
}

/* ---------- recortes de dados ---------- */

function dashUtilities(days) {
  const meters = getUtilityData();
  const readings = getUtilityReadings();
  const limite = dashSince(days || 30);
  const recentes = readings.filter(function (r) { return new Date(r.at).getTime() >= limite; });

  const porCamm = {};
  recentes.forEach(function (r) {
    const m = meters.find(function (x) { return x.id === r.meterId; });
    const c = m ? aptCammOf(m) : "Sem unidade";
    porCamm[c] = (porCamm[c] || 0) + 1;
  });

  const semLeitura = meters.map(function (m) {
    const rs = readings.filter(function (r) { return r.meterId === m.id; })
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
    return { meter: m, last: rs[0] || null, dias: rs[0] ? dashDays(rs[0].at) : null };
  }).filter(function (x) { return x.dias === null || x.dias >= 30; });

  const consumo = { agua: 0, gas: 0, energia: 0, horimetro: 0 };
  recentes.forEach(function (r) {
    const m = meters.find(function (x) { return x.id === r.meterId; });
    if (m && r.consumption != null) consumo[m.type] = (consumo[m.type] || 0) + Number(r.consumption);
  });

  return {
    meters: meters, readings: readings, recentes: recentes,
    porCamm: Object.keys(porCamm).map(function (k) { return { name: k, value: porCamm[k] }; })
      .sort(function (a, b) { return b.value - a.value; }),
    semLeitura: semLeitura,
    semFoto: recentes.filter(function (r) { return !r.photo; }).length,
    consumo: consumo
  };
}

function dashSciByStatus() {
  const list = loadSci();
  return SCI_STATUS_COLORS.map(function (s) {
    return { name: s.label, value: list.filter(function (x) { return x.status === s.id; }).length, color: s.color };
  }).filter(function (r) { return r.value > 0; });
}

function dashTrainingSummary() {

  }, 0);
  return { rows: rows, total: total, ok: ok, atraso: atraso, pct: total ? Math.round((ok / total) * 100) : 100 };

function dashStorageSize() {
  let total = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("btlocal.") === 0) total += (localStorage.getItem(k) || "").length;
    }
  } catch (e) { return "tamanho indisponível"; }
  const kb = total / 1024;
  return kb < 1024 ? kb.toFixed(1) + " KB" : (kb / 1024).toFixed(1) + " MB";
}

function renderRoleHome() {

    };
  });
}

/* ---------- perfis: acrescenta PCM e recorta o líder ----------

   O recorte de cada perfil vive na PERMISSÃO, não numa segunda regra de
   menu: assim a tela e a rota concordam sozinhas, e o que a
   administração mudar em Perfis de Acesso passa a valer na hora.

   Líder e almoxarife ficam com almoxarifado e treinamento; utilidades e
   PCM saem. Feito uma vez só, e só se o perfil ainda estiver como veio
   de fábrica — permissão editada à mão na tela não é sobrescrita.      */

const DASH_MIGR_KEY = "btlocal.profiles_migr_v2";

function dashMigrateProfiles() {
  dashEnsureProfiles();
  let done = false;
  try { done = localStorage.getItem(DASH_MIGR_KEY) === "1"; } catch (e) { done = false; }
  if (done) return;

  const lider = PROFILES.find(function (p) { return p.id === "lider"; });
  if (lider && lider.permissoes) {
    const p = lider.permissoes;
    const comoDeFabrica = p.pcm && p.pcm.acesso === true && p.utilidades && p.utilidades.acesso === true;
    if (comoDeFabrica) {
      p.pcm.acesso = false;
      p.utilidades.acesso = false;
      saveProfiles(PROFILES);
    }
  }
  try { localStorage.setItem(DASH_MIGR_KEY, "1"); } catch (e) {}
}

// O líder nasce sem utilidades e sem PCM nas instalações novas.
(function () {
  const l = DEFAULT_PROFILES.find(function (p) { return p.id === "lider"; });
  if (l) { l.permissoes.pcm.acesso = false; l.permissoes.utilidades.acesso = false; }
})();

const BT_NAV = { rail: false, open: {}, filter: "" };

(function () {
  const saved = readStore(BT_NAV_KEY, null);
  if (saved && typeof saved === "object") {
    BT_NAV.rail = Boolean(saved.rail);
    BT_NAV.open = (saved.open && typeof saved.open === "object") ? saved.open : {};
  }
})();

function btNavSave() {
  writeStore(BT_NAV_KEY, { rail: BT_NAV.rail, open: BT_NAV.open });
}

function btGroupOf(areaId) {
  const grupos = btNavGroups();
  for (let i = 0; i < grupos.length; i++) {
    if (grupos[i].items.some(function (it) { return it.id === areaId; })) return grupos[i].label;
  }
  return null;
}

/**
 * Quais grupos abrem sozinhos.
 *
 * Abrir só o grupo da tela atual deixava o menu com um item na tela e
 * um monte de cabeçalho fechado — trocava rolagem por vazio. Então: o
 * grupo atual sempre abre, e depois os de cima para baixo vão abrindo
 * enquanto couberem no orçamento de itens. O que o usuário abrir ou
 * fechar na mão é gravado e tem preferência sobre isso.
 */
const BT_NAV_BUDGET = 8;

function btDefaultOpenMap(grupos, atual) {
  const map = {};
  let usados = 0;
  grupos.forEach(function (g) {
    if (g.label === atual) { map[g.label] = true; usados += g.items.length; }
  });
  grupos.forEach(function (g) {
    if (map[g.label]) return;
    if (usados + g.items.length <= BT_NAV_BUDGET) { map[g.label] = true; usados += g.items.length; }
    else map[g.label] = false;
  });
  return map;
}

function btGroupIsOpen(grupo, total, atual, padroes) {
  if (Object.prototype.hasOwnProperty.call(BT_NAV.open, grupo.label)) return BT_NAV.open[grupo.label];
  if (total <= 2) return true;
  const map = padroes || btDefaultOpenMap(btNavGroups(), atual);
  return Boolean(map[grupo.label]);
}

/** Busca sem acento: "utilidade" acha "Utilidades", "apontar" acha "Apontar". */
function btNormalize(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function btRenderNav() {
  const cur = STATE.activeArea;
  const grupos = btNavGroups();
  const atual = btGroupOf(cur);
  const filtro = btNormalize(BT_NAV.filter).trim();

  // Buscando: lista plana com os destinos que casam, sem cabeçalho.
  if (filtro && !BT_NAV.rail) {
    const hits = [];
    grupos.forEach(function (g) {
      g.items.forEach(function (it) {
        if (btNormalize(it.label).indexOf(filtro) >= 0 || btNormalize(g.label).indexOf(filtro) >= 0) {
          hits.push({ grupo: g.label, item: it });
        }
      });
    });
    if (!hits.length) {
      return '<div class="bt-nav__empty">Nenhum item do menu com “' + esc(BT_NAV.filter) + "”.</div>";
    }
    return hits.map(function (h) {
      return '<button type="button" class="bt-nav__item bt-nav__hit' + (h.item.id === cur ? " is-current" : "") +
        '" data-nav="' + esc(h.item.id) + '" data-label="' + esc(h.item.label) + '">' +
        '<span class="bt-nav__icon" aria-hidden="true">' + h.item.icon + "</span>" +
        '<span class="bt-nav__label">' + esc(h.item.label) +
        '<span style="display:block;font-size:10px;opacity:.55;font-weight:600">' + esc(h.grupo) + "</span></span>" +
        (h.item.badge ? '<span class="bt-nav__badge">' + h.item.badge + "</span>" : "") +
        "</button>";
    }).join("");
  }

  const padroes = btDefaultOpenMap(grupos, atual);
  return grupos.map(function (g, gi) {
    const aberto = BT_NAV.rail ? true : btGroupIsOpen(g, grupos.length, atual, padroes);
    const pend = g.items.reduce(function (s, it) { return s + (Number(it.badge) || 0); }, 0);
    const temAtual = g.items.some(function (it) { return it.id === cur; });

    const head = `<button type="button" class="bt-nav__grouphead" data-navgroup="${esc(g.label)}"
      aria-expanded="${aberto}" title="${esc(g.label)}">
      <span class="bt-nav__chev" aria-hidden="true">▸</span>
      <span class="lbl">${esc(g.label)}</span>
      ${!aberto && pend ? '<span class="bt-nav__groupcount">' + pend + "</span>" : ""}
      ${!aberto && !pend && temAtual ? '<span class="bt-nav__groupdot"></span>' : ""}
    </button>`;

    const items = `<div class="bt-nav__items" id="btnavgrp-${gi}"${aberto ? "" : " hidden"}>` +
      g.items.map(function (it) {
        return '<button type="button" class="bt-nav__item' + (it.id === cur ? " is-current" : "") +
          '" data-nav="' + esc(it.id) + '" data-label="' + esc(it.label) + '" title="' + esc(it.label) + '">' +
          '<span class="bt-nav__icon" aria-hidden="true">' + it.icon + "</span>" +
          '<span class="bt-nav__label">' + esc(it.label) + "</span>" +
          (it.badge ? '<span class="bt-nav__badge">' + it.badge + "</span>" : "") +
          "</button>";
      }).join("") + "</div>";

    return head + items;
  }).join("");
}

function btWireNav() {
  document.querySelectorAll("#bt-nav [data-nav], #bt-tabbar [data-nav]").forEach(function (btn) {
    btn.onclick = function () {
      btCloseSide();
      navigateTo(this.getAttribute("data-nav"));
    };
  });

  document.querySelectorAll("#bt-nav [data-navgroup]").forEach(function (head) {
    head.onclick = function () {
      const label = this.getAttribute("data-navgroup");
      const grupos = btNavGroups();
      const g = grupos.find(function (x) { return x.label === label; });
      const aberto = btGroupIsOpen(g, grupos.length, btGroupOf(STATE.activeArea));
      BT_NAV.open[label] = !aberto;
      btNavSave();
      btRefreshNav();
    };
  });

  const busca = document.getElementById("bt-nav-search");
  if (busca) {
    busca.oninput = function () {
      BT_NAV.filter = this.value;
      const nav = document.getElementById("bt-nav");
      if (nav) nav.innerHTML = btRenderNav();
      btWireNav();
      const limpar = document.getElementById("bt-nav-clear");
      if (BT_NAV.filter && !limpar) btRefreshSearchClear(true);
      if (!BT_NAV.filter && limpar) btRefreshSearchClear(false);
    };
    busca.onkeydown = function (ev) {
      if (ev.key === "Escape") { BT_NAV.filter = ""; this.value = ""; btRefreshNav(); return; }
      if (ev.key === "Enter") {
        const first = document.querySelector("#bt-nav [data-nav]");
        if (first) { BT_NAV.filter = ""; navigateTo(first.getAttribute("data-nav")); }
      }
    };
  }
  const limpar = document.getElementById("bt-nav-clear");
  if (limpar) limpar.onclick = function () { BT_NAV.filter = ""; btRefreshNav(); };
}

/** Mostra ou esconde o × da busca sem redesenhar o campo (perderia o foco). */
function btRefreshSearchClear(mostrar) {
  const wrap = document.querySelector(".bt-navsearch");
  if (!wrap) return;
  const atual = document.getElementById("bt-nav-clear");
  if (mostrar && !atual) {
    const b = document.createElement("button");
    b.className = "bt-navsearch__clear";
    b.id = "bt-nav-clear";
    b.setAttribute("aria-label", "Limpar busca");
    b.innerHTML = "&times;";
    b.onclick = function () { BT_NAV.filter = ""; btRefreshNav(); };
    wrap.appendChild(b);
  } else if (!mostrar && atual) {
    atual.remove();
  }
}

function btRefreshNav() {
  const nav = document.getElementById("bt-nav");
  if (nav) nav.innerHTML = btRenderNav();
  const tab = document.getElementById("bt-tabbar");
  if (tab) tab.innerHTML = btRenderTabbar();
  const busca = document.getElementById("bt-nav-search");
  if (busca && busca.value !== BT_NAV.filter) busca.value = BT_NAV.filter;
  btRefreshSearchClear(Boolean(BT_NAV.filter));
  btWireNav();
}

function attachShellEvents() {
  btWireNav();

  const rail = document.getElementById("bt-rail-toggle");
  if (rail) rail.onclick = function () {
    BT_NAV.rail = !BT_NAV.rail;
    BT_NAV.filter = "";
    btNavSave();
    document.body.classList.toggle("bt-rail", BT_NAV.rail);
    this.textContent = BT_NAV.rail ? "»" : "«";
    btRefreshNav();
  };

  const burger = document.getElementById("bt-burger");
  if (burger) burger.onclick = function () {
    const side = document.getElementById("bt-side");
    if (!side) return;
    const open = !side.classList.contains("is-open");
    side.classList.toggle("is-open", open);
    const old = document.querySelector(".bt-scrim");
    if (old) old.remove();
    if (open) {
      const scrim = document.createElement("div");
      scrim.className = "bt-scrim";
      scrim.onclick = btCloseSide;
      document.body.appendChild(scrim);
    }
  };

  installV12Controls();
}


/* ====================================================================
   ALMOXARIFADO — ajustes da reunião com o Plinio

   1. Status da SCI conforme a lista do Forms, com o laço de volta para
      o solicitante: "Aguardando revisão do solicitante".
   2. "Nº do Processo (ME)" virou "Número da solicitação de cadastro" —
      o ME pertence ao fluxo de compra, não ao de cadastro.
   3. Campo "Código do item", obrigatório para fechar em Cadastrado: é
      o código que nasce do cadastro, e não se confunde com o número da
      solicitação.
   4. Menu do almoxarifado unificado num grupo só.
   5. "Minhas solicitações" para o técnico, com SCI e SCM juntas e o
      botão de corrigir e reenviar quando a solicitação volta para ele.
   ==================================================================== */

/* ---------- status novos ---------- */

/**
 * Status da SCI — lista fechada na transcrição da reunião.
 *
 * O Plinio abriu a lista e ditou: Aberto (inicial), Pendente de
 * Aprovação (a do líder), Aguardando Revisão do Solicitante, Aguardando
 * Cadastro de Item, Em Compra e Rejeitada. "Cadastrado" fica como o
 * estado final, porque é nele que o código do item passa a ser exigido.
 *
 * Diferença em relação ao que eu havia implementado antes: a solicitação
 * nasce como ABERTO, não como pendente de aprovação — o pendente de
 * aprovação é uma etapa, não a entrada. E "Reprovada" virou "Rejeitada",
 * que é a palavra usada no processo.
 */
const SCI_STATUS_V2 = [
  { id: "aberto", label: "Aberto", bg: "#eef2f0", color: "#4d635a", tom: "neutro" },
  { id: "pendente_aprovacao", label: "Pendente de Aprovação", bg: "#fff4e5", color: "#8a5a00", tom: "warn" },
  { id: "revisao_solicitante", label: "Aguardando Revisão do Solicitante", bg: "#fdf3e2", color: "#8a5a00", tom: "warn" },
  { id: "aguardando_cadastro", label: "Aguardando Cadastro de Item", bg: "#e3eff0", color: "#003C41", tom: "info" },
  { id: "em_compra", label: "Em Compra", bg: "#e8f0fe", color: "#1a4f8f", tom: "info" },
  { id: "cadastrado", label: "Cadastrado", bg: "#e6f7ee", color: "#0f7a44", tom: "ok" },
  { id: "rejeitada", label: "Rejeitada", bg: "#fdecec", color: "#b3261e", tom: "danger" }
];

// De onde vem cada status antigo. Sem isso as solicitações já gravadas
// no navegador apareceriam sem rótulo depois da troca.
const SCI_STATUS_MAP = {
  // nomes do arquivo original
  pendente: "aberto",
  aprovado: "em_compra",
  solicitado_cadastro: "aguardando_cadastro",
  recusado: "rejeitada",
  // nomes da minha versão anterior
  reprovada: "rejeitada",
  // nomes atuais, que passam direto
  aberto: "aberto",
  pendente_aprovacao: "pendente_aprovacao",
  revisao_solicitante: "revisao_solicitante",
  aguardando_cadastro: "aguardando_cadastro",
  em_compra: "em_compra",
  cadastrado: "cadastrado",
  rejeitada: "rejeitada"
};

/** Status com que toda solicitação nasce. */
const SCI_STATUS_INICIAL = "aberto";

const SCI_MIGR_KEY = "btlocal.sci_migr_v4";

function sciMigrate() {
  SCI_LIST = loadSci();
  let changed = false;
  SCI_LIST.forEach(function (s) {
    const novo = SCI_STATUS_MAP[s.status] || SCI_STATUS_INICIAL;
    if (s.status !== novo) { s.status = novo; changed = true; }
    // O antigo "Nº do processo (ME)" era usado como número da solicitação
    // de cadastro; passa a se chamar pelo que é.
    if (s.numeroSolicitacaoCadastro === undefined) {
      s.numeroSolicitacaoCadastro = s.numeroProcessoME || "";
      changed = true;
    }
    if (s.codigoItem === undefined) { s.codigoItem = ""; changed = true; }
    if (s.historico === undefined) { s.historico = []; changed = true; }
  });
  if (changed) saveSci(SCI_LIST);
  try { localStorage.setItem(SCI_MIGR_KEY, "1"); } catch (e) {}
}

// Substitui as definições antigas para toda a interface já existente.
SCI_STATUS_DEFS.length = 0;
SCI_STATUS_V2.forEach(function (d) { SCI_STATUS_DEFS.push(d); });

/**
 * Normaliza o status na GRAVAÇÃO, não só na migração de boot.
 *
 * O formulário original grava status: "pendente" fixo no código. Migrar
 * só no carregamento deixava a solicitação recém-criada com o rótulo
 * antigo até o próximo F5 — e a fila do almoxarifado não a enxergava.
 * Interceptar a gravação cobre esse caminho e qualquer outro.
 */
(function () {
  const anterior = saveSci;
  saveSci = function (list) {
    (list || []).forEach(function (s) {
      const novo = SCI_STATUS_MAP[s.status];
      if (novo && s.status !== novo) s.status = novo;
      if (!novo) s.status = SCI_STATUS_INICIAL;
      if (s.numeroSolicitacaoCadastro === undefined) s.numeroSolicitacaoCadastro = s.numeroProcessoME || "";
      if (s.codigoItem === undefined) s.codigoItem = "";
      if (s.historico === undefined) s.historico = [];
    });
    return anterior(list);
  };
})();

function sciStatusTom(status) {
  const d = SCI_STATUS_DEFS.find(function (x) { return x.id === status; });
  return d ? d.tom : "warn";
}

function sciBadge(status) {
  const tom = sciStatusTom(status);
  const d = statusDef(status);
  const cls = tom === "ok" ? "bt-badge--ok" : tom === "danger" ? "bt-badge--danger"
    : tom === "info" ? "bt-badge--info" : tom === "neutro" ? "" : "bt-badge--warn";
  return '<span class="bt-badge ' + cls + '">' + esc(d.label) + "</span>";
}

/* ---------- gravação de status com as regras novas ---------- */

function setSciStatus(sciId, status, numeroSolicitacao, observacaoAlmoxarife, codigoItem) {
  const idx = SCI_LIST.findIndex(function (x) { return x.id === sciId; });
  if (idx < 0) return;
  const s = SCI_LIST[idx];

  // Fechar em Cadastrado sem o código do item deixaria a solicitação
  // concluída sem o dado que é a razão dela existir.
  if (status === "cadastrado" && !String(codigoItem || "").trim()) {
    const box = document.getElementById("sci-status-error");
    if (box) {
      box.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe o <b>código do item</b> para concluir como Cadastrado.</div></div>';
    } else {
      alert("Informe o código do item para concluir como Cadastrado.");
    }
    return;
  }
  if (status === "revisao_solicitante" && !String(observacaoAlmoxarife || "").trim()) {
    const box = document.getElementById("sci-status-error");
    if (box) {
      box.innerHTML = '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Devolver para revisão exige dizer o que o solicitante precisa corrigir. Escreva na observação do almoxarife.</div></div>';
    }
    return;
  }

  const anterior = s.status;
  s.status = status;
  s.numeroSolicitacaoCadastro = String(numeroSolicitacao || "").trim();
  s.numeroProcessoME = s.numeroSolicitacaoCadastro; // compatibilidade com o que já exporta
  s.observacaoAlmoxarife = String(observacaoAlmoxarife || "").trim();
  s.codigoItem = String(codigoItem || "").trim();
  s.historico = s.historico || [];
  s.historico.push({
    de: anterior, para: status, em: new Date().toISOString(),
    por: (STATE.currentUser && STATE.currentUser.nome) || "—",
    nota: s.observacaoAlmoxarife
  });

  // Aviso ao solicitante: só neste status, como o Plinio pediu. Aqui não
  // há servidor de e-mail, então fica registrado e aparece em "Minhas
  // solicitações" — o disparo real entra junto com o backend.
  if (status === "revisao_solicitante") {
    s.avisoSolicitante = { em: new Date().toISOString(), lido: false, motivo: s.observacaoAlmoxarife };
  } else if (status !== anterior) {
    s.avisoSolicitante = null;
  }

  saveSci(SCI_LIST);
  closeSciModal();
  if (typeof renderAlmoxTabContent === "function") renderAlmoxTabContent();
}

/* ---------- modal de atendimento, com os campos novos ---------- */

const _sciPrevOpenDetail = openSciDetail;
openSciDetail = function (sciId) {
  _sciPrevOpenDetail(sciId);
  const s = SCI_LIST.find(function (x) { return x.id === sciId; });
  if (!s) return;

  const label = document.querySelector('#almox-modal-root label[for], #almox-modal-root .field-label');
  // Renomeia o rótulo do campo e acrescenta o código do item logo abaixo.
  const labels = document.querySelectorAll("#almox-modal-root .field-label");
  labels.forEach(function (l) {
    if (l.textContent.indexOf("Processo (ME)") >= 0) l.textContent = "Número da solicitação de cadastro";
  });
  const campoNum = document.getElementById("sci-processo-me");
  if (campoNum) {
    campoNum.value = s.numeroSolicitacaoCadastro || "";
    campoNum.placeholder = "Gerado na plataforma 4MDG";
    const hint = document.createElement("div");
    hint.className = "bt-field__hint";
    hint.textContent = "É o número da solicitação de cadastro, não o processo ME de compra.";
    campoNum.insertAdjacentElement("afterend", hint);

    const wrap = document.createElement("div");
    wrap.innerHTML = '<label class="field-label" style="margin-top:14px;">Código do item' +
      ' <span class="bt-small bt-muted" style="font-weight:500">(obrigatório para concluir como Cadastrado)</span></label>' +
      '<input class="modal-input" id="sci-codigo-item" value="' + esc(s.codigoItem || "") + '" placeholder="Código gerado no cadastro">';
    hint.insertAdjacentElement("afterend", wrap);
  }

  const sel = document.getElementById("sci-status-select");
  if (sel) {
    const erro = document.createElement("div");
    erro.id = "sci-status-error";
    sel.insertAdjacentElement("afterend", erro);
    sel.onchange = function () {
      const box = document.getElementById("sci-status-error");
      if (this.value === "revisao_solicitante") {
        box.innerHTML = '<div class="bt-notice bt-notice--info"><span class="bt-notice__ic">i</span><div>O solicitante será avisado desta pendência e poderá corrigir e reenviar em <b>Minhas solicitações</b>.</div></div>';
      } else if (this.value === "cadastrado") {
        box.innerHTML = '<div class="bt-notice bt-notice--info"><span class="bt-notice__ic">i</span><div>Preencha o <b>código do item</b> para concluir.</div></div>';
      } else { box.innerHTML = ""; }
    };
  }

  if (s.historico && s.historico.length) {
    const acoes = document.querySelector("#almox-modal-root .modal-actions");
    if (acoes) {
      const h = document.createElement("div");
      h.innerHTML = '<div class="sci-section-title" style="margin-top:16px;">Histórico</div>' +
        '<div class="bt-timeline">' + s.historico.slice().reverse().map(function (x) {
          return '<div class="bt-tl"><span class="bt-tl__dot"></span><div class="bt-tl__body">' +
            esc(statusDef(x.para).label) + (x.nota ? " — " + esc(x.nota) : "") +
            '<div class="bt-tl__when">' + formatDate(x.em) + " · " + esc(x.por) + "</div></div></div>";
        }).join("") + "</div>";
      acoes.insertAdjacentElement("beforebegin", h);
    }
  }

  const btn = document.getElementById("sci-save-status-btn");
  if (btn) btn.onclick = function () {
    setSciStatus(

/* ====================================================================
   UTILIDADES — reorganização pedida na reunião

   O painel saiu da primeira versão. No lugar, a mesma organização por
   abas que o almoxarifado usa:

     Novo apontamento · Apontamentos · Gestão de medidores

   "Apontar horímetros" virou "Apontar consumo": o processo cobre água,
   gás, energia e horímetro, não só horímetro de máquina.

   Apontamentos é lista mestre — uma linha por registro, com CAMM, tipo,
   medidor, leitura, consumo e observação, e filtros para o PCM
   analisar. A verificação de desvio compara cada leitura com a anterior
   e a seguinte do mesmo medidor e sinaliza o que merece o olho humano.

   Gestão de medidores permite acrescentar e inativar. Medidor inativo
   deixa de aparecer para quem aponta, sem apagar o histórico dele.
   ==================================================================== */

const UTIL_TABS_STATE = { tab: "novo" };
const UTIL_FILTER = { camm: "", tipo: "", meter: "", de: "", ate: "", texto: "", soDesvio: false };

/** Só os ativos aparecem para quem aponta. */
function utilMetersAtivos() {
  return getUtilityData().filter(function (m) { return m.ativo !== false; });
}

/**
 * Desvio: o que precisa de decisão humana.
 *
 * - consumo negativo: leitura menor que a anterior (só entra por dado
 *   antigo ou troca física do medidor);
 * - salto: consumo acima de 3x a média do medidor;
 * - parado: consumo zero com leitura anterior existente;
 * - sem evidência: leitura de horímetro sem foto.
 */
function utilAnalisar(readings, meters) {
  const porMedidor = {};
  readings.forEach(function (r) {
    (porMedidor[r.meterId] = porMedidor[r.meterId] || []).push(r);
  });
  Object.keys(porMedidor).forEach(function (k) {
    porMedidor[k].sort(function (a, b) { return new Date(a.at) - new Date(b.at); });
  });

  // Mediana, não média: com média o próprio salto puxa a referência para
  // cima e se esconde. Um consumo de 790 entre 10 e 10 tem mediana 10 e
  // salta à vista; com média (400) ele passaria por normal.
  const mediana = function (valores) {
    if (!valores.length) return 0;
    const v = valores.slice().sort(function (a, b) { return a - b; });
    const meio = Math.floor(v.length / 2);
    return v.length % 2 ? v[meio] : (v[meio - 1] + v[meio]) / 2;
  };
  const referencia = {};
  Object.keys(porMedidor).forEach(function (k) {
    referencia[k] = {};
    const serie = porMedidor[k];
    serie.forEach(function (atual) {
      // Referência de cada leitura = mediana das OUTRAS leituras do medidor.
      const outros = serie.filter(function (x) { return x !== atual; })
        .map(function (x) { return Number(x.consumption); })
        .filter(function (v) { return isFinite(v) && v > 0; });
      referencia[k][atual.id] = mediana(outros);
    });
  });

  return readings.map(function (r) {
    const m = meters.find(function (x) { return x.id === r.meterId; }) || {};
    const serie = porMedidor[r.meterId] || [];
    const i = serie.indexOf(r);
    const anterior = i > 0 ? serie[i - 1] : null;
    const seguinte = i >= 0 && i < serie.length - 1 ? serie[i + 1] : null;
    const avisos = [];

    if (r.consumption != null && Number(r.consumption) < 0) {
      avisos.push({ tom: "danger", txt: "consumo negativo" });
    }
    if (seguinte && Number(seguinte.reading) < Number(r.reading)) {
      avisos.push({ tom: "danger", txt: "leitura seguinte menor" });
    }
    const ref = (referencia[r.meterId] || {})[r.id] || 0;
    if (ref > 0 && r.consumption != null && Number(r.consumption) > ref * 3) {
      avisos.push({ tom: "warn", txt: "salto de consumo" });
    }
    if (anterior && r.consumption != null && Number(r.consumption) === 0) {
      avisos.push({ tom: "warn", txt: "consumo zero" });
    }
    if (m.type === "horimetro" && !r.photo) {
      avisos.push({ tom: "warn", txt: "sem foto" });
    }
    return { r: r, m: m, anterior: anterior, avisos: avisos, referencia: ref };
  });
}

/* ---------- aba: lista mestre de apontamentos ---------- */

function renderUtilLista() {
  const meters = getUtilityData();
  const todas = getUtilityReadings();
  const analise = utilAnalisar(todas, meters);

  const camms = [];
  meters.forEach(function (m) { const c = aptCammOf(m); if (camms.indexOf(c) < 0) camms.push(c); });
  camms.sort(aptSortCamm);
  const tipos = Object.keys(APT_TYPES);

  const f = UTIL_FILTER;
  const filtradas = analise.filter(function (x) {
    if (f.camm && aptCammOf(x.m) !== f.camm) return false;
    if (f.tipo && x.m.type !== f.tipo) return false;
    if (f.meter && x.r.meterId !== f.meter) return false;
    if (f.de && new Date(x.r.at) < new Date(f.de + "T00:00")) return false;
    if (f.ate && new Date(x.r.at) > new Date(f.ate + "T23:59")) return false;
    if (f.soDesvio && !x.avisos.length) return false;
    if (f.texto) {
      const alvo = (x.m.name + " " + (x.r.observation || "") + " " + (x.r.user || "") + " " + x.r.meterId).toLowerCase();
      if (alvo.indexOf(f.texto.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return new Date(b.r.at) - new Date(a.r.at); });

  const comDesvio = analise.filter(function (x) { return x.avisos.length; }).length;

  const linhas = filtradas.map(function (x) {
    const unidade = esc(x.m.unit || "");
    return `<tr${x.avisos.length ? ' style="background:rgba(185,119,14,.06)"' : ""}>
      <td>${new Date(x.r.at).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" })}</td>

      <td>${aptTypeIcon(x.m.type)} ${esc(aptTypeLabel(x.m.type))}</td>

      <td class="bt-num"><b>${Number(x.r.reading).toLocaleString("pt-BR")}</b> ${unidade}</td>
      <td class="bt-num">${x.r.consumption == null ? "—" : Number(x.r.consumption).toLocaleString("pt-BR") + " " + unidade}</td>
      <td>${x.r.photo ? '<span class="bt-badge bt-badge--ok">foto</span>' : '<span class="bt-badge">sem foto</span>'}</td>
      <td>${esc(x.r.user || "—")}</td>
      <td>${esc(x.r.observation || "—")}</td>
      <td>${x.avisos.length
        ? x.avisos.map(function (a) { return '<span class="bt-badge bt-badge--' + a.tom + '">' + esc(a.txt) + "</span>"; }).join(" ")
        : '<span class="bt-badge bt-badge--ok">ok</span>'}</td>
    </tr>`;
  }).join("");

  return `
  <div class="bt-grid--kpi" style="margin-bottom:16px">
    <div class="bt-kpi"><div class="bt-kpi__label">Registros</div><div class="bt-kpi__value">${todas.length}</div><div class="bt-kpi__hint">no histórico</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Exibidos</div><div class="bt-kpi__value">${filtradas.length}</div><div class="bt-kpi__hint">com os filtros atuais</div></div>
    <div class="bt-kpi ${comDesvio ? "bt-kpi--warn" : "bt-kpi--ok"}"><div class="bt-kpi__label">Possíveis desvios</div><div class="bt-kpi__value">${comDesvio}</div><div class="bt-kpi__hint">${comDesvio ? "merecem conferência" : "nada sinalizado"}</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Medidores ativos</div><div class="bt-kpi__value">${utilMetersAtivos().length}</div><div class="bt-kpi__hint">de ${meters.length} cadastrados</div></div>

        <div class="bt-field"><label>CAMM</label><select id="uf-camm">
          <option value="">Todos</option>

/* ====================================================================
   GRUPOS COM RESPONSÁVEL DIRETO

   Antes o aprovador da SCM vinha de um campo de texto solto no cadastro
   do usuário ("e-mail do líder"). Bastava um erro de digitação para a
   solicitação não chegar a ninguém — e o painel da administração vivia
   apontando gente sem líder.

   Agora a pessoa pertence a um GRUPO, e o grupo tem um RESPONSÁVEL
   DIRETO. A aprovação segue o responsável do grupo; o campo antigo
   continua existindo apenas como exceção, para quando alguém aprova
   fora da estrutura. Isso também é o que permite matricular treinamento
   por grupo: entrar ou sair do grupo atualiza a obrigação sozinho.

   Os onze grupos são os que o cliente informou.
   ==================================================================== */

const GRUPOS_KEY = "btlocal.grupos_v1";

const GRUPOS_SEED = [
  { id: "g-mecanica", nome: "Mecânica", area: "Manutenção", responsavelId: null, ativo: true },
  { id: "g-soldador", nome: "Soldador", area: "Manutenção", responsavelId: null, ativo: true },
  { id: "g-tec-utilidades", nome: "Técnico Utilidades", area: "Utilidades", responsavelId: null, ativo: true },
  { id: "g-eletrica-automacao", nome: "Elétrica / Automação", area: "Manutenção", responsavelId: null, ativo: true },
  { id: "g-predial", nome: "Predial", area: "Facilities", responsavelId: null, ativo: true },
  { id: "g-predial-eletrica", nome: "Predial Elétrica", area: "Facilities", responsavelId: null, ativo: true },
  { id: "g-eletromecanica", nome: "Eletromecânica", area: "Manutenção", responsavelId: null, ativo: true },
  { id: "g-pcm", nome: "PCM", area: "PCM", responsavelId: null, ativo: true },
  { id: "g-almoxarifado", nome: "Almoxarifado", area: "Almoxarifado", responsavelId: null, ativo: true },
  { id: "g-coord-adm", nome: "Coordenador ADM", area: "Coordenação", responsavelId: null, ativo: true },
  { id: "g-coord-eletrica", nome: "Coordenador Elétrica", area: "Coordenação", responsavelId: null, ativo: true }
];

function loadGrupos() {
  return seedStore(GRUPOS_KEY, GRUPOS_SEED);
}
function saveGrupos(lista) {
  return writeStore(GRUPOS_KEY, lista);
}

function grupoPor(id) {
  if (!id) return null;
  return loadGrupos().find(function (g) { return g.id === id; }) || null;
}

function grupoDoUsuario(user) {
  const u = user || STATE.currentUser;
  if (!u) return null;
  return grupoPor(u.grupoId);
}

/** Membros ativos de um grupo. */
function grupoMembros(grupoId) {
  return loadUsers().filter(function (u) { return u.grupoId === grupoId && u.ativo !== false; });
}

/**
 * Quem aprova a solicitação desta pessoa.
 *
 * Ordem: responsável do grupo → e-mail de exceção no cadastro → ninguém.
 * Devolver o e-mail (e não o id) mantém compatibilidade com a SCM, que
 * já grava solicitanteEmailLider e filtra a fila de aprovação por ele.
 */
function responsavelDe(user) {
  const u = user || STATE.currentUser || {};
  const g = grupoPor(u.grupoId);
  if (g && g.responsavelId) {
    const resp = loadUsers().find(function (x) { return x.id === g.responsavelId; });
    if (resp && resp.ativo !== false) {
      return { email: String(resp.usuario || "").toLowerCase(), nome: resp.nome, origem: "grupo", grupo: g.nome };
    }
  }
  const exc = String(u.emailLider || "").trim().toLowerCase();
  if (exc) return { email: exc, nome: exc, origem: "excecao", grupo: g ? g.nome : null };
  return { email: "", nome: "", origem: "nenhum", grupo: g ? g.nome : null };
}

/** Alguém é responsável direto de pelo menos um grupo? */
function ehResponsavelDeGrupo(user) {
  const u = user || STATE.currentUser;
  if (!u) return false;
  return loadGrupos().some(function (g) { return g.responsavelId === u.id && g.ativo !== false; });
}

/** Grupos sob responsabilidade da pessoa. */
function meusGrupos(user) {
  const u = user || STATE.currentUser;
  if (!u) return [];
  return loadGrupos().filter(function (g) { return g.responsavelId === u.id; });
}

/** Pessoas que respondem a mim, direta ou por exceção. */
function minhaEquipe(user) {
  const u = user || STATE.currentUser;
  if (!u) return [];
  const meuMail = String(u.usuario || "").toLowerCase();
  const ids = meusGrupos(u).map(function (g) { return g.id; });
  return loadUsers().filter(function (x) {
    if (x.id === u.id) return false;
    if (ids.indexOf(x.grupoId) >= 0) return true;
    return String(x.emailLider || "").toLowerCase() === meuMail;
  });
}

  <div class="bt-card">
    <div class="bt-card__body--flush">
      <div class="bt-tablewrap"><table class="bt-table">
        <thead><tr><th>Grupo / cargo</th><th>Área</th><th>Responsável direto</th>
          <th class="bt-num">Pessoas</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="5"><div class="bt-state"><strong>Nenhum grupo</strong>Cadastre o primeiro no botão acima.</div></td></tr>'}</tbody>
      </table></div>

  <div class="bt-notice bt-notice--info" style="margin-top:16px">

  </div>`;
  const close = function () { root.innerHTML = ""; };
  document.getElementById("grupo-backdrop").onclick = close;
  document.getElementById("grupo-close").onclick = close;
  document.getElementById("grupo-cancel").onclick = close;
  document.getElementById("grupo-save").onclick = function () {
    const nome = document.getElementById("grupo-nome").value.trim();
    if (!nome) {
      document.getElementById("grupo-erro").innerHTML =
        '<div class="bt-notice bt-notice--danger"><span class="bt-notice__ic">!</span><div>Informe o nome do grupo.</div></div>';
      return;
    }
    const payload = {
      nome: nome,
      area: document.getElementById("grupo-area").value,
      responsavelId: document.getElementById("grupo-resp").value || null,
      ativo: document.getElementById("grupo-ativo").checked
    };
    if (g) Object.assign(g, payload);
    else grupos.push(Object.assign({ id: "g" + Date.now() }, payload));
    saveGrupos(grupos);
    close();
    if (typeof renderAdminTabContent === "function") renderAdminTabContent();
  };
}

function grupoMembrosModal(grupoId) {
  const g = grupoPor(grupoId);
  if (!g) return;
  const todos = loadUsers();
  const membros = todos.filter(function (u) { return u.grupoId === g.id; });
  const fora = todos.filter(function (u) { return u.grupoId !== g.id && u.ativo !== false; });

  const root = document.getElementById("grupo-modal-root");
  root.innerHTML = `
  <div class="modal-backdrop" id="gm-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${esc(g.nome)} — membros</h3>
        <button class="icon-btn" id="gm-close">${icon("x", 18)}</button>
      </div>
      <div class="bt-small bt-muted" style="margin-bottom:12px">
        Mudar alguém de grupo troca o aprovador da SCM dele e revê os treinamentos obrigatórios do grupo.
      </div>
      <div class="sci-section-title">No grupo (${membros.length})</div>
      <div class="bt-stack" style="gap:7px;margin:10px 0 16px">
        ${membros.map(function (u) {
          return `<div class="bt-row" style="gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px">
            <span><b>${esc(u.nome)}</b><div class="bt-small bt-muted">${esc(u.usuario)}</div></span>
            <button class="bt-btn bt-btn--sm bt-right" data-gm-out="${esc(u.id)}">Remover</button>
          </div>`;
        }).join("") || '<div class="bt-small bt-muted">Ninguém neste grupo ainda.</div>'}
      </div>
      <div class="sci-section-title">Acrescentar</div>
      <select class="modal-input" id="gm-add" style="margin-top:10px">
        <option value="">— escolha uma pessoa —</option>
        ${fora.map(function (u) {
          const gg = grupoPor(u.grupoId);
          return '<option value="' + esc(u.id) + '">' + esc(u.nome) +
            (gg ? " (hoje em " + esc(gg.nome) + ")" : " (sem grupo)") + "</option>";
        }).join("")}
      </select>
      <div class="modal-actions">
        <button class="ghost-btn" id="gm-ok">Fechar</button>
        <button class="primary-btn" id="gm-save">Acrescentar ao grupo</button>
      </div>
    </div>
  </div>`;
  const fechar = function () { root.innerHTML = ""; if (typeof renderAdminTabContent === "function") renderAdminTabContent(); };
  document.getElementById("gm-backdrop").onclick = fechar;
  document.getElementById("gm-close").onclick = fechar;
  document.getElementById("gm-ok").onclick = fechar;

  root.querySelectorAll("[data-gm-out]").forEach(function (b) {
    b.onclick = function () {
      const id = this.getAttribute("data-gm-out");
      const users = loadUsers();
      const u = users.find(function (x) { return x.id === id; });
      if (u) { u.grupoId = null; saveUsers(users); }
      grupoMembrosModal(grupoId);
    };
  });
  document.getElementById("gm-save").onclick = function () {
    const id = document.getElementById("gm-add").value;
    if (!id) return;
    const users = loadUsers();
    const u = users.find(function (x) { return x.id === id; });
    if (u) {
      u.grupoId = g.id;
      saveUsers(users);
      if (typeof lmsSyncGrupos === "function") lmsSyncGrupos();
    }
    grupoMembrosModal(grupoId);
  };
}

function attachGruposEvents() {
  const novo = document.getElementById("grupo-novo");
  if (novo) novo.onclick = function () { grupoForm(null); };
  document.querySelectorAll("[data-grupo-edit]").forEach(function (b) {
    b.onclick = function () { grupoForm(this.getAttribute("data-grupo-edit")); };
  });
  document.querySelectorAll("[data-grupo-membros]").forEach(function (b) {
    b.onclick = function () { grupoMembrosModal(this.getAttribute("data-grupo-membros")); };
  });
  document.querySelectorAll("[data-grupo-toggle]").forEach(function (b) {
    b.onclick = function () {
      const id = this.getAttribute("data-grupo-toggle");
      const grupos = loadGrupos();
      const g = grupos.find(function (x) { return x.id === id; });
      if (!g) return;
      const inativando = g.ativo !== false;
      if (inativando) {
        const n = grupoMembros(g.id).length;
        if (n && !confirm("Inativar " + g.nome + "?\n\nHá " + n + " pessoa(s) neste grupo. Elas ficam sem aprovador até serem movidas.")) return;
      }
      g.ativo = !inativando;
      saveGrupos(grupos);
      if (typeof renderAdminTabContent === "function") renderAdminTabContent();
    };
  });
}

const _grupoPrevOpenUserForm = openUserForm;
openUserForm = function (userId) {
  _grupoPrevOpenUserForm(userId);
  const campoTime = document.getElementById("uf-time");
  if (!campoTime) return;

  const users = loadUsers();
  const editing = users.find(function (u) { return String(u.id) === String(userId); }) || null;
  const grupos = loadGrupos().filter(function (g) { return g.ativo !== false; });

  // O campo livre "Time" vira seleção de grupo: é o grupo que define o aprovador.
  const wrap = document.createElement("div");
  wrap.innerHTML =
    '<label class="field-label" style="margin-top:12px;">Grupo / cargo</label>' +
    '<select class="modal-input" id="uf-grupo"><option value="">— sem grupo —</option>' +
    grupos.map(function (g) {
      const resp = g.responsavelId ? users.find(function (u) { return u.id === g.responsavelId; }) : null;
      return '<option value="' + esc(g.id) + '"' + (editing && editing.grupoId === g.id ? " selected" : "") + ">" +
        esc(g.nome) + (resp ? " · responsável " + esc(resp.nome) : " · sem responsável") + "</option>";
    }).join("") + "</select>" +
    '<div class="bt-field__hint" id="uf-grupo-hint"></div>';

  const labelTime = campoTime.previousElementSibling;
  if (labelTime) labelTime.textContent = "Time (texto livre, opcional)";
  campoTime.insertAdjacentElement("afterend", wrap);

  const hint = document.getElementById("uf-grupo-hint");
  const sel = document.getElementById("uf-grupo");
  const atualizaHint = function () {
    const g = grupoPor(sel.value);
    if (!g) { hint.textContent = "Sem grupo, a SCM desta pessoa só chega a alguém pelo e-mail de exceção abaixo."; return; }
    const resp = g.responsavelId ? users.find(function (u) { return u.id === g.responsavelId; }) : null;
    hint.textContent = resp
      ? "A SCM desta pessoa vai para " + resp.nome + " (" + resp.usuario + ")."
      : "Este grupo ainda não tem responsável direto: defina em Administração > Grupos e Responsáveis.";
  };
  sel.onchange = atualizaHint;
  atualizaHint();

  const lider = document.getElementById("uf-lider");
  if (lider) {
    const l = lider.previousElementSibling;
    if (l) l.textContent = "E-mail do líder (exceção, só se aprovar fora do grupo)";
  }

  // Reescreve o salvar para gravar o grupo junto.
  const btn = document.getElementById("save-user-form");
  if (btn) {
    const anterior = btn.onclick;
    btn.onclick = function () {
      const grupoId = document.getElementById("uf-grupo").value || null;
      const antes = loadUsers().map(function (u) { return { id: u.id, grupoId: u.grupoId }; });
      anterior.call(this);
      // O salvar original recarrega e grava USERS; aplica o grupo em seguida.
      const depois = loadUsers();
      const alvo = editing
        ? depois.find(function (u) { return String(u.id) === String(editing.id); })
        : depois.slice().sort(function (a, b) { return String(b.id).localeCompare(String(a.id)); })[0];
      if (alvo && alvo.grupoId !== grupoId) {
        alvo.grupoId = grupoId;
        saveUsers(depois);
        if (typeof lmsSyncGrupos === "function") lmsSyncGrupos();
        if (typeof renderAdminTabContent === "function") renderAdminTabContent();
      }
      void antes;
    };
  }
};

/* ---------- a fila de aprovação passa a seguir o responsável do grupo ---------- */

// Na criação da SCM o arquivo original grava solicitanteEmailLider a partir do
// campo do usuário. Aqui o valor passa a ser resolvido pelo grupo.
(function () {
  const anterior = saveScm;
  saveScm = function (list) {
    try {
      const users = loadUsers();
      (list || []).forEach(function (s) {
        if (s.status !== "pendente_aprovacao_lider") return;
        if (s.aprovadorResolvido) return;
        const dono = users.find(function (u) {
          return u.id === s.solicitanteId || String(u.usuario || "").toLowerCase() === String(s.solicitanteEmail || "").toLowerCase();
        });
        if (!dono) return;
        const r = responsavelDe(dono);
        if (r.email) {
          s.solicitanteEmailLider = r.email;
          s.aprovadorOrigem = r.origem;
          s.aprovadorGrupo = r.grupo;
        }
        s.aprovadorResolvido = true;
      });
    } catch (e) { console.warn("[BIOTROP] resolução do aprovador:", e); }
    return anterior(list);
  };
})();

/* ---------- treinamento por grupo ---------- */

const _lmsPrevEnsure = lmsEnsureEnrollments;
lmsEnsureEnrollments = function () {
  const db = lmsLoad();
  const users = loadUsers().filter(function (u) { return u.ativo !== false; });
  let changed = false;

  db.trainings.filter(function (t) { return t.active !== false && t.mandatory; }).forEach(function (t) {
    const v = lmsVersionOf(t.id);
    if (!v) return;
    // Treinamento com grupos definidos obriga só quem está nesses grupos.
    // Sem grupos, segue valendo para todo usuário ativo.
    const alvo = (Array.isArray(t.grupoIds) && t.grupoIds.length)
      ? users.filter(function (u) { return t.grupoIds.indexOf(u.grupoId) >= 0; })
      : users;
    alvo.forEach(function (u) {
      const uid = lmsUserId(u);
      const has = db.enrollments.some(function (e) {
        return e.user_id === uid && e.training_id === t.id && e.version_id === v.id;
      });
      if (has) return;
      db.enrollments.push({
        id: lmsUid("en"), user_id: uid, user_name: u.nome, training_id: t.id, version_id: v.id,
        mandatory: true, status: "nao_iniciado", started_at: null,
        due_at: new Date(Date.now() + (t.deadline_days || 30) * 864e5).toISOString(),
        assigned_at: lmsNow(), origem: (t.grupoIds && t.grupoIds.length) ? "grupo" : "todos"
      });
      changed = true;
    });
  });
  if (changed) lmsSave();
};

/** Chamada quando alguém troca de grupo. */
function lmsSyncGrupos() {
  lmsEnsureEnrollments();
}

// Na gestão do treinamento, escolher os grupos obrigados.
const _lmsPrevTrainingForm = lmsTrainingForm;
lmsTrainingForm = function (trainingId) {
  _lmsPrevTrainingForm(trainingId);
  const db = lmsLoad();
  const t = trainingId ? lmsTraining(trainingId) : null;
  const grupos = loadGrupos().filter(function (g) { return g.ativo !== false; });
  const marcados = (t && Array.isArray(t.grupoIds)) ? t.grupoIds : [];

  const alvo = document.getElementById("tf-mandatory");
  if (!alvo) return;
  const campo = alvo.closest(".bt-field") || alvo.parentElement;

  const wrap = document.createElement("div");
  wrap.className = "bt-field";
  wrap.style.gridColumn = "1/-1";
  wrap.innerHTML = '<label>Obrigatório para quais grupos</label>' +
    '<div class="bt-small bt-muted" style="margin-bottom:8px">Sem nenhum marcado, o treinamento obrigatório vale para todos os usuários ativos.</div>' +
    '<div class="bt-stack" style="gap:6px;max-height:190px;overflow:auto">' +
    grupos.map(function (g) {
      return '<label class="bt-row" style="gap:9px;cursor:pointer;padding:7px 10px;border:1px solid var(--border);border-radius:10px">' +
        '<input type="checkbox" class="tf-grupo" value="' + esc(g.id) + '"' +
        (marcados.indexOf(g.id) >= 0 ? " checked" : "") + ">" +
        '<span class="bt-small">' + esc(g.nome) + ' <span class="bt-muted">· ' + grupoMembros(g.id).length + " pessoa(s)</span></span></label>";
    }).join("") + "</div>";
  campo.insertAdjacentElement("afterend", wrap);

  const salvar = document.getElementById("tf-save");
  if (salvar) {
    const anterior = salvar.onclick;
    salvar.onclick = function () {
      const ids = Array.prototype.slice.call(document.querySelectorAll(".tf-grupo:checked"))
        .map(function (i) { return i.value; });
      anterior.call(this);
      const base = lmsLoad();
      const alvoTr = t
        ? base.trainings.find(function (x) { return x.id === t.id; })
        : base.trainings[base.trainings.length - 1];
      if (alvoTr) {
        alvoTr.grupoIds = ids;
        lmsSave();
        lmsEnsureEnrollments();
      }
    };
  }
  void db;
};

/* ---------- visão geral de treinamentos ---------- */

const VGT_FILTER = { colaborador: "", grupo: "", time: "", situacao: "" };

/** Quem pode ver a equipe: responsável de grupo, gestor, PCM e administração. */
function podeVerVisaoGeral(user) {
  const u = user || STATE.currentUser;
  if (!u) return false;
  if (lmsCanManage()) return true;
  if (ehResponsavelDeGrupo(u)) return true;
  return u.perfilId === "pcm" || u.perfilId === "lider";
}

function renderVisaoGeralTreinamentos() {
  if (!podeVerVisaoGeral()) {
    return '<div class="bt-state"><strong>Sem acesso</strong>A visão geral de treinamentos é de quem responde por um grupo, da gestão e da administração.</div>';
  }
  lmsEnsureEnrollments();
  const db = lmsLoad();
  const mandatory = db.trainings.filter(function (t) { return t.active !== false && t.mandatory; });
  const grupos = loadGrupos();
  const u = STATE.currentUser;

  // Responsável de grupo vê o próprio grupo; gestão vê todos.
  let linhas = lmsComplianceRows();
  if (!lmsCanManage()) {
    const meus = meusGrupos(u).map(function (g) { return g.id; });
    const meuMail = String(u.usuario || "").toLowerCase();
    linhas = linhas.filter(function (r) {
      return meus.indexOf(r.user.grupoId) >= 0 ||
        String(r.user.emailLider || "").toLowerCase() === meuMail ||
        r.user.id === u.id;
    });
  }

  const f = VGT_FILTER;
  const times = [];
  linhas.forEach(function (r) { const t = (r.user.time || "").trim(); if (t && times.indexOf(t) < 0) times.push(t); });

  const filtradas = linhas.filter(function (r) {
    if (f.grupo && r.user.grupoId !== f.grupo) return false;
    if (f.time && (r.user.time || "") !== f.time) return false;
    if (f.colaborador) {
      const alvo = (r.user.nome + " " + r.user.usuario).toLowerCase();
      if (alvo.indexOf(f.colaborador.toLowerCase()) < 0) return false;
    }
    if (f.situacao === "pendente" && r.pct === 100) return false;
    if (f.situacao === "em_dia" && r.pct !== 100) return false;
    if (f.situacao === "atrasado" && !r.items.some(function (i) { return i.situacao === "atrasado" || i.situacao === "vencido"; })) return false;
    return true;
  });

  const totalItens = filtradas.reduce(function (s, r) { return s + r.items.length; }, 0);
  const okItens = filtradas.reduce(function (s, r) { return s + r.okCount; }, 0);
  const atrasados = filtradas.reduce(function (s, r) {
    return s + r.items.filter(function (i) { return i.situacao === "atrasado" || i.situacao === "vencido"; }).length;
  }, 0);
  const geral = totalItens ? Math.round((okItens / totalItens) * 100) : 100;

  const sit = {
    em_dia: '<span class="bt-badge bt-badge--ok">em dia</span>',
    pendente: '<span class="bt-badge">pendente</span>',
    atrasado: '<span class="bt-badge bt-badge--danger">atrasado</span>',
    vencido: '<span class="bt-badge bt-badge--danger">vencido</span>',
    reprovado: '<span class="bt-badge bt-badge--warn">bloqueado</span>'
  };

  return `
  <div class="page-title-row">
    <div class="page-icon">${icon("users", 22)}</div>
    <div>
      <h1>Visão geral de treinamentos</h1>
      <p>Situação de cada pessoa nos treinamentos obrigatórios${lmsCanManage() ? "" : " da sua equipe"}.</p>
    </div>
  </div>

  <div class="bt-grid--kpi" style="margin-bottom:18px">
    <div class="bt-kpi ${geral >= 80 ? "bt-kpi--ok" : geral >= 50 ? "bt-kpi--warn" : "bt-kpi--alert"}">
      <div class="bt-kpi__label">Conformidade</div><div class="bt-kpi__value">${geral}<span class="bt-kpi__unit">%</span></div>
      <div class="bt-kpi__hint">${okItens} de ${totalItens} obrigações em dia</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Pessoas</div><div class="bt-kpi__value">${filtradas.length}</div><div class="bt-kpi__hint">de ${linhas.length} no seu escopo</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Obrigatórios</div><div class="bt-kpi__value">${mandatory.length}</div><div class="bt-kpi__hint">treinamentos exigidos</div></div>
    <div class="bt-kpi ${atrasados ? "bt-kpi--alert" : "bt-kpi--ok"}"><div class="bt-kpi__label">Atrasados ou vencidos</div><div class="bt-kpi__value">${atrasados}</div><div class="bt-kpi__hint">${atrasados ? "exigem ação" : "nada vencido"}</div></div>
  </div>

  <div class="bt-card" style="margin-bottom:16px">
    <div class="bt-card__body">
      <div class="bt-fields2">
        <div class="bt-field"><label>Colaborador</label><input id="vgt-colab" value="${esc(f.colaborador)}" placeholder="nome ou e-mail"></div>
        <div class="bt-field"><label>Grupo / cargo</label><select id="vgt-grupo">
          <option value="">Todos</option>
          ${grupos.map(function (g) { return '<option value="' + esc(g.id) + '"' + (f.grupo === g.id ? " selected" : "") + ">" + esc(g.nome) + "</option>"; }).join("")}
        </select></div>
        <div class="bt-field"><label>Time</label><select id="vgt-time">
          <option value="">Todos</option>
          ${times.map(function (t) { return '<option value="' + esc(t) + '"' + (f.time === t ? " selected" : "") + ">" + esc(t) + "</option>"; }).join("")}
        </select></div>
        <div class="bt-field"><label>Situação</label><select id="vgt-sit">
          <option value="">Todas</option>
          <option value="pendente"${f.situacao === "pendente" ? " selected" : ""}>Com pendência</option>
          <option value="atrasado"${f.situacao === "atrasado" ? " selected" : ""}>Atrasado ou vencido</option>
          <option value="em_dia"${f.situacao === "em_dia" ? " selected" : ""}>Tudo em dia</option>
        </select></div>
      </div>
      <div class="bt-row"><button class="bt-btn bt-btn--sm bt-right" id="vgt-limpar">Limpar filtros</button>
        <button class="bt-btn bt-btn--sm" id="vgt-csv">Exportar CSV</button></div>
    </div>
  </div>

  <div class="bt-card">
    <div class="bt-card__body--flush">
      <div class="bt-tablewrap"><table class="bt-table">
        <thead><tr><th>Colaborador</th><th>Grupo / cargo</th>
          ${mandatory.map(function (t) { return '<th title="' + esc(t.title) + '">' + esc(t.code) + "</th>"; }).join("")}
          <th class="bt-num">Em dia</th></tr></thead>
        <tbody>
          ${filtradas.map(function (r) {
            const g = grupoPor(r.user.grupoId);
            return "<tr><td><b>" + esc(r.user.nome) + '</b><div class="bt-small bt-muted">' + esc(r.user.usuario) + "</div></td>" +
              "<td>" + (g ? esc(g.nome) : '<span class="bt-badge">sem grupo</span>') +
              (r.user.time ? '<div class="bt-small bt-muted">' + esc(r.user.time) + "</div>" : "") + "</td>" +
              mandatory.map(function (t) {
                const item = r.items.find(function (i) { return i.training.id === t.id; });
                return "<td>" + (item ? (sit[item.situacao] || sit.pendente) : '<span class="bt-small bt-muted">não exigido</span>') + "</td>";
              }).join("") +
              '<td class="bt-num"><b>' + r.pct + "%</b></td></tr>";

function attachVisaoGeralEvents() {
  const liga = function (id, campo, tipo) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener(tipo === "text" ? "input" : "change", function () {
      VGT_FILTER[campo] = this.value;
      navigateTo("lms_compliance");
    });
  };
  liga("vgt-colab", "colaborador", "text");
  liga("vgt-grupo", "grupo");
  liga("vgt-time", "time");
  liga("vgt-sit", "situacao");

  const limpar = document.getElementById("vgt-limpar");
  if (limpar) limpar.onclick = function () {
    VGT_FILTER.colaborador = ""; VGT_FILTER.grupo = ""; VGT_FILTER.time = ""; VGT_FILTER.situacao = "";
    navigateTo("lms_compliance");
  };

  const csv = document.getElementById("vgt-csv");
  if (csv) csv.onclick = function () {
    const db = lmsLoad();
    const mandatory = db.trainings.filter(function (t) { return t.active !== false && t.mandatory; });
    const linhas = [["Colaborador", "Email", "Grupo", "Time"].concat(mandatory.map(function (t) { return t.code; })).concat(["Em dia %"]).map(csvEscape).join(";")];
    lmsComplianceRows().forEach(function (r) {
      const g = grupoPor(r.user.grupoId);
      linhas.push([r.user.nome, r.user.usuario, g ? g.nome : "", r.user.time || ""]
        .concat(mandatory.map(function (t) {
          const i = r.items.find(function (x) { return x.training.id === t.id; });
          return i ? i.situacao : "nao exigido";
        }))
        .concat([r.pct]).map(csvEscape).join(";"));
    });
    downloadCsv(linhas.join("\r\n"), "visao-geral-treinamentos.csv");
  };
}

(function () {
  // Chrome rola o container até o primeiro campo focado, e o detalhe da
  // SCI abria no meio por causa disso.
  const observador = new MutationObserver(function (mudancas) {
    mudancas.forEach(function (m) {
      Array.prototype.forEach.call(m.addedNodes, function (n) {
        if (!n || n.nodeType !== 1) return;
        if (n.classList && (n.classList.contains("modal-backdrop") || n.classList.contains("training-modal"))) {
          n.scrollTop = 0;
          const caixa = n.querySelector(".modal, .training-dialog");
          if (caixa) caixa.scrollTop = 0;
        }
      });
    });
  });
  observador.observe(document.body, { childList: true, subtree: true });
})();


/* ====================================================================
   E-MAIL — fila e caixa de saída

   Aqui não existe servidor, então nada sai sozinho. O que dá para fazer
   com honestidade é o que o backend vai fazer de todo jeito: ENFILEIRAR
   a mensagem com destinatário, assunto e corpo prontos, e deixar a fila
   visível.

   Isso não é enfeite. A fila é a peça que falta no desenho: se o Graph
   estiver fora do ar, o aviso não pode se perder. A mesma tabela existe
   no banco (core.email_fila) e o worker do servidor consome dela. Aqui
   a fila é local e quem envia é uma pessoa, com dois caminhos:
     - "Abrir no e-mail": monta mailto: e o cliente abre já preenchido;
     - "Baixar .eml": arquivo que abre no Outlook como rascunho pronto.

   Gatilhos, conforme a reunião decidiu:
     LIGADO   SCI entra em "Aguardando Revisão do Solicitante" -> avisa
              o solicitante. Foi o único que o Plinio quis no começo,
              porque o almoxarifado olha o sistema todo dia e o
              solicitante não.
     DESLIGADO (prontos, é só ligar) SCM na aprovação -> avisa o
              responsável do grupo. Conclusão de treinamento -> avisa o
              colaborador e o responsável.
   ==================================================================== */

const EMAIL_FILA_KEY = "btlocal.email_fila_v1";
const EMAIL_CONFIG_KEY = "btlocal.email_config_v1";

const EMAIL_CONFIG_PADRAO = {

};

const EMAIL_GATILHOS = [
  {
    id: "sci_revisao_solicitante",
    nome: "SCI devolvida para revisão",
    quem: "o solicitante",
    porque: "É o único caso em que a pendência é da pessoa e ela não vai descobrir sozinha."
