function emailConfig() {
  const c = readStore(EMAIL_CONFIG_KEY, null);
  if (!c || typeof c !== "object") return JSON.parse(JSON.stringify(EMAIL_CONFIG_PADRAO));
  return {
    remetente: c.remetente || EMAIL_CONFIG_PADRAO.remetente,
    remetenteNome: c.remetenteNome || EMAIL_CONFIG_PADRAO.remetenteNome,
    assinatura: c.assinatura || EMAIL_CONFIG_PADRAO.assinatura,
    gatilhos: Object.assign({}, EMAIL_CONFIG_PADRAO.gatilhos, c.gatilhos || {})
  };
}
function emailSalvarConfig(c) { return writeStore(EMAIL_CONFIG_KEY, c); }

function emailFila() {
  const f = readStore(EMAIL_FILA_KEY, []);
  return Array.isArray(f) ? f : [];
}
function emailSalvarFila(f) { return writeStore(EMAIL_FILA_KEY, f); }

/**
 * Coloca a mensagem na fila.
 *
 * Devolve o registro ou null quando o gatilho está desligado ou não há
 * destinatário — e nesse caso registra o motivo, porque "não chegou
 * e-mail" sem explicação é o pior tipo de defeito para investigar.
 */
function emailEnfileirar(dados) {
  const cfg = emailConfig();
  if (dados.gatilho && cfg.gatilhos[dados.gatilho] === false) {
    console.info("[BIOTROP] e-mail não enfileirado: gatilho " + dados.gatilho + " está desligado.");
    return null;
  }
  const para = String(dados.para || "").trim().toLowerCase();
  const fila = emailFila();
  if (!para || para.indexOf("@") < 0) {
    fila.unshift({
      id: "em" + Date.now() + Math.random().toString(36).slice(2, 5),
      gatilho: dados.gatilho, para: para, assunto: dados.assunto,
      corpo: dados.corpo, refTipo: dados.refTipo, refCodigo: dados.refCodigo,
      criadoEm: new Date().toISOString(), status: "sem_destinatario",
      erro: "Sem e-mail de destino. " + (dados.motivoSemDestino || "Confira o cadastro do usuário ou o responsável do grupo.")
    });
    emailSalvarFila(fila);
    return null;
  }

  const reg = {
    id: "em" + Date.now() + Math.random().toString(36).slice(2, 5),
    gatilho: dados.gatilho,
    para: para,
    cc: (dados.cc || []).map(function (x) { return String(x).trim().toLowerCase(); }).filter(Boolean),
    assunto: dados.assunto,
    corpo: dados.corpo,
    refTipo: dados.refTipo || "",
    refCodigo: dados.refCodigo || "",
    criadoEm: new Date().toISOString(),
    status: "pendente",
    enviadoEm: null,
    enviadoPor: null,
    erro: null
  };
  fila.unshift(reg);
  emailSalvarFila(fila);
  return reg;
}

/* ---------- envio manual: mailto e .eml ---------- */

function emailAbrirNoCliente(id) {
  const reg = emailFila().find(function (x) { return x.id === id; });
  if (!reg) return;
  // mailto tem limite prático de ~2000 caracteres de URL. Corpo longo é
  // truncado com aviso, e o botão "Copiar" existe justamente para isso.
  const limite = 1500;
  let corpo = reg.corpo;
  let truncado = false;
  if (corpo.length > limite) { corpo = corpo.slice(0, limite); truncado = true; }
  const url = "mailto:" + encodeURIComponent(reg.para) +
    "?subject=" + encodeURIComponent(reg.assunto) +
    (reg.cc && reg.cc.length ? "&cc=" + encodeURIComponent(reg.cc.join(",")) : "") +
    "&body=" + encodeURIComponent(corpo + (truncado ? "\n\n[texto cortado pelo limite do mailto — use Copiar para o conteúdo completo]" : ""));
  window.location.href = url;
}

function emailBaixarEml(id) {
  const reg = emailFila().find(function (x) { return x.id === id; });
  if (!reg) return;
  const cfg = emailConfig();
  // RFC 822 mínimo. Codifico o corpo em quoted-printable simplificado
  // (só o essencial: acento vira =XX) para não quebrar no Outlook.
  const qp = function (txt) {
    return txt.replace(/[^\x20-\x3C\x3E-\x7E\r\n]/g, function (ch) {
      const bytes = new TextEncoder().encode(ch);
      let out = "";
      bytes.forEach(function (b) { out += "=" + b.toString(16).toUpperCase().padStart(2, "0"); });
      return out;
    }).replace(/(.{1,72})(\s|$)/g, "$1$2");
  };
  const linhas = [
    "From: " + cfg.remetenteNome + " <" + cfg.remetente + ">",
    "To: " + reg.para,
    reg.cc && reg.cc.length ? "Cc: " + reg.cc.join(", ") : null,
    "Subject: " + reg.assunto,
    "Date: " + new Date(reg.criadoEm).toUTCString(),
    "MIME-Version: 1.0",
    "Content-Type: text/plain; charset=UTF-8",
    "Content-Transfer-Encoding: quoted-printable",
    "X-Unsent: 1",
    "",
    qp(reg.corpo)
  ].filter(function (x) { return x !== null; });

  const blob = new Blob([linhas.join("\r\n")], { type: "message/rfc822" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (reg.refCodigo || reg.id) + ".eml";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function emailMarcar(id, status, erro) {
  const fila = emailFila();
  const reg = fila.find(function (x) { return x.id === id; });
  if (!reg) return;
  reg.status = status;
  reg.enviadoEm = status === "enviado" ? new Date().toISOString() : null;
  reg.enviadoPor = status === "enviado" ? ((STATE.currentUser || {}).usuario || "local") : null;
  reg.erro = erro || null;
  emailSalvarFila(fila);
  navigateTo("email_fila");
}

  return `

      como rascunho pronto. No servidor, esta mesma fila é a tabela <b>core.email_fila</b> e quem
      consome é o worker do Microsoft Graph.</div>
  </div>

  <div class="bt-grid--kpi" style="margin-bottom:16px">
    <div class="bt-kpi ${pendentes ? "bt-kpi--warn" : "bt-kpi--ok"}"><div class="bt-kpi__label">Na fila</div><div class="bt-kpi__value">${pendentes}</div><div class="bt-kpi__hint">esperando despacho</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Enviados</div><div class="bt-kpi__value">${fila.filter(function (r) { return r.status === "enviado"; }).length}</div><div class="bt-kpi__hint">marcados manualmente</div></div>
    <div class="bt-kpi ${semDest ? "bt-kpi--alert" : "bt-kpi--ok"}"><div class="bt-kpi__label">Sem destinatário</div><div class="bt-kpi__value">${semDest}</div><div class="bt-kpi__hint">${semDest ? "cadastro incompleto" : "nenhum"}</div></div>
    <div class="bt-kpi"><div class="bt-kpi__label">Remetente</div><div class="bt-kpi__value" style="font-size:14px;line-height:1.4">${esc(cfg.remetente)}</div><div class="bt-kpi__hint">conta de comunicação</div></div>
  </div>

  <div class="bt-card" style="margin-bottom:16px">
    <div class="bt-card__body">
      <div class="bt-fields2">
        <div class="bt-field"><label>Situação</label><select id="em-f-status">
          <option value="">Todas</option>
          <option value="pendente"${f.status === "pendente" ? " selected" : ""}>Na fila</option>
          <option value="enviado"${f.status === "enviado" ? " selected" : ""}>Enviado</option>
          <option value="sem_destinatario"${f.status === "sem_destinatario" ? " selected" : ""}>Sem destinatário</option>
          <option value="cancelado"${f.status === "cancelado" ? " selected" : ""}>Cancelado</option>
        </select></div>
        <div class="bt-field"><label>Gatilho</label><select id="em-f-gatilho">
          <option value="">Todos</option>
          ${EMAIL_GATILHOS.map(function (g) { return '<option value="' + g.id + '"' + (f.gatilho === g.id ? " selected" : "") + ">" + esc(g.nome) + "</option>"; }).join("")}
        </select></div>
      </div>
      <div class="bt-row"><button class="bt-btn bt-btn--sm bt-right" id="em-config">Gatilhos e remetente</button></div>
    </div>
  </div>

  <div class="bt-card">
    <div class="bt-card__body--flush">
      <div class="bt-tablewrap"><table class="bt-table">
        <thead><tr><th>Quando</th><th>Assunto</th><th>Para</th><th>Situação</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="5"><div class="bt-state"><strong>Fila vazia</strong>Devolva uma SCI para revisão do solicitante e o aviso aparece aqui.</div></td></tr>'}</tbody>
      </table></div>
    </div>
  </div>
  <div id="email-modal-root"></div>`;
}

function emailVerModal(id) {
  const reg = emailFila().find(function (x) { return x.id === id; });
  if (!reg) return;
  const cfg = emailConfig();
  const root = document.getElementById("email-modal-root");
  root.innerHTML = `
  <div class="modal-backdrop" id="em-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${esc(reg.assunto)}</h3>
        <button class="icon-btn" id="em-close">${icon("x", 18)}</button>
      </div>
      <div class="bt-row" style="margin-bottom:12px">${emailStatusBadge(reg.status)}
        ${reg.refCodigo ? '<span class="bt-badge">' + esc(reg.refCodigo) + "</span>" : ""}</div>
      <div class="sci-detail-row"><span class="sci-detail-label">De</span><span class="sci-detail-value">${esc(cfg.remetenteNome)} &lt;${esc(cfg.remetente)}&gt;</span></div>
      <div class="sci-detail-row"><span class="sci-detail-label">Para</span><span class="sci-detail-value">${esc(reg.para || "—")}</span></div>
      ${reg.cc && reg.cc.length ? '<div class="sci-detail-row"><span class="sci-detail-label">Cc</span><span class="sci-detail-value">' + esc(reg.cc.join(", ")) + "</span></div>" : ""}
      <div class="sci-detail-row"><span class="sci-detail-label">Gerado em</span><span class="sci-detail-value">${new Date(reg.criadoEm).toLocaleString("pt-BR")}</span></div>
      ${reg.enviadoEm ? '<div class="sci-detail-row"><span class="sci-detail-label">Despachado</span><span class="sci-detail-value">' + new Date(reg.enviadoEm).toLocaleString("pt-BR") + " por " + esc(reg.enviadoPor || "—") + "</span></div>" : ""}
      ${reg.erro ? '<div class="bt-notice bt-notice--danger" style="margin-top:12px"><span class="bt-notice__ic">!</span><div>' + esc(reg.erro) + "</div></div>" : ""}
      <div class="sci-section-title" style="margin-top:14px;">Corpo da mensagem</div>
      <pre id="em-corpo" style="white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.6;background:var(--surface-soft);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0 0;max-height:320px;overflow:auto">${esc(reg.corpo)}</pre>
      <div class="modal-actions" style="flex-wrap:wrap">
        <button class="ghost-btn" id="em-copiar">Copiar</button>
        <button class="ghost-btn" id="em-eml2">Baixar .eml</button>
        ${reg.status === "pendente" ? '<button class="ghost-btn" id="em-cancelar">Cancelar</button>' : ""}
        ${reg.status === "pendente" ? '<button class="primary-btn" id="em-enviado">Marcar como enviado</button>' : '<button class="primary-btn" id="em-ok">Fechar</button>'}
      </div>
    </div>
  </div>`;
  const fechar = function () { root.innerHTML = ""; };
  document.getElementById("em-backdrop").onclick = fechar;
  document.getElementById("em-close").onclick = fechar;
  const ok = document.getElementById("em-ok");
  if (ok) ok.onclick = fechar;
  document.getElementById("em-copiar").onclick = function () {
    const txt = "Para: " + reg.para + "\nAssunto: " + reg.assunto + "\n\n" + reg.corpo;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(function () { alert("Mensagem copiada."); },
        function () { alert("Não foi possível copiar. Selecione o texto na tela."); });
    } else { alert("Não foi possível copiar. Selecione o texto na tela."); }
  };
  document.getElementById("em-eml2").onclick = function () { emailBaixarEml(reg.id); };
  const canc = document.getElementById("em-cancelar");
  if (canc) canc.onclick = function () {
    if (!confirm("Cancelar este aviso? Ele deixa de aparecer como pendente.")) return;
    fechar(); emailMarcar(reg.id, "cancelado");
  };
  const env = document.getElementById("em-enviado");
  if (env) env.onclick = function () { fechar(); emailMarcar(reg.id, "enviado"); };
}

function emailConfigModal() {
  const cfg = emailConfig();
  const root = document.getElementById("email-modal-root");
  root.innerHTML = `
  <div class="modal-backdrop" id="emc-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Gatilhos e remetente</h3>
        <button class="icon-btn" id="emc-close">${icon("x", 18)}</button>
      </div>
      <label class="field-label">Conta de comunicação (remetente)</label>
      <input class="modal-input" id="emc-remetente" value="${esc(cfg.remetente)}">
      <div class="bt-field__hint">No servidor, é a caixa que o Microsoft Graph usa para enviar. Precisa existir e ter a permissão de aplicativo concedida.</div>
      <label class="field-label" style="margin-top:12px;">Nome exibido</label>
      <input class="modal-input" id="emc-nome" value="${esc(cfg.remetenteNome)}">
      <label class="field-label" style="margin-top:12px;">Assinatura</label>
      <textarea class="modal-input" id="emc-assinatura" rows="3">${esc(cfg.assinatura)}</textarea>

      <div class="sci-section-title" style="margin-top:16px;">Quando avisar</div>
      <div class="bt-stack" style="gap:10px;margin-top:10px">
        ${EMAIL_GATILHOS.map(function (g) {
          return `<label class="bt-row" style="gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:14px;cursor:pointer">
            <input type="checkbox" class="emc-gatilho" value="${g.id}" ${cfg.gatilhos[g.id] ? "checked" : ""} style="margin-top:3px">
            <span><b>${esc(g.nome)}</b>
              <div class="bt-small bt-muted">Avisa ${esc(g.quem)}. ${esc(g.porque)}</div></span>
          </label>`;
        }).join("")}
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" id="emc-cancel">Cancelar</button>
        <button class="primary-btn" id="emc-save">Salvar</button>
      </div>
    </div>
  </div>`;
  const fechar = function () { root.innerHTML = ""; };
  document.getElementById("emc-backdrop").onclick = fechar;
  document.getElementById("emc-close").onclick = fechar;
  document.getElementById("emc-cancel").onclick = fechar;
  document.getElementById("emc-save").onclick = function () {
    const g = {};
    EMAIL_GATILHOS.forEach(function (x) { g[x.id] = false; });
    document.querySelectorAll(".emc-gatilho:checked").forEach(function (i) { g[i.value] = true; });
    emailSalvarConfig({
      remetente: document.getElementById("emc-remetente").value.trim(),
      remetenteNome: document.getElementById("emc-nome").value.trim(),
      assinatura: document.getElementById("emc-assinatura").value,
      gatilhos: g
    });
    fechar();
    navigateTo("email_fila");
  };
}

function attachEmailFilaEvents() {
  const liga = function (id, campo) {
    const el = document.getElementById(id);
    if (el) el.onchange = function () { EMAIL_FILTRO[campo] = this.value; navigateTo("email_fila"); };
  };
  liga("em-f-status", "status");
  liga("em-f-gatilho", "gatilho");
  const cfg = document.getElementById("em-config");
  if (cfg) cfg.onclick = emailConfigModal;
  document.querySelectorAll("[data-em-ver]").forEach(function (b) {
    b.onclick = function () { emailVerModal(this.getAttribute("data-em-ver")); };
  });
  document.querySelectorAll("[data-em-abrir]").forEach(function (b) {
    b.onclick = function () { emailAbrirNoCliente(this.getAttribute("data-em-abrir")); };
  });
  document.querySelectorAll("[data-em-eml]").forEach(function (b) {
    b.onclick = function () { emailBaixarEml(this.getAttribute("data-em-eml")); };
  });
}

/* ---------- menu e rota ---------- */

BT_PAGE_TITLES.email_fila = "Caixa de saída";

const _emPrevNavGroups = btNavGroups;
btNavGroups = function (user) {
  const grupos = _emPrevNavGroups(user);
  if (!podeVerCaixaSaida(user)) return grupos;
  const c = btCounts();
  const item = { id: "email_fila", icon: "◎", label: "Caixa de saída", badge: c.emailPendentes };
  const adm = grupos.find(function (g) { return g.label === "Administração"; });
  if (adm) adm.items.push(item);
  else grupos.push({ label: "Comunicação", items: [item] });
  return grupos;
};

const _emPrevCounts = btCounts;
btCounts = function () {
  const c = _emPrevCounts();
  try {
    c.emailPendentes = emailFila().filter(function (r) {
      return r.status === "pendente" || r.status === "sem_destinatario";
    }).length;
  } catch (e) { c.emailPendentes = 0; }
  return c;
};

BT_NAV_ICON.email_fila = "comprovante";

const _emPrevNavigate = navigateTo;
navigateTo = function (areaId) {
  const box = document.getElementById("main-content");
  if (!box) return _emPrevNavigate(areaId);
  if (areaId !== "email_fila") return _emPrevNavigate(areaId);
  STATE.activeArea = "email_fila";
  box.innerHTML = renderEmailFila();
  attachEmailFilaEvents();
  btSetPageTitle("email_fila");
  btRefreshNav();
};

</script>
<script src="/supabase-bridge.js"></script>
</body>
</html>
