name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply official technician navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove every temporary technician menu injection from previous fixes.
          for marker in [
              'BIOTROP TECH SCI SCM NAV V3',
              'BIOTROP TECH SCI SCM SIDEBAR V2',
              'BIOTROP TECH SCM FORCE',
              'BIOTROP TECH SCI SCM SIDEBAR'
          ]:
              text = re.sub(
                  r'<script>\s*/\*\s*' + re.escape(marker) + r'\s*\*/[\s\S]*?</script>\s*',
                  '', text, flags=re.I
              )

          # Normalize technician detection.
          text = re.sub(
              r'function btIsTechOnly\(user\) \{[\s\S]*?\n\}',
              '''function btIsTechOnly(user) {\n  const u = user || STATE.currentUser;\n  if (!u) return false;\n  if (isAdminUser(u)) return false;\n  const perfil = String(u.perfilId || u.perfil || u.role || u.cargo || u.funcao || "").trim().toLowerCase();\n  const nomePerfil = String(u.perfilNome || u.nomePerfil || "").trim().toLowerCase();\n  const tela = String(document.body && document.body.innerText || "").trim().toLowerCase();\n  return perfil === "tecnico" || perfil.includes("tecnico") || perfil.includes("técnico") ||\n         nomePerfil.includes("tecnico") || nomePerfil.includes("técnico") ||\n         /(^|\\n)t[eé]cnico\\s*(?:-|$)/i.test(tela);\n}''',
              text, count=1
          )

          # Replace the technician branch regardless of its old label/count.
          tech_pattern = re.compile(
              r'  if \(btIsTechOnly\(u\)\) \{[\s\S]*?\n  \}\n\n  const admin = isAdminUser\(u\);',
              re.M
          )
          tech_branch = '''  if (btIsTechOnly(u)) {\n    return [{\n      label: "Operação",\n      items: [\n        { id: "home", icon: "⌂", label: "Início" },\n        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },\n        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },\n        { id: "almoxarifado", icon: "▤", label: "Nova solicitação" },\n        { id: "almox_minhas", icon: "⊟", label: "Minhas solicitações", badge: c.minhasPendencias }\n      ]\n    }];\n  }\n\n  const admin = isAdminUser(u);'''
          text, replaced = tech_pattern.subn(tech_branch, text, count=1)
          if replaced != 1:
              raise SystemExit('Não foi possível localizar o bloco do menu do técnico')

          # The approved design keeps SCI + SCM as tabs in the shared "Nova solicitação" screen.
          # Remove the old override that stripped those tabs.
          text = re.sub(
              r'\nconst _corPrevRenderAlmox = renderAlmoxarifado;\s*\n'
              r'renderAlmoxarifado = function \(initialTab\) \{[\s\S]*?\n\};\s*\n',
              '\n', text, count=1
          )

          # Keep one Supabase bridge tag.
          tag = '<script src="/supabase-bridge.js"></script>'
          text = text.replace(tag, '')
          text = text.replace('</body>', tag + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          print('Menu do técnico corrigido: 5 itens, sem Gestão SCM; SCI + SCM nas abas da tela Nova solicitação')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fixar menu correto do técnico [skip bridge]"
          git push
