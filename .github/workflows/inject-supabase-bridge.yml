name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean legacy technician patches
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove every temporary menu injection previously added by this workflow.
          markers = [
              'BIOTROP TECH SCI SCM NAV V3',
              'BIOTROP TECH SCI SCM SIDEBAR V2',
              'BIOTROP TECH SCM FORCE',
              'BIOTROP TECH SCI SCM SIDEBAR'
          ]
          for marker in markers:
              text = re.sub(
                  r'<script>\s*/\*\s*' + re.escape(marker) + r'\s*\*/[\s\S]*?</script>\s*',
                  '', text, flags=re.I
              )

          # Remove the old override that hid SCI/SCM tabs from the shared Almox screen.
          text = re.sub(
              r'\nconst _corPrevRenderAlmox = renderAlmoxarifado;\s*\n'
              r'renderAlmoxarifado = function \(initialTab\) \{[\s\S]*?\n\};\s*\n',
              '\n', text, count=1
          )

          # The official technician menu is defined by btNavGroups() in index.html.
          # Normalize technician detection so "tecnico - teste" is also recognized.
          old = '''function btIsTechOnly(user) {\n  const u = user || STATE.currentUser;\n  if (!u) return false;\n  if (isAdminUser(u)) return false;\n  return u.perfilId === "tecnico";\n}'''
          new = '''function btIsTechOnly(user) {\n  const u = user || STATE.currentUser;\n  if (!u) return false;\n  if (isAdminUser(u)) return false;\n  const perfil = String(u.perfilId || u.perfil || u.role || u.cargo || u.funcao || "").trim().toLowerCase();\n  const nomePerfil = String(u.perfilNome || u.nomePerfil || "").trim().toLowerCase();\n  return perfil === "tecnico" || perfil.includes("tecnico") || perfil.includes("técnico") ||\n         nomePerfil.includes("tecnico") || nomePerfil.includes("técnico");\n}'''
          if old in text:
              text = text.replace(old, new, 1)

          # Keep one, and only one, Supabase bridge tag.
          tag = '<script src="/supabase-bridge.js"></script>'
          text = text.replace(tag, '')
          text = text.replace('</body>', tag + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          print('Legacy technician patches removed')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restaurar menu oficial do técnico [skip bridge]"
          git push
