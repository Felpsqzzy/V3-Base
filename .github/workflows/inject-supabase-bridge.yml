name: Validate Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar menu do técnico
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          expected = [
              'label: "Nova solicitação"',
              'label: "Nova ordem de compra"',
              'label: "Minhas solicitações"'
          ]
          missing = [x for x in expected if x not in text]
          if missing:
              raise SystemExit('Menu do técnico incompleto: ' + ', '.join(missing))
          print('OK: menu do técnico validado')
