name: Publish Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover resíduos do Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./biotrop-supabase-auth.js"></script>',
              '<script src="./supabase-realtime-bridge.js"></script>',
              '<script src="./biotrop-multiuser-ui.js"></script>'
          ]
          for tag in tags:
              s = s.replace(tag, '')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remover resíduos do Supabase do portal [skip publish]'
          git push
