name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir navegação e remover abas
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Limpa patches antigos de menu que estavam sobrescrevendo o menu final.
          markers = [
              'BIOTROP TECH SCI SCM NAV V3',
              'BIOTROP TECH SCI SCM SIDEBAR V2',
              'BIOTROP TECH SCM FORCE',
              'BIOTROP TECH SCI SCM SIDEBAR',
              'BIOTROP TECH MENU FINAL V1'
          ]
          for marker in markers:
              text = re.sub(
                  r'<script>\s*/\*\s*' + re.escape(marker) + r'\s*\*/[\s\S]*?</script>\s*',
                  '', text, flags=re.I
              )

          # O menu efetivo do técnico é o último btNavGroups. Troca somente o bloco dele.
          old = '''  if (btIsTechOnly(u)) {
    return [{
      label: "Operação",
      items: [
        { id: "home", icon: "⌂", label: "Início" },
        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },
        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },
        { id: "almoxarifado", icon: "▤", label: "Nova solicitação" },
        { id: "almox_minhas", icon: "⊟", label: "Minhas solicitações", badge: c.minhasPendencias }
      ]
    }];
  }'''
          new = '''  if (btIsTechOnly(u)) {
    return [{
      label: "Operação",
      items: [
        { id: "home", icon: "⌂", label: "Início" },
        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },
        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },
        { id: "almoxarifado", icon: "+", label: "Nova solicitação" },
        { id: "almox_scm_form", icon: "⊕", label: "Nova ordem de compra" },
        { id: "almox_minhas", icon: "⊟", label: "Minhas solicitações", badge: c.minhasPendencias }
      ]
    }];
  }'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              # Fallback: substitui o último bloco técnico existente dentro do último btNavGroups.
              matches = list(re.finditer(r'if \(btIsTechOnly\(u\)\) \{[\s\S]*?\n  \}', text))
              if not matches:
                  raise SystemExit('Bloco do técnico não encontrado')
              m = matches[-1]
              text = text[:m.start()] + new[2:] + text[m.end():]

          # Remove qualquer wrapper anterior para não acumular overrides.
          text = re.sub(
              r'<script>\s*/\*\s*BIOTROP ALMOX NO TABS V1\s*\*/[\s\S]*?</script>\s*',
              '', text, flags=re.I
          )

          # Remove as abas internas de Almoxarifado; SCI e SCM ficam somente no menu lateral.
          no_tabs = '''<script>
/* BIOTROP ALMOX NO TABS V1 */
(function(){
  var _btRenderAlmox = window.renderAlmoxarifado || null;
  if (typeof _btRenderAlmox !== "function") return;
  window.renderAlmoxarifado = function(initialTab){
    var html = _btRenderAlmox(initialTab);
    return html.replace(/<div class="tabs-row">[\\s\\S]*?<\\/div>\\s*(?=<div id="almox-tab-content")/i, "");
  };
})();
</script>'''
          text = text.replace('</body>', no_tabs + '\n</body>', 1)

          # Mantém exatamente uma ponte com Supabase.
          tag = '<script src="/supabase-bridge.js"></script>'
          text = text.replace(tag, '')
          text = text.replace('</body>', tag + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          print('OK: Técnico com SCI e SCM separados no menu lateral; abas removidas')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Separar SCI e SCM no menu lateral do tecnico [skip bridge]"
          git push
