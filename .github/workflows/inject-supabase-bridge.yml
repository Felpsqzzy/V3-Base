name: Publish correct Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ativar ponte online no index
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./supabase-realtime-bridge.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              else:
                  s = tag + '\n' + s
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase-realtime-bridge.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ativar sincronização online Supabase [skip publish]'
          git push
