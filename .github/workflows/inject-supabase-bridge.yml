name: Publish correct Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicar HTML correto como index
        shell: bash
        run: |
          set -euo pipefail
          test -f BIOTROP-Manutencao-LOCAL.html
          cp BIOTROP-Manutencao-LOCAL.html index.html
          rm -f BIOTROP-Manutencao-LOCAL.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publicar HTML correto como index [skip publish]'
          git push
