name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply official technician navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove all temporary technician menu injections from previous attempts.
          for marker in [
              'BIOTROP TECH SCI SCM NAV V3',
              'BIOTROP TECH SCI SCM SIDEBAR V2',
              'BIOTROP TECH SCM FORCE',
              'BIOTROP TECH SCI SCM SIDEBAR'
          ]:
              text = re.sub(
                  r'<script>\s*/\*\s*' + re.escape(marker) + r'\s*\*/[\s\S]*?</script>\s*',
                  '', text, flags=re.I
              )

          # Technician detection must work for accounts such as "Técnico - teste".
          text = re.sub(
              r'function btIsTechOnly\(user\) \{[\s\S]*?\n\}',
              '''function btIsTechOnly(user) {\n  const u = user || STATE.currentUser;\n  if (!u) return false;\n  if (isAdminUser(u)) return false;\n  const perfil = String(u.perfilId || u.perfil || u.role || u.cargo || u.funcao || "").trim().toLowerCase();\n  const nomePerfil = String(u.perfilNome || u.nomePerfil || "").trim().toLowerCase();\n  const tela = String(document.body && document.body.innerText || "").trim().toLowerCase();\n  return perfil === "tecnico" || perfil.includes("tecnico") || perfil.includes("técnico") ||\n         nomePerfil.includes("tecnico") || nomePerfil.includes("técnico") ||\n         /(^|\\n)t[eé]cnico\\s*(?:-|$)/i.test(tela);\n}''',
              text, count=1
          )

          # Official technician sidebar: exactly five items. No Gestao SCM in the sidebar.
          old_branch = '''  if (btIsTechOnly(u)) {\n    return [{\n      label: "Operação",\n      items: [\n        { id: "home", icon: "⌂", label: "Início" },\n        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },\n        { id: "utilidades", icon: "⏱", label: "Apontar Horímetros" },\n        { id: "almoxarifado", icon: "▤", label: "Almoxarifado" }\n      ]\n    }];\n  }'''
          new_branch = '''  if (btIsTechOnly(u)) {\n    return [{\n      label: "Operação",\n      items: [\n        { id: "home", icon: "⌂", label: "Início" },\n        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },\n        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },\n        { id: "almoxarifado", icon: "▤", label: "Nova solicitação" },\n        { id: "almox_minhas", icon: "⊟", label: "Minhas solicitações", badge: c.minhasPendencias }\n      ]\n    }];\n  }'''
          if old_branch in text:
              text = text.replace(old_branch, new_branch, 1)

          # Keep the shared Almox form tabs. This is where the technician gets Nova Solicitação (SCI)
          # and Nova Compra (SCM), exactly as the approved product specification defines it.
          text = re.sub(
              r'\nconst _corPrevRenderAlmox = renderAlmoxarifado;\s*\nrenderAlmoxarifado = function \(initialTab\) \{[\s\S]*?\n\};\s*\n',
              '\n', text, count=1
          )

          # Keep one Supabase bridge tag.
          tag = '<script src="/supabase-bridge.js"></script>'
          text = text.replace(tag, '')
          text = text.replace('</body>', tag + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          print('Technician menu normalized: 5 items, no Gestão SCM; SCI/SCM remain in shared form tabs')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir visão oficial do técnico SCI SCM [skip bridge]"
          git push
