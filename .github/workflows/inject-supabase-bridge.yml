name: Publish Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ativar autenticação PostgreSQL no index
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f biotrop-postgres-auth.js
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_tags = [
              '<script src="./biotrop-supabase-auth.js"></script>',
              '<script src="./supabase-realtime-bridge.js"></script>',
              '<script src="./supabase-bridge.js"></script>',
              '<script src="./biotrop-multiuser-ui.js"></script>'
          ]
          for tag in old_tags:
              s = s.replace(tag, '')
          tag = '<script src="./biotrop-postgres-auth.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              else:
                  s = tag + '\n' + s
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html biotrop-postgres-auth.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ativar autenticação PostgreSQL no portal [skip publish]'
          git push
