name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Garantir Supabase bridge
        shell: bash
        run: |
          set -e
          tag='<script src="/supabase-bridge.js"></script>'
          sed -i "s#${tag}##g" index.html
          sed -i "s#</body>#${tag}</body>#" index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Garantir Supabase bridge [skip bridge]'
          git push
