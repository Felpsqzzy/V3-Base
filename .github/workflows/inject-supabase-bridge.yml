name: Inject Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject bridge and technician SCM shortcut
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Ponte Supabase
          tag = '<script src="/supabase-bridge.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html sem </body>')
              text = text.replace(marker, tag + '\n' + marker, 1)

          # Visão do técnico: manter a operação enxuta, mas com acesso direto à SCM.
          old = '''        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },\n        { id: "almoxarifado", icon: "▤", label: "Almoxarifado" }'''
          new = '''        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },\n        { id: "almoxarifado", icon: "▤", label: "Almoxarifado" },\n        { id: "almox_scm_form", icon: "🛒", label: "Nova SCM" }'''

          if old in text and 'label: "Nova SCM"' not in text[text.find('if (btIsTechOnly(u)) {'):text.find('if (btIsTechOnly(u)) {') + 1800]:
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          print('index ok')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Garantir SCM no menu do tecnico [skip bridge]"
          git push
