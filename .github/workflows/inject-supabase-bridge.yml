name: Assemble exact HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ contains(github.event.head_commit.message, '[assemble-html]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar index.html exato
        shell: bash
        run: |
          set -e
          cat .html-parts/chunk*.txt | base64 -d | gzip -d > index.html
          test -s index.html
          rm -rf .html-parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .html-parts
          git commit -m 'Substituir index pelo HTML correto [skip assemble]' || true
          git push
