name: Maintain Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar menu do tecnico
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove previous menu patches generated by earlier attempts.
          for marker in [
              'BIOTROP TECH SCI SCM NAV V3',
              'BIOTROP TECH SCI SCM SIDEBAR V2',
              'BIOTROP TECH SCM FORCE',
              'BIOTROP TECH SCI SCM SIDEBAR',
              'BIOTROP TECH MENU FINAL V1'
          ]:
              text = re.sub(r'<script>\s*/\*\s*' + re.escape(marker) + r'\s*\*/[\s\S]*?</script>\s*', '', text, flags=re.I)

          # The technician sidebar must be the same creation concept as Admin:
          # Nova solicitação (SCI) and Nova ordem de compra (SCM), plus the common personal entries.
          pat = re.compile(r'function btNavGroups\(user\) \{([\s\S]*?)\n\}\n\n(?:/\*|const _)', re.M)
          m = pat.search(text)
          if not m:
              raise SystemExit('btNavGroups não encontrado')

          block = m.group(0)
          tech_pat = re.compile(r'  if \(btIsTechOnly\(u\)\) \{[\s\S]*?\n  \}\n\n  const admin = isAdminUser\(u\);', re.M)
          new_tech = '''  if (btIsTechOnly(u)) {
    return [{
      label: "Operação",
      items: [
        { id: "home", icon: "⌂", label: "Início" },
        { id: "lms_my", icon: "▣", label: "Treinamentos", badge: c.trainings },
        { id: "utilidades", icon: "⏱", label: "Apontar consumo" },
        { id: "almoxarifado", icon: "+", label: "Nova solicitação" },
        { id: "almox_scm_form", icon: "⊕", label: "Nova ordem de compra" },
        { id: "almox_minhas", icon: "⊟", label: "Minhas solicitações", badge: c.minhasPendencias }
      ]
    }];
  }

  const admin = isAdminUser(u);'''
          block2, changed = tech_pat.subn(new_tech, block, count=1)
          if changed != 1:
              raise SystemExit('Bloco do técnico não encontrado')
          text = text[:m.start()] + block2 + text[m.end():]

          # Keep exactly one Supabase bridge tag.
          tag = '<script src="/supabase-bridge.js"></script>'
          text = text.replace(tag, '')
          text = text.replace('</body>', tag + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          print('OK: Técnico com Nova solicitação + Nova ordem de compra; sem Gestão SCM')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir sidebar do tecnico para SCI e SCM [skip bridge]"
          git push
