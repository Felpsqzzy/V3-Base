name: Publish Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar index, login PostgreSQL, sincronização multiusuário e tela inicial
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f biotrop-postgres-auth.js
          test -f biotrop-data-sync.js
          test -f login-hero.css
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove integrações legadas que não devem voltar ao projeto.
          old_tags = [
              '<script src="./biotrop-supabase-auth.js"></script>',
              '<script src="./supabase-realtime-bridge.js"></script>',
              '<script src="./supabase-bridge.js"></script>',
              '<script src="./biotrop-multiuser-ui.js"></script>'
          ]
          for tag in old_tags:
              s = s.replace(tag, '')

          # Autenticação PostgreSQL/API.
          pg_tag = '<script src="./biotrop-postgres-auth.js"></script>'
          if pg_tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, '  ' + pg_tag + '\n' + marker, 1)
              else:
                  s = pg_tag + '\n' + s

          # Sincronização multiusuário PostgreSQL (polling de 3s + conflitos).
          sync_tag = '<script src="./biotrop-data-sync.js"></script>'
          if sync_tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, '  ' + sync_tag + '\n' + marker, 1)
              else:
                  s = sync_tag + '\n' + s

          # Acabamento da tela inicial/login.
          css_tag = '<link rel="stylesheet" href="./login-hero.css">'
          if css_tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, '  ' + css_tag + '\n' + marker, 1)
              else:
                  s = css_tag + '\n' + s

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html login-hero.css biotrop-data-sync.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ativar sincronização multiusuário PostgreSQL [skip publish]'
          git push
