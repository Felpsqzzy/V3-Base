name: Publish Biotrop HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar portal PostgreSQL multiusuário
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f biotrop-postgres-auth.js
          test -f biotrop-data-sync.js
          test -f login-hero.css

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove qualquer injeção legada do Supabase.
          old_tags = [
              '<script src="./biotrop-supabase-auth.js"></script>',
              '<script src="./supabase-realtime-bridge.js"></script>',
              '<script src="./supabase-bridge.js"></script>',
              '<script src="./biotrop-multiuser-ui.js"></script>'
          ]
          for tag in old_tags:
              s = s.replace(tag, '')

          # Remove o aviso e o link de recuperação da versão local.
          s = re.sub(r'<div[^>]*class=["\']demo-note["\'][^>]*>.*?</div>\s*', '', s, flags=re.I | re.S)
          s = re.sub(r'<div[^>]*>\s*<button[^>]*id=["\']reset-local-btn["\'][^>]*>.*?</button>\s*</div>\s*', '', s, flags=re.I | re.S)

          # O texto antigo não pode mais aparecer na interface.
          s = re.sub(r'Versão local\s*\(offline\)\.\s*Os dados ficam salvos apenas neste navegador\.?\s*', '', s, flags=re.I)
          s = re.sub(r'Não consigo entrar\s*[·•-]\s*recriar acesso padrão', '', s, flags=re.I)
          s = s.replace('Versão local · dados neste navegador', 'Acesso online · dados sincronizados')
          s = s.replace('Versão local - dados neste navegador', 'Acesso online · dados sincronizados')

          # Garante que a autenticação e a sincronização atuais estão presentes.
          marker = '</head>'
          pg_tag = '<script src="./biotrop-postgres-auth.js"></script>'
          sync_tag = '<script src="./biotrop-data-sync.js"></script>'
          css_tag = '<link rel="stylesheet" href="./login-hero.css">'
          if marker in s:
              for tag in (pg_tag, sync_tag, css_tag):
                  if tag not in s:
                      s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
          else:
              for tag in (pg_tag, sync_tag, css_tag):
                  if tag not in s:
                      s = tag + '\n' + s

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html login-hero.css biotrop-data-sync.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remover modo local do portal e publicar multiusuario [skip publish]'
          git push
