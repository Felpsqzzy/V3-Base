name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check - APIs
        shell: bash
        run: |
          set -euo pipefail
          find api -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Syntax check - server scripts
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.cjs' -print0 | xargs -0 -n1 node --check
